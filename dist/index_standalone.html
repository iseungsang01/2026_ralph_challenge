<p>딥마인드(DeepMind)의 WaveNet은 전혀 다른 길을 택했다. 소리는 결국 1초에 수만 번 진동하는 공기 압력의 수열인데, 이 <b>수열의 다음 값을 직전까지의 값들을 보고 하나씩 예측</b>해 파형 자체를 처음부터 그려낸다. 점을 하나씩 찍어 그림을 완성하는 점묘화에 비유할 수 있다. 비유에서 점 하나는 실제로 파형의 샘플 하나에 해당하고, "이미 찍은 점들을 보고 다음 점의 위치를 정하는 것"은 이전 샘플들을 조건으로 다음 샘플의 확률을 계산하는 자기회귀(autoregressive) 생성에 해당한다.</p>
<p>이렇게 만든 음성은 청취 평가에서 기존 두 방식을 크게 앞섰고 사람 목소리에 한층 가까워졌다. 같은 모델이 피아노 음악처럼 말이 아닌 소리도 만들어낼 수 있어, "파형을 직접 다루는 생성 모델"이라는 새 장르를 열었다. 다만 샘플을 한 개씩 순서대로 만들어야 해서 생성 속도가 매우 느리다는 약점이 있었고, 이는 이후 고속화 연구의 출발점이 됐다.</p>`,
      mid: `<p>WaveNet의 과제는 초당 1만 6천 개 수준의 샘플 시퀀스에서 다음 샘플의 조건부 확률을 계산하는 것이다. 핵심 설계는 세 가지다.</p>
<p>첫째, <b>인과적 합성곱(causal convolution)</b>. 순환 신경망 대신 합성곱 신경망을 쓰되, 각 시점의 출력이 미래 샘플을 보지 못하도록 합성곱을 과거 방향으로만 연결한다. RNN과 달리 학습 시 전체 시퀀스를 병렬로 처리할 수 있다.</p>
<p>둘째, <b>팽창 합성곱(dilated convolution)</b>. 보통의 합성곱만 쌓으면 참조 가능한 과거 범위, 즉 수용 영역(receptive field)이 층수에 비례해 천천히 늘어난다. WaveNet은 층이 올라갈수록 입력을 1칸, 2칸, 4칸, 8칸씩 건너뛰며 연결해, 수용 영역을 층수에 대해 지수적으로 넓힌다. 수백 밀리초의 문맥을 수십 개 층으로 커버할 수 있다.</p>
<p>셋째, <b>출력의 이산화</b>. 다음 샘플 값을 연속값 회귀로 예측하는 대신, 뮤 법칙(mu-law) 압신으로 파형을 256단계로 양자화하고 256개 중 하나를 고르는 분류(softmax)로 예측한다. 분포의 형태에 아무 가정이 없어 회귀보다 유연하게 임의의 다봉 분포를 표현한다.</p>
<p>여기에 화자 정체성 같은 전역 조건과 텍스트에서 뽑은 언어 특징 같은 국소 조건을 각 층의 게이트 활성에 주입하면 조건부 생성, 즉 특정 화자의 텍스트 음성 합성(TTS)이 된다. 잔차 연결(residual connection)과 스킵 연결(skip connection)로 수십 개 층을 안정적으로 학습시키는 구조도 특징이다.</p>`,
      deep: `<p>모델은 파형 x = {x₁, …, x<sub>T</sub>}의 결합 확률을 자기회귀로 분해한다: p(x) = Π<sub>t</sub> p(x<sub>t</sub> | x₁, …, x<sub>t−1</sub>). 이 조건부 분포를 다음의 합성곱 스택으로 계산한다.</p>
<ol>
<li><b>뮤 법칙 양자화:</b> 16비트 파형을 그대로 65,536-way 분류로 다루는 대신, f(x) = sign(x)·ln(1+μ|x|)/ln(1+μ) (μ=255)로 비선형 압축한 뒤 256단계로 양자화한다. 사람 청각이 작은 진폭 차이에 민감한 성질을 이용해 256단계로도 지각 품질을 유지한다.</li>
<li><b>인과적 팽창 합성곱 스택:</b> 각 층의 팽창 계수를 1, 2, 4, …, 512로 두 배씩 늘리고 이 블록을 여러 번 반복한다. 팽창 계수 d인 층은 시점 t와 t−d를 연결하므로, 블록 하나로 1024 샘플의 수용 영역을 얻고 블록 반복으로 이를 더 넓힌다.</li>
<li><b>게이트 활성:</b> 각 층의 변환은 z = tanh(W<sub>f</sub> ∗ x) ⊙ σ(W<sub>g</sub> ∗ x)이다. 여기서 ∗는 팽창 합성곱, ⊙는 성분별 곱, σ는 시그모이드, W<sub>f</sub>와 W<sub>g</sub>는 각각 필터와 게이트의 가중치다. PixelCNN 계열에서 가져온 이 게이트 구조가 단순 ReLU보다 오디오에서 잘 작동했다.</li>
<li><b>잔차·스킵 연결:</b> 각 층의 출력은 잔차 연결로 다음 층에 전달되고, 동시에 스킵 연결로 최상단에 모여 1×1 합성곱과 softmax를 거쳐 256-way 분포가 된다.</li>
<li><b>조건부 생성:</b> 전역 조건(화자 임베딩)은 모든 시점에 동일하게, 국소 조건(언어 특징·기본 주파수 등)은 시간 해상도를 업샘플링해 시점별로 게이트 활성 내부에 더해진다. 이것이 TTS 모드다.</li>
</ol>
<p>학습은 정답 파형에 대한 다음 샘플 분류(교차 엔트로피)이며 전 시점을 병렬로 계산할 수 있다. 반면 생성은 정의상 순차적이어서 1초 분량에 수만 번의 순전파가 필요했고, 이 비용이 실서비스의 걸림돌이었다. 이후 확률 밀도 증류(probability density distillation)로 병렬 생성을 가능케 한 Parallel WaveNet이 이 문제를 풀어 구글의 실제 서비스 음성에 쓰인 것으로 알려져 있다.</p>
<p>평가에서는 영어·중국어 TTS 청취 평가(MOS)에서 연결 합성과 파라메트릭 합성 기준선을 모두 유의미하게 앞섰고, 화자 조건을 바꾸면 한 모델이 여러 목소리를 내는 것, 음악·음소 인식 등 다른 오디오 과제로의 확장도 함께 시연됐다.</p>`
    },
    impact: `<p>WaveNet은 "원시 파형을 직접 생성한다"는 발상이 실제로 가능함을 보여 뉴럴 보코더(neural vocoder)라는 분야를 만들었다. <a href="#/item/tacotron2-2017">Tacotron 2</a>는 WaveNet을 멜 스펙트로그램 조건 보코더로 채택해 자연스러운 TTS 체계를 완성했고, WaveRNN·WaveGlow·HiFi-GAN 등 후속 보코더 연구가 속도 문제를 공략했다. 팽창 합성곱과 자기회귀 이산 분포 모델링이라는 설계는 오디오를 넘어 시계열 생성 전반에 영향을 줬고, "오디오를 이산 값의 시퀀스로 다룬다"는 관점은 <a href="#/item/vall-e-2023">VALL-E</a> 같은 코덱 언어 모델로 이어지는 사상적 원류가 됐다.</p>`,
    uncertainty: []
  }
});

      mid: `<p>바뀐 것은 파이프라인의 앞단이다. 기존 WaveNet TTS는 수작업 설계된 텍스트 분석기가 만든 언어 특징(음소, 지속시간, 기본 주파수 등)을 조건으로 받았지만, Tacotron 2는 <b>문자 시퀀스에서 멜 스펙트로그램 프레임 시퀀스로의 변환을 어텐션 기반 seq2seq로 직접 학습</b>한다. 인코더가 문자를 표현 벡터로 바꾸고, 디코더가 어텐션으로 문자 위치를 짚어가며 프레임을 한 단계씩 예측한다. 멜 스펙트로그램은 저차원이라 예측하기 쉬우면서 파형 복원에 충분한 정보를 담는 좋은 중간 표현임이 확인됐다. 뒷단의 <a href="#/item/wavenet-2016">WaveNet</a> 보코더는 언어 특징 대신 멜 스펙트로그램을 조건으로 받도록 수정됐고, 조건이 풍부해진 덕에 원판보다 작은 구조로도 고품질 파형을 만들었다.</p>`,

      intro: `<p>음성 인식기를 만들려면 "음성 + 받아쓴 텍스트" 쌍이 대량으로 필요했다. 문제는 받아쓰기(전사)에 사람 손이 많이 들고, 세계 대부분의 언어에는 그런 데이터가 거의 없다는 것이다. 반면 전사 없는 음성 자체는 어디에나 넘쳐난다.</p>

      mid: `<p>구조는 세 부분이다. (1) <b>특징 인코더:</b> 원시 파형에 합성곱 층을 여러 개 적용해 약 20밀리초 간격의 잠재 벡터 시퀀스로 압축한다. (2) <b>양자화 모듈:</b> 각 잠재 벡터를 학습된 코드북(codebook)의 이산 코드로 바꾼다. 이 이산 표현이 대조 학습의 "정답 목표"가 된다. (3) <b>문맥 네트워크:</b> 잠재 벡터 시퀀스의 일부 구간을 마스킹한 뒤 트랜스포머에 넣어, 앞뒤 문맥을 반영한 표현을 만든다.</p>

<li><b>특징 인코더:</b> 원시 파형을 7층 시간 합성곱으로 압축해 잠재 시퀀스 z₁, …, z<sub>T</sub>를 얻는다(스트라이드 누적 약 20ms, 수용 영역 약 25ms).</li>
<li><b>양자화:</b> 각 z<sub>t</sub>를 곱 양자화(product quantization)로 이산화한다. G개의 코드북 그룹마다 V개 항목 중 하나를 골라 이어 붙여 q<sub>t</sub>를 만든다. 항목 선택은 미분 불가능하므로 Gumbel-softmax로 이완해 역전파를 흘린다.</li>

<p>LibriSpeech 평가에서 대형 모델은 라벨 960시간을 모두 썼을 때 당시 최고 수준의 단어 오류율을 보였고, 라벨을 10시간·1시간·10분으로 줄여도 성능 저하가 완만했다. 설계 요소별 절제 실험에서는 대조 목표를 연속 잠재 벡터가 아니라 양자화된 이산 표현에 거는 것, 그리고 마스킹 스팬을 겹치게 여러 개 뽑는 것이 성능에 중요함이 확인됐다. 후속 연구는 이 프레임에서 목표 표현과 손실을 바꾸는 방향(<a href="#/item/hubert-2021">HuBERT</a>의 클러스터 예측 등)과 다국어 확장(XLSR 계열)으로 갈라진다.</p>`

    levels: {

      mid: `<p>이 논문이 정의한 문제는 시각운동 정책(visuomotor policy) 학습이다. 정책은 카메라 영상과 로봇의 관절 상태를 입력받아 관절 토크를 출력하는 합성곱 신경망(CNN)이고, 인식과 제어를 분리하지 않고 이 네트워크 전체를 과제 목표로 함께 최적화한다. 문제는 학습 방법이다. 수십만 파라미터의 정책을 실제 로봇에서 순수 강화학습(reinforcement learning)으로 처음부터 학습하기에는 시도 횟수가 감당이 안 된다.</p>
<p>해법이 유도 정책 탐색(guided policy search, GPS)이다. 학습을 두 단계로 쪼갠다. (1) 개별 상황(물체 위치가 알려진 몇 개의 초기 조건)마다, 전체 상태를 관측할 수 있다는 유리한 조건에서 궤적 최적화로 그 상황 전용의 국소 제어기(local controller)를 만든다. 국소 제어기는 신경망보다 훨씬 저차원이라 적은 시도로 학습된다. (2) 국소 제어기들이 만든 성공 궤적을 지도학습(supervised learning) 데이터로 삼아, 카메라 영상만 보는 신경망 정책이 이를 재현하도록 학습한다. 이때 국소 제어기와 신경망이 서로 크게 어긋나지 않도록 제약을 걸고 두 단계를 번갈아 반복해, 신경망이 실제로 따라 할 수 있는 궤적만 교사가 제시하게 만든다.</p>
<p>시각 처리에는 공간 소프트맥스(spatial softmax)라는 장치를 넣었다. 합성곱 특징 맵의 각 채널을 "이 특징이 이미지 어디에서 활성화되는가"의 확률 분포로 바꾸고 그 기대 좌표만 뽑아, 특징별 2차원 위치 목록으로 압축한다. 조작 과제에서 중요한 것은 물체와 손의 위치이므로, 이 표현은 적은 파라미터로 과제에 필요한 공간 정보를 정확히 전달한다. 학습 시 교사는 물체의 실제 위치를 알지만 최종 정책은 영상과 관절 상태만 쓰므로, 배포 시에는 별도의 물체 추적 시스템이 전혀 필요 없다.</p>`,
      deep: `<p>학습 파이프라인을 단계별로 따라가면 다음과 같다. 표기는 상태 x<sub>t</sub>, 행동(토크) u<sub>t</sub>, 관측(영상+관절 정보) o<sub>t</sub>, 신경망 정책 π<sub>θ</sub>(u<sub>t</sub>|o<sub>t</sub>), 초기 조건 i별 국소 제어기 p<sub>i</sub>(u<sub>t</sub>|x<sub>t</sub>)다.</p>
<ol>
<li><b>국소 궤적 최적화:</b> 각 초기 조건에서 시간가변 선형-가우시안 제어기 p<sub>i</sub>(u<sub>t</sub>|x<sub>t</sub>) = N(K<sub>t</sub>x<sub>t</sub>+k<sub>t</sub>, C<sub>t</sub>)를 iLQG로 최적화한다. 동역학은 실제 롤아웃 데이터에 선형-가우시안 모델을 국소 적합해 추정하며, 반복마다 이전 제어기와의 KL 발산(KL divergence)을 제한해 모델이 유효한 영역 안에서만 갱신한다.</li>
<li><b>지도학습 단계:</b> 국소 제어기들이 생성한 (o<sub>t</sub>, u<sub>t</sub>) 샘플로 π<sub>θ</sub>를 학습한다. 목적은 각 궤적 분포에 대한 정책의 조건부 우도 최대화, 즉 KL(p<sub>i</sub> ‖ π<sub>θ</sub>) 최소화에 해당한다.</li>
<li><b>제약된 교대 최적화:</b> 궤적 최적화의 비용에 "정책과 가까워야 한다"는 항을 넣어, 전체를 제약 최적화 minimize E[cost] s.t. p<sub>i</sub>(u<sub>t</sub>|x<sub>t</sub>) = π<sub>θ</sub>(u<sub>t</sub>|o<sub>t</sub>) 로 두고 BADMM(Bregman ADMM) 형태의 쌍대 변수로 두 단계를 결합한다. 반복이 진행되면 교사와 학생이 같은 행동 분포로 수렴한다.</li>
<li><b>네트워크 구조:</b> 영상은 합성곱 3층을 거쳐 특징 맵 a<sub>cij</sub>(채널 c, 위치 i,j)가 되고, 공간 소프트맥스 s<sub>cij</sub> = exp(a<sub>cij</sub>) / Σ<sub>i′j′</sub> exp(a<sub>ci′j′</sub>) 로 채널별 확률 분포를 만든 뒤 기대 좌표 (Σ s<sub>cij</sub>·x<sub>ij</sub>, Σ s<sub>cij</sub>·y<sub>ij</sub>)만 추출한다. 이 특징점 목록을 관절 각도·속도와 이어붙여 완전연결층이 토크를 출력한다.</li>
<li><b>비대칭 정보 구조:</b> 학습 중 국소 제어기는 물체 위치를 포함한 전체 상태 x<sub>t</sub>를 쓰지만, 최종 정책은 관측 o<sub>t</sub>만 쓴다. 완전 관측에서 푼 해를 부분 관측 정책으로 증류하는 이 구조는 이후 로봇 학습에서 표준 설계(교사-학생 학습, 비대칭 액터-크리틱)로 반복된다.</li>
</ol>
<p>실험은 PR2 로봇의 옷걸이 걸기, 장난감 블록 끼우기, 병뚜껑 조립 등 접촉이 많은 조작 과제로, 픽셀 입력 정책이 사람이 설계한 파이프라인 없이 과제를 수행함을 보였다. 한계도 명확했다. 국소 제어기 학습에 물체 위치 계측이 필요하고, 초기 조건 몇 개 주변에서만 일반화되며, 과제마다 새로 학습해야 한다. 이 한계들이 이후 시뮬레이션 전이·대규모 시연 수집·파운데이션 모델이라는 세 갈래 후속 흐름의 출발점이 된다.</p>`

    impact: `<p>"픽셀에서 토크까지"라는 문구로 요약되는 이 연구는 로봇 제어를 모듈 파이프라인 설계에서 단일 신경망 학습 문제로 재정의했고, 심층학습을 실제 로봇 조작에 접목한 초기 대표 사례가 됐다. 공간 소프트맥스는 이후 로봇 시각 정책의 표준 부품으로 자리 잡았고, 완전 관측 교사로 부분 관측 학생을 가르치는 구조는 시뮬레이션 기반 로봇 학습 전반에 이어졌다. 무엇보다 RT-1, Diffusion Policy 등 이후의 시각운동 정책 계보가 모두 이 논문이 세운 "관측에서 행동으로 가는 end-to-end 학습"이라는 문제 설정 위에 서 있다.</p>`,

      deep: `<p>구현은 물체 위치 추정(localization) 과제로 검증됐다. 렌더러에서 매 장면마다 무작위화하는 항목은 (1) 탁자 위 대상 물체와 방해 물체의 텍스처, (2) 조명의 위치·방향·반사 특성, (3) 카메라의 위치·방향·시야각, (4) 방해 물체의 개수와 배치, (5) 렌더링에 더하는 노이즈다. 이렇게 생성한 수만~수십만 장 규모의 합성 이미지로, 단안 카메라 영상에서 대상 물체의 탁자 위 3차원 좌표를 회귀하는 CNN을 학습했다. 실측 실험에서 실제 이미지를 전혀 쓰지 않은 이 검출기가 센티미터 수준 오차로 물체 위치를 추정했고, 그 출력만으로 실제 로봇 팔이 어수선한 탁자에서 지정된 물체를 집는 데 성공했다. 저자들은 무작위화 항목을 제거하는 절제 실험으로 텍스처·카메라 무작위화와 방해 물체의 존재가 전이 성능에 특히 중요함을 보였다. 학습 시점에 현실의 분포를 모른 채 분포의 폭으로 현실을 덮는다는 이 설계는, 이후 <a href="#/item/dactyl-2019">Dactyl</a>의 자동 도메인 무작위화(automatic domain randomization)처럼 무작위화 범위 자체를 학습 중에 조절하는 방향으로 확장된다.</p>`

      mid: `<p>선행 대비 변경점은 세 가지다. (1) 자동 도메인 무작위화(automatic domain randomization, ADR): 고정 범위로 흔들던 기존 방식과 달리, 각 무작위화 파라미터의 범위를 정책 성공률이 기준을 넘을 때마다 자동으로 넓힌다. 커리큘럼이 사람 손을 떠나 성능에 연동된다. (2) 규모: <a href="#/item/ppo-2017">PPO</a> 기반 대규모 분산 강화학습으로 순환 신경망(LSTM) 정책을 수천 CPU·수백 GPU급 자원에서 장기간 학습했다. (3) 분업: 큐브를 어떤 순서로 돌릴지는 기존 큐브 해법 알고리즘이 계산하고, 학습된 정책은 "지정된 면을 돌리기·큐브 뒤집기"라는 물리 조작만 담당한다. 시각 추정 네트워크도 ADR이 적용된 합성 영상만으로 학습됐다.</p>`,

    levels: {
      intro: `<p>대형 언어 모델은 "음료를 쏟았어, 도와줘" 같은 말을 듣고 "스펀지를 찾는다, 집는다, 가져간다" 같은 그럴듯한 계획을 세울 줄 안다. 문제는 언어 모델이 <b>지식은 많지만 현장을 한 번도 본 적 없는 본사 컨설턴트</b>라는 점이다. 로봇 앞에 스펀지가 없어도 태연히 "스펀지를 집으세요"라고 말한다. SayCan의 아이디어는 이 컨설턴트 옆에 <b>현장을 훤히 아는 매장 직원</b>을 붙이는 것이다. 컨설턴트가 다음 단계 후보마다 "얼마나 도움이 되는가" 점수를 매기면, 직원은 후보마다 "지금 여기서 실제로 되는가" 점수를 매긴다. 두 점수를 곱해 가장 높은 행동을 실행한다.</p>

      mid: `<p>SayCan의 전제는 로봇이 스킬 라이브러리를 갖고 있다는 것이다. "스펀지를 집는다", "탁자로 간다" 같은 짧은 언어 설명이 붙은 수백 개의 저수준 스킬을 모방학습과 강화학습으로 미리 학습해 두고, 각 스킬에는 현재 관측에서 성공 확률을 추정하는 가치 함수를 함께 둔다.</p>
<p>실행 루프는 다음과 같다. 사용자 지시와 지금까지 수행한 단계들을 프롬프트로 만들고, 스킬 후보 각각에 대해 LLM에게 "이 스킬 설명이 다음 단계로 이어질 확률"을 묻는다. 이때 LLM이 자유롭게 문장을 생성하게 하지 않고, 각 스킬 설명 문자열이 프롬프트 뒤에 이어질 우도(likelihood)를 계산하는 채점 방식을 쓴다. 생성 방식은 로봇이 할 수 없는 행동을 지어내지만, 채점 방식은 후보가 실제 보유 스킬로 한정되기 때문이다. 다음으로 각 스킬의 가치 함수가 현재 카메라 영상 기준의 성공 확률을 내면, 두 확률을 곱한 값이 가장 큰 스킬을 실행한다. 실행이 끝나면 그 단계를 프롬프트에 덧붙이고 루프를 반복하며, "완료" 스킬이 선택되면 종료한다.</p>

      deep: `<p>형식화하면 다음과 같다. 스킬 집합을 Π, 스킬 π ∈ Π의 언어 설명을 ℓ<sub>π</sub>, 사용자 지시를 i, 현재 상태(관측)를 s라 하자. SayCan이 매 단계 고르는 스킬은</p>

    levels: {
      intro: `<p>이전까지 정밀한 양팔 조작은 고가의 산업용 로봇과 정교한 센서의 영역이었다. 이 연구의 변경점은 문제를 하드웨어가 아니라 학습으로 푸는 것이다. ALOHA는 취미용 부품 수준의 저가 로봇 팔 네 대(조종용 두 대, 작업용 두 대)로 만든 원격조작 장비로, 사람이 조종 팔을 잡고 움직이면 작업 팔이 그대로 따라 하며 시연이 기록된다. ACT는 그 시연을 학습하는 방법인데, 다음 한 걸음이 아니라 <b>몇 초 분량의 동작 묶음을 한 번에 계획</b>한다. 서예에서 획을 하나 긋고 멈춰 고민하기를 반복하면 손떨림이 쌓이지만, 한 글자를 이어서 쓰면 흐름이 유지되는 것과 같다. 비유에서 "한 글자 이어 쓰기"는 미래 수십 스텝의 행동을 묶어 예측하는 행동 청킹(action chunking)에 해당하고, 줄어드는 손떨림은 스텝마다 쌓이던 예측 오차(누적 오차)에 해당한다. 이 조합으로 케이블 타이 끼우기, 건전지 넣기 같은 정밀 과제를 시연 50개 수준으로 학습했다.</p>`,

    levels: {
      intro: `<p>스타트업 Physical Intelligence의 파이제로(pi zero)는 <a href="#/item/diffusion-policy-2023">Diffusion Policy</a> 계보의 행동 생성에 두 가지 변경을 더했다. 첫째, 노이즈를 여러 번 되풀이해 다듬는 확산 방식 대신, <b>출발지에서 목적지까지 한 방향으로 흐르는 물길을 배우는</b> 방식을 쓴다. 비유에서 물길은 무작위 노이즈를 실제 동작으로 실어 나르는 방향장(각 지점에서 어느 쪽으로 흘러야 하는지의 지도)을 학습하는 플로 매칭(flow matching)에 해당하고, 목적지는 로봇이 실행할 연속적인 동작 묶음에 해당한다. 물길을 따라가는 계산은 다듬기 반복보다 적은 횟수로 끝나, 초당 수십 번의 빠르고 부드러운 제어가 가능하다. 둘째, 언어와 이미지를 이해하는 사전학습된 시각-언어 모델을 두뇌로 붙여, "빨래를 개"라는 지시를 알아듣고 여러 로봇 몸체에서 수 분짜리 긴 과제를 수행하는 범용성을 노렸다. 빨래 개기, 식탁 치우기 시연으로 널리 알려졌다.</p>`,
      mid: `<p>선행 대비 변경점은 세 가지다. (1) 두뇌 교체: 과제별 소형 네트워크였던 <a href="#/item/diffusion-policy-2023">Diffusion Policy</a>와 달리, 웹 규모로 사전학습된 30억 파라미터급 VLM(PaliGemma)을 백본으로 삼아 언어 지시 이해와 시각 상식을 물려받는다. RT-2 계열 VLA와 같은 노선이되, 행동을 이산 토큰이 아니라 연속값으로 낸다는 점이 다르다. (2) 행동 생성의 세대 교체: DDPM식 확산 대신 플로 매칭으로 행동 청크의 분포를 학습한다. 플로 매칭은 노이즈에서 데이터로 가는 직선적 경로의 속도장을 회귀하는 방법으로, 적은 적분 스텝으로 고품질 샘플을 얻어 50Hz급 고주파 연속 제어에 맞는다. (3) 데이터·신체의 확장: 단일팔·양팔·이동형 등 여러 로봇의 대규모 자체 수집 데이터와 공개 데이터를 섞어 사전학습하고, 과제별 소량 데이터로 후학습하는 "사전학습+후학습" 체제를 로봇에 적용했다.</p>`,
      deep: `<p>구조는 VLM 본체와 행동 전문가(action expert)의 결합이다. 이미지들과 언어 지시는 PaliGemma 계열 VLM이 처리하고, 3억 파라미터급의 별도 가중치를 갖는 행동 전문가 모듈이 로봇 고유 상태와 노이즈 행동을 받아 VLM의 토큰들과 어텐션으로 상호작용하며 행동을 생성한다 — 언어 능력을 보존하면서 연속 제어 출력을 전담시키는 분업이다. 행동 생성은 H스텝(50스텝 규모) 행동 청크 A에 대한 조건부 플로 매칭이다. 노이즈 ε ~ N(0, I)와 보간 계수 τ ∈ [0,1]로 중간점 A<sup>τ</sup> = τA + (1−τ)ε 를 만들면 이 직선 경로의 속도는 dA<sup>τ</sup>/dτ = A − ε 이고, 네트워크 v<sub>θ</sub>(A<sup>τ</sup>, 관측, τ)가 이 속도장을 L2 회귀로 학습한다. 추론은 순수 노이즈에서 오일러 적분 A ← A + δ·v<sub>θ</sub> 를 소수 스텝(10회 규모) 반복해 행동 청크를 얻는데, DDPM의 수십~수백 회 디노이징 대비 호출 수가 크게 줄어 고주파 제어와 궁합이 맞는다. 이 설계로 빨래 개기처럼 변형 물체를 다루는 수 분 길이의 과제와 다양한 로봇 신체에 대한 지시 추종을 시연했다. 이산 토큰 VLA(<a href="#/item/openvla-2024">OpenVLA</a> 등)와 비교하면, 행동 해상도와 제어 주파수를 연속 생성으로 확보한 것이 차별점이다.</p>`
    },
    impact: `<p>파이제로는 "VLM 두뇌 + 생성 모델 행동부"라는 차세대 VLA의 기본형을 제시했고, 로봇 행동 생성의 무게중심을 확산에서 플로 매칭으로 옮기는 계기가 됐다. 로봇 파운데이션 모델을 전면에 내건 스타트업 흐름의 대표 사례로, 이후 가중치 공개와 후속 버전을 통해 산업·학계 양쪽의 표준 참조점이 됐다.</p>`,

  detail: {

    levels: {
      intro: `<p>Codex는 "글을 잘 쓰는 AI에게 프로그래밍 책을 집중적으로 읽히면 코드도 쓸 수 있게 될까"라는 질문에 대한 OpenAI의 답이다. 언어 모델 GPT-3는 인터넷 텍스트로 다음 단어 맞히기를 연습한 모델인데, 여기에 깃허브(GitHub)에 공개된 방대한 코드를 추가로 학습시켰더니, 함수의 이름과 설명만 주면 그 몸체를 스스로 채워 넣는 모델이 됐다. 비유에서 "프로그래밍 책을 집중적으로 읽히기"는 실제로 공개 코드 말뭉치로 다음 토큰 예측을 추가 학습(미세조정)한 것에 해당한다.</p>
<p>이 논문의 또 다른 기여는 채점 방식이다. 작문 시험은 채점자가 글을 읽고 점수를 매기지만, 코드는 겉보기에 그럴듯해도 실행하면 틀릴 수 있다. 그래서 연구진은 학생의 답안을 눈으로 훑는 대신, 답안을 채점 기계에 넣고 실제로 돌려서 정답 여부를 확인하는 방식을 택했다. 비유에서 "학생의 답안"은 실제로 모델이 생성한 코드이고, "채점 기계에 넣고 돌려보기"는 사람이 미리 만든 단위 테스트(unit test)를 실행해 통과 여부로 채점하는 것에 해당한다. 이를 위해 손으로 새로 만든 평가 문제집이 HumanEval이다.</p>
<p>결과는 분명했다. 일반 GPT-3는 이런 문제를 전혀 풀지 못했지만 코드로 학습한 Codex는 상당수를 풀었고, 같은 문제에 여러 번 답하게 하면 정답률이 크게 올랐다. 이 모델이 곧 GitHub Copilot이라는 제품의 엔진이 되면서, "AI가 코드를 써 준다"는 경험이 일반 개발자에게 처음으로 도달했다.</p>`,
      mid: `<p>Codex는 GPT-3 계열 트랜스포머(Transformer) 언어 모델을 깃허브의 공개 파이썬(Python) 코드로 추가 학습(fine-tuning)한 모델이다. 구조를 바꾼 것이 아니라 데이터를 바꿨다. 자연어와 코드가 섞인 말뭉치에서 다음 토큰(token) 예측을 계속하면, 모델은 독스트링(docstring)과 함수 시그니처를 조건으로 받아 함수 본문을 이어 쓰는 능력을 얻는다.</p>
<p>평가의 핵심 전환은 "텍스트 유사도"에서 "기능적 정확성(functional correctness)"으로의 이동이다. 기계 번역식 지표(BLEU 등)는 정답 코드와 겉모습이 비슷한지를 재지만, 같은 기능을 하는 코드는 무한히 다양하게 쓸 수 있고 한 글자 차이로 동작이 달라질 수도 있다. 그래서 연구진은 손으로 새로 작성한 164개의 프로그래밍 문제로 이뤄진 HumanEval을 만들고, 각 문제에 단위 테스트를 붙여 생성 코드를 샌드박스에서 실제 실행해 통과 여부로 채점했다.</p>
<p>또 하나의 관찰은 샘플링(sampling)의 힘이다. 언어 모델은 확률적으로 서로 다른 답을 여러 개 생성할 수 있는데, 답 하나만 뽑을 때보다 수십~수백 개를 뽑아 그중 하나라도 테스트를 통과하면 성공으로 치는 기준에서는 성공률이 크게 뛴다. 120억(12B) 파라미터 Codex는 한 번 시도에서 문제의 28.8%를 풀었고, 문제당 100개 샘플을 뽑는 반복 샘플링으로는 70.2%까지 올라갔다. 반면 코드로 학습하지 않은 GPT-3는 0%였다. "정답이 하나라도 있는가"와 "첫 시도가 정답인가"를 구분하는 이 관점은 이후 코드 생성 연구의 표준 평가 프레임이 됐다.</p>`,
      deep: `<p>기술적 골격은 다음과 같다. GPT-3 계열 모델(최대 12B)을 깃허브 공개 저장소에서 수집해 필터링한 백 GB대 규모의 파이썬 코드로 추가 학습했다. 학습 목표는 표준적인 다음 토큰 예측(언어 모델링 손실)이며, 연속 공백을 묶는 토큰을 추가하는 등 코드 친화적으로 토크나이저를 조정해 인코딩 효율을 높였다.</p>
<ol>
<li><b>HumanEval 설계:</b> 164개 문제 각각이 함수 시그니처+독스트링(프롬프트), 정답 구현, 문제당 평균 약 7.7개의 단위 테스트로 구성된다. 학습 데이터 오염을 피하려고 웹에서 수집하지 않고 전부 손으로 새로 작성했으며, 생성 코드는 격리된 샌드박스에서 실행해 전 테스트 통과 시에만 정답으로 친다.</li>
<li><b>pass@k 정의:</b> 문제당 k개 샘플을 생성해 하나라도 테스트를 통과하면 그 문제를 푼 것으로 보고, 그런 문제의 비율을 pass@k라 한다. k개만 직접 뽑아 추정하면 분산이 크므로, 문제당 n≥k개를 생성해 정답 수 c를 센 뒤 pass@k = E[1 − C(n−c, k)/C(n, k)]로 계산하는 비편향 추정량을 제안했다. 여기서 C(a, b)는 이항계수(조합의 수), E는 문제 집합에 대한 평균이다.</li>
<li><b>샘플링 전략:</b> 생성 온도(temperature)를 k에 맞춰 고른다. k가 작으면 낮은 온도(보수적 생성)가, k가 크면 높은 온도(다양한 생성)가 유리하다. 실전처럼 채점용 테스트를 미리 쓸 수 없는 상황을 위해, 후보들의 평균 로그 확률로 순위를 매겨 하나를 고르는 선택 휴리스틱도 평가했다.</li>
<li><b>결과:</b> Codex-12B는 pass@1 28.8%, 문제당 100개 샘플의 반복 샘플링 기준 70.2%를 기록했다. 같은 평가에서 GPT-3는 0%, 오픈소스 GPT-J(6B)는 11.4%였다. 스탠드얼론 함수 합성이라는 제한된 과제에서도 모델 규모와 샘플 수에 따라 성능이 매끄럽게 오르는 경향이 확인됐다.</li>
</ol>
<p>한계 분석도 명시적이다. 독스트링이 여러 연산의 연쇄를 길게 서술할수록 성능이 급락하는 조합 일반화 실패, 변수 바인딩 혼동 같은 체계적 오류가 보고됐고, 별도의 안전 절에서 생성 코드의 보안 취약점·편향·노동 시장 영향을 논의했다. 이 논문 이후 "생성-실행-채점" 파이프라인과 pass@k 지표는 코드 LLM 평가의 사실상 표준이 됐다.</p>`
    },
    impact: `<p>Codex는 "코드 생성은 언어 모델링의 부분 문제"라는 관점을 확립했고, HumanEval과 pass@k는 이후 거의 모든 코드 LLM이 보고하는 표준 평가가 됐다. 상용 측면에서는 <a href="#/item/copilot-2021">GitHub Copilot</a>의 기반 모델로 배치되어 AI 코딩 보조를 대중화했고, "생성한 코드를 실행해 검증한다"는 절차는 이후 에이전트 연구(도구 실행, 자기 수정 루프)의 밑그림이 됐다. 동시에 공개 코드 학습을 둘러싼 라이선스·저작권 논쟁을 촉발한 출발점이기도 하다.</p>`,

window.AITL.register({
  id: "react-2022", sector: "code_agents", also_in: [], type: "paper", tier: "major",
  year: 2022, date: "2022-10", evolves_from: ["gpt3-2020"],
  title_en: "ReAct: Synergizing Reasoning and Acting in Language Models",
  name_ko: "ReAct",
  oneliner: "추론과 행동을 교차하는 LLM 에이전트의 기본 패턴",
  link: { kind: "arxiv", label: "arXiv:2210.03629", url: "https://arxiv.org/abs/2210.03629" },
  detail: {
    tldr: "생각(추론)과 행동(도구 호출)을 번갈아 수행하게 하는 프롬프트 패턴으로, LLM 에이전트의 기본 루프를 정의했다.",
    levels: {
      intro: `<p>ReAct 이전의 언어 모델 활용법은 크게 둘이었다. 하나는 모델이 머릿속으로만 차근차근 풀이를 적게 하는 것(생각만), 다른 하나는 검색 같은 행동을 곧바로 시키는 것(행동만)이다. 생각만 하는 모델은 기억이 틀려도 그럴듯하게 밀고 나가고, 행동만 하는 모델은 왜 그 행동을 하는지 계획 없이 헤맨다.</p>
<p>ReAct의 아이디어는 사람이 요리하는 방식과 같다. "소스가 없네(확인), 그럼 냉장고를 먼저 보자(생각), 냉장고를 연다(행동)"처럼 생각과 행동을 번갈아 하는 것이다. 비유의 대응은 이렇다. "생각"은 모델이 텍스트로 적는 추론 단계(Thought)이고, "행동"은 위키피디아 검색 같은 도구 호출(Action)이며, "소스가 없네"라는 확인 결과는 도구가 돌려주는 관찰(Observation)에 해당한다. 모델은 이 세 가지를 반복하면서, 검색 결과라는 외부 사실로 자기 생각을 교정하고, 생각으로 다음 행동을 계획한다.</p>
<p>이 단순한 교차 패턴만으로 지식 질문에서는 지어내기(환각)가 줄었고, 텍스트로 진행되는 집안일 시뮬레이션이나 웹 쇼핑 과제에서는 성공률이 크게 올랐다. 무엇보다 "언어 모델이 도구를 쓰며 외부 세계와 상호작용하는 루프"라는 형식 자체가 이후 거의 모든 LLM 에이전트(agent) 프레임워크의 뼈대가 됐다는 점이 이 논문의 가장 큰 유산이다.</p>`,
      mid: `<p>ReAct는 새로운 모델이 아니라 프롬프트 형식(prompting scheme)이다. 소수의 예시(few-shot)로 "Thought - Action - Observation"이 반복되는 궤적(trajectory)을 보여주면, 모델이 같은 형식으로 새 문제를 푼다. Thought는 상황 요약·계획 수립·예외 처리 같은 자유 형식의 추론 텍스트이고, Action은 미리 정의된 행동 공간에서 고르는 도구 호출이며, Observation은 환경이 돌려준 결과다. Thought는 환경을 바꾸지 않고 모델의 맥락(context)만 갱신한다는 점이 중요하다.</p>
<p>비교 대상은 두 극단이다. 사슬형 추론(chain-of-thought, CoT)은 내부 지식만으로 추론을 전개하므로 사실 오류가 결론까지 그대로 전파되는 환각(hallucination)에 취약하다. 반대로 행동만 하는 에이전트는 하위 목표 분해나 상식 추론이 없어 긴 과제에서 길을 잃는다. ReAct는 추론이 행동을 계획하고("이 배우의 출생지를 먼저 검색하자"), 행동의 결과가 추론을 접지(grounding)하는("검색 결과에 없으니 다른 표제어를 찾자") 양방향 시너지를 만든다.</p>
<p>평가는 두 축에서 이뤄졌다. 지식 집약 과제(HotpotQA 질의응답, FEVER 사실 검증)에서는 위키피디아 검색·조회 도구를 붙여 CoT의 환각을 줄였고, CoT와 ReAct를 상황에 따라 전환하는 조합이 각각의 단독 사용보다 나았다. 의사결정 과제(ALFWorld 텍스트 기반 집안일, WebShop 웹 쇼핑)에서는 행동만 하는 프롬프트 기준선과 모방·강화학습 기법을 큰 폭으로 앞섰다. 성공의 상당 부분이 필요한 지점에 배치된 "희소한 Thought 몇 줄"에서 나온다는 분석도 담겨 있다.</p>`,
      deep: `<p>형식화하면, ReAct는 부분 관측 환경에서의 정책을 언어 모델로 구현하되 행동 공간을 확장한 것이다. 시점 t까지의 맥락 c<sub>t</sub> = (o<sub>1</sub>, a<sub>1</sub>, …, o<sub>t</sub>)를 조건으로 정책 π(a<sub>t</sub>|c<sub>t</sub>)가 다음 행동을 고르는데(o는 관찰, a는 행동), ReAct는 행동 공간 A를 A ∪ L로 확장한다. L은 언어 공간, 즉 Thought다. Thought는 환경에 영향을 주지 않고 맥락에만 덧붙어 이후 행동 선택의 조건으로 작동한다.</p>
<ol>
<li><b>루프 구조:</b> 모델은 Thought(자유 텍스트) - Action(도구 호출 문자열) - Observation(도구 반환값 삽입)을 종료 행동이 나올 때까지 반복한다. HotpotQA에서는 search[표제어], lookup[문자열], finish[답] 세 가지의 단순한 위키피디아 API가 행동 공간의 전부다.</li>
<li><b>프롬프트 구성:</b> 사람이 쓴 소수(과제당 수 개)의 ReAct 궤적을 예시로 넣는다. 지식 과제에서는 스텝마다 Thought를 배치하고, 의사결정 과제(ALFWorld)에서는 계획 수립·하위 목표 체크·상식 보완이 필요한 지점에만 희소하게 배치한다.</li>
<li><b>CoT 대비 차이:</b> CoT는 추론 전체를 내부 지식으로 생성하므로 희귀·최신 사실에서 환각이 발생하고, 한 번 틀린 전제가 끝까지 전파된다. ReAct는 Observation이라는 외부 증거로 중간 전제를 검증·수정할 수 있다. 반대로 ReAct는 검색 결과가 나쁘면 추론이 흔들리는 "검색 품질 의존"이라는 새로운 실패 모드를 갖는다. 논문은 이를 근거로, 답의 자기일관성이 낮을 때 CoT와 ReAct를 서로 전환하는 전략이 단독보다 낫다는 결과를 보였다.</li>
<li><b>실패 모드 분석:</b> ReAct의 오류는 비슷한 검색을 반복하는 루프에 갇히는 경우, 유용한 정보를 검색하고도 추론에서 놓치는 경우 등으로 분류됐고, CoT의 오류는 대부분 환각이었다. 이 정성 분석이 "행동은 접지를, 추론은 계획을 제공한다"는 주장의 근거가 된다.</li>
<li><b>미세조정 실험:</b> 소형 모델을 ReAct 궤적으로 미세조정하면 프롬프트만 쓴 훨씬 큰 모델을 능가할 수 있다는 결과도 제시되어, 궤적 데이터로 에이전트 행동을 학습시키는 이후 연구 방향을 예고했다.</li>
</ol>

  link: { kind: "arxiv", label: "arXiv:2405.15793", url: "https://arxiv.org/abs/2405.15793" },
  detail: {
    tldr: "LLM 전용으로 설계한 에이전트-컴퓨터 인터페이스(ACI)가 성능을 좌우함을 보이며, 자율 소프트웨어 수리의 기준을 세웠다.",
    levels: {
      intro: `<p>SWE-agent의 질문은 의외로 인터페이스에 관한 것이다. 사람 개발자는 에디터·터미널·검색이라는 도구에 맞춰 일하는데, 언어 모델에게 사람용 도구를 그대로 주면 잘 일할 수 있을까? 연구진의 답은 "아니오"였다. 화면도 마우스 커서도 없는 모델에게는 모델에 맞게 설계된 전용 작업대가 필요하다는 것이다.</p>
<p>비유하면, 유능하지만 앞이 잘 보이지 않는 장인에게 일반 작업실 대신 도구마다 손잡이 위치가 일정하고 무엇을 집었는지 음성으로 알려 주는 맞춤 작업실을 지어 주는 것이다. 비유의 대응은 이렇다. "장인"은 실제로 언어 모델이고, "맞춤 작업실"이 에이전트-컴퓨터 인터페이스(Agent-Computer Interface, ACI)이며, "음성 안내"는 명령 실행 후 상태를 간결한 텍스트로 요약해 돌려주는 피드백에 해당한다. 파일을 일정 분량 단위로 보여 주는 뷰어, 결과를 짧게 정리해 주는 검색, 문법이 깨진 수정을 즉시 되돌리는 편집 명령이 그런 맞춤 도구들이다.</p>
<p>이 작업대 위에서 모델은 깃허브 이슈를 읽고, 관련 코드를 찾고, 고치고, 테스트하는 전 과정을 스스로 수행한다. 같은 모델이라도 인터페이스를 잘 설계하면 실제 소프트웨어 버그 해결률이 몇 배로 뛴다는 것이 핵심 발견이며, "에이전트의 능력은 모델만이 아니라 모델이 세상을 만지는 창구에 달려 있다"는 교훈을 남겼다.</p>`,
      mid: `<p>SWE-agent는 <a href="#/item/react-2022">ReAct</a>식 "생각-행동-관찰" 루프를 소프트웨어 수리에 적용하되, 행동 공간과 관찰 형식을 LLM 친화적으로 재설계했다. 이 설계 계층을 에이전트-컴퓨터 인터페이스(ACI)라 부른다. 일반 셸(shell)을 그대로 쓰면 모델은 장황한 출력에 파묻히고, 아무것도 출력되지 않으면 혼란에 빠지며, vim 같은 대화형 에디터는 아예 조작하지 못한다. ACI는 이를 대체하는 소수의 명령과 정제된 피드백으로 구성된다.</p>
<p>구성 요소는 네 가지다. (1) 파일 뷰어: 파일을 100줄 창(window) 단위로 열고 위아래 이동과 특정 줄로의 점프 명령을 제공해, 파일 전체를 컨텍스트에 붓지 않고 탐색하게 한다. (2) 검색: 저장소 전체에서 용어를 찾되 결과를 파일 목록 요약으로 압축하고, 결과가 지나치게 많으면 그 사실만 알려 재질의를 유도한다. (3) 편집: 줄 범위를 지정해 통째로 교체하는 단일 명령으로, 수정 직후 린터(linter)가 문법을 검사해 오류가 있으면 변경을 거부하고 이유를 보여 준다. (4) 컨텍스트 관리: 오래된 관찰을 축약해 이력 길이를 제어하고, 빈 출력에는 "출력 없음" 같은 명시적 메시지를 준다.</p>
<p>이 설계로 GPT-4 계열 모델이 <a href="#/item/swe-bench-2023">SWE-bench</a>에서 당시 검색 기반 접근을 크게 앞서는 약 12.5%의 해결률을 기록했다. 같은 모델을 일반 셸 환경에 두면 성능이 크게 떨어진다는 대조 실험이 논문의 핵심 논증으로, 성능 차이의 독립 변수가 프롬프트나 모델이 아니라 인터페이스임을 보였다.</p>`,
      deep: `<p>실행 흐름을 단계별로 따라가면 다음과 같다. 에이전트는 이슈 텍스트와 함께 샌드박스화된 저장소 환경에 놓이고, 매 턴 "생각 + 명령 하나"를 생성하면 환경이 실행 결과를 돌려준다.</p>
<ol>
<li><b>재현과 국소화(localization):</b> 보통 이슈 속 재현 코드를 스크립트로 만들어 실행해 버그를 확인한 뒤, search_dir·search_file·find_file류 명령으로 의심 파일을 찾는다. 검색 결과는 파일별 일치 수 요약으로 압축되고, 일치가 지나치게 많은 질의는 결과 대신 질의를 좁히라는 메시지를 받는다.</li>
<li><b>탐색:</b> open 명령이 파일을 100줄 창으로 열고, scroll_up/scroll_down과 goto 명령으로 이동한다. 창 크기는 절충의 대상인데, 크면 턴 수가 줄지만 무관한 내용이 컨텍스트를 오염시키고, 작으면 탐색 턴이 급증한다는 절제 실험(ablation)이 보고됐다.</li>
<li><b>편집과 가드레일:</b> edit 명령이 지정한 줄 범위를 새 코드로 교체한다. 교체 직후 린터가 실행되어 문법이 깨지면 변경을 적용하지 않고 오류 위치를 보여 준다. 이 가드레일을 제거한 절제 실험에서 성능이 크게 하락했는데, 잘못된 들여쓰기나 미완성 편집이 이후 턴의 연쇄 실패로 번지는 것을 차단하는 효과다.</li>
<li><b>검증과 제출:</b> 재현 스크립트나 관련 테스트를 다시 실행해 수정을 확인한 뒤 submit 명령으로 현재 변경분(diff)을 패치로 제출한다. 채점은 SWE-bench의 fail-to-pass 테스트 실행 절차를 따른다.</li>
<li><b>실패 모드:</b> 보고된 주요 실패는 잘못된 파일·위치를 고치는 국소화 실패, 표면적 증상만 고치는 불완전 수정, 같은 편집을 반복하는 루프, 긴 이력 속에서 원래 목표를 잃는 컨텍스트 관리 실패다. 성공 궤적은 대체로 짧으며, 턴이 길어질수록 성공률이 급감한다.</li>
</ol>
<p>정량 결과로는 GPT-4 계열 기준 SWE-bench에서 약 12.5%(pass@1)의 해결률과, 일반 셸 대비 큰 폭의 향상이 보고됐다. 논문이 정리한 설계 원칙 — 관찰은 간결하게, 행동은 단순하고 원자적으로, 오류는 즉시 교정 가능하게 — 은 이후 코딩 에이전트의 도구 설계 전반에 수용됐다.</p>`
    },
    impact: `<p>SWE-agent는 "에이전트 성능은 인터페이스 설계 문제"라는 관점을 정립해, 이후 코딩 에이전트들이 공유하는 도구 문법 — 파일 열람 창, 요약된 검색, 린트 가드가 달린 편집 — 을 사실상 표준화했다. <a href="#/item/swe-bench-2023">SWE-bench</a>와 결합해 자율 소프트웨어 수리의 재현 가능한 연구 프레임을 완성했고, 코드 공개로 상용 코딩 에이전트와의 비교 기준선 역할을 했다. ACI 개념은 브라우저·운영체제 조작 등 다른 도메인의 에이전트 인터페이스 설계로도 확장되고 있다.</p>`,
    uncertainty: []
  }
});

      mid: `<p>공개된 정보 기준으로, <a href="#/item/copilot-2021">Copilot</a>류 자동완성과의 구조적 차이는 맥락 조립의 범위다. 자동완성이 커서 주변 텍스트를 프롬프트로 쓰는 데 비해, Cursor는 저장소를 색인해 두고 질문·편집 지시와 관련된 파일 조각을 찾아 모델에 공급하는 코드베이스 수준 맥락을 전면에 세운 것으로 알려져 있다. 상호작용도 다르다. 완성 수락이라는 단방향 흐름 대신, 선택 영역에 자연어 지시를 내리면 차이(diff) 형태의 수정안을 보여 주고 검토·적용하게 하는 편집 중심 흐름을 제공하며, 이후 여러 파일을 연쇄적으로 수정하는 에이전트형 기능으로 확장됐다. 내부 모델 구성과 구현 세부는 비공개다.</p>`,
      deep: `<p>내부 구조가 비공개이므로 기술 서술은 공개 자료 기준의 개괄에 그친다. 알려진 설계 요소는 (1) 저장소 임베딩(embedding) 색인을 이용한 검색 증강 — 질의와 관련된 코드 조각을 찾아 프롬프트에 넣는 방식, (2) 외부 프런티어 모델 API와 자체 보조 모델을 혼합해 지연·비용을 관리하는 서빙, (3) 다음 편집 위치까지 예측해 탭 키로 연쇄 적용하게 하는 자체 완성 기능, (4) diff 검토를 기본 단위로 하는 UX다. 이 조합의 의의는 특정 알고리즘보다 통합에 있다. 모델 성능이 같아도 맥락 검색의 품질과 편집 적용의 마찰이 실사용 생산성을 좌우한다는 점을 제품으로 증명했고, 에디터가 곧 에이전트의 실행 환경(파일 읽기·수정·터미널)을 겸하는 형태의 원형이 됐다. 세부 사양과 수치는 공개되지 않아 서술하지 않는다.</p>`

    levels: {

      mid: `<p>AlphaFold2는 크게 두 덩어리로 이뤄진다. 앞부분은 <b>Evoformer</b>라는 트랜스포머(Transformer) 계열 블록이고, 뒷부분은 좌표를 만드는 <b>구조 모듈(structure module)</b>이다. Evoformer는 두 종류의 표현을 나란히 들고 다닌다. 하나는 여러 서열을 정렬한 자료(multiple sequence alignment, MSA)를 담은 서열 표현이고, 다른 하나는 모든 아미노산 쌍의 관계를 담은 쌍 표현(pair representation)이다.</p>
<p>Evoformer의 요점은 이 두 표현이 서로를 반복해서 갱신한다는 데 있다. 서열 표현에서 읽어낸 공진화 신호가 쌍 표현으로 흘러 들어가 "이 둘은 가깝다"는 기하 정보를 채우고, 반대로 쌍 표현의 기하 제약이 다시 서열 표현의 어텐션(attention)을 조율한다. 쌍 표현은 세 아미노산이 이루는 거리들이 삼각형 부등식을 지키도록 하는 삼각형 갱신(triangle update)으로 다듬어져, 물리적으로 말이 되는 거리 지도로 수렴한다.</p>

      deep: `<p>입력은 표적 서열과 그로부터 검색한 MSA, 그리고 있으면 주형 구조다. 이로부터 서열 표현 M(차원 s×r×c<sub>m</sub>, s=서열 수, r=잔기 수)과 쌍 표현 Z(차원 r×r×c<sub>z</sub>)를 만든다. Evoformer 블록은 다음을 반복한다.</p>
<ol>
<li><b>MSA 어텐션:</b> 서열 표현에 행 방향 어텐션과 열 방향 어텐션을 번갈아 건다. 행 어텐션은 쌍 표현 Z를 편향(bias)으로 받아, 이미 알려진 기하 정보가 서열 내부의 정보 교환을 조율하게 한다.</li>

<li><b>삼각형 갱신:</b> Z의 각 변 (i, j)를 공통 꼭짓점 k를 거치는 두 변 (i, k), (k, j)의 정보로 갱신하는 삼각형 곱셈과 삼각형 어텐션을 적용한다. 이는 거리들이 삼각형 부등식 d<sub>ij</sub> ≤ d<sub>ik</sub> + d<sub>kj</sub>와 모순되지 않도록 표현을 밀어준다.</li>

<p>구조 모듈은 각 잔기 i에 강체 변환 T<sub>i</sub> = (R<sub>i</sub>, t<sub>i</sub>)를 부여한다. R<sub>i</sub>는 회전, t<sub>i</sub>는 평행이동이다. 핵심 연산은 불변 점 어텐션(invariant point attention, IPA)으로, 각 잔기가 만든 3차원 점을 자기 좌표계에서 생성해 전역 좌표로 옮긴 뒤 어텐션에 쓰기 때문에, 입력 전체를 회전·평행이동해도 출력이 그에 맞춰 함께 변하는 등변성(equivariance)이 보장된다. 어텐션 점수는 표준 내적 항, 쌍 표현 Z에서 온 편향 항, 그리고 두 잔기가 만든 점 사이 거리의 제곱 페널티 항의 합으로 계산한다.</p>

    levels: {
      intro: `<p>일기 예보는 전통적으로 대기의 물리 방정식을 슈퍼컴퓨터로 한 단계씩 풀어 미래 상태를 계산한다. 이 방식은 정확하지만 계산이 매우 무겁다. GraphCast는 이 계산을 데이터에서 학습한 신경망(neural network)으로 대체해, 현재의 전 지구 대기 상태를 넣으면 며칠 뒤까지의 날씨를 짧은 시간에 내놓는다.</p>
<p>핵심 아이디어를 비유로 들면 이렇다. 지구 표면을 촘촘한 그물망으로 덮고, 각 매듭이 자기 주변 매듭들과만 정보를 주고받게 한 뒤, 이런 정보 교환을 여러 번 반복해 멀리 있는 지점까지 영향이 퍼지게 한다. 비유에서 그물망의 매듭은 실제로 지구를 덮은 메시(mesh)의 격자점에 해당하고, 매듭 사이 정보 교환은 실제로 이웃 노드 간 메시지 전달(message passing)에 해당하며, 여러 번 반복함은 실제로 그래프 신경망의 층을 여러 겹 쌓는 것에 해당한다.</p>

      mid: `<p>GraphCast는 대기 상태를 위도·경도 격자와 여러 고도층의 물리량(기온, 바람, 기압, 습도 등)으로 표현하고, 이 상태를 <b>그래프</b> 위에 얹는다. 지구 위경도 격자를 그대로 이웃 연결하면 극지방에서 밀도가 왜곡되므로, 정이십면체를 여러 번 세분해 만든 다중 해상도 메시(multi-mesh)를 쓴다. 이 메시는 가까운 이웃을 잇는 짧은 변과 대륙을 가로지르는 긴 변을 함께 가져, 지역 세부와 원거리 연결을 한 번에 다룬다.</p>

      deep: `<p>상태 벡터 X<sub>t</sub>는 위경도 격자의 각 지점에서 여러 고도층 물리량을 쌓은 텐서다. 모델 함수 f는 최근 두 시점을 받아 다음 시점의 잔차를 예측한다. 즉 X<sub>t+1</sub> = X<sub>t</sub> + f(X<sub>t</sub>, X<sub>t-1</sub>) 형태로, 절대값이 아니라 변화량을 학습해 안정성을 높인다.</p>

<p>훈련은 재분석 자료(과거 관측을 물리 모델로 보정해 만든 격자 자료)를 정답으로 삼는 지도학습이다. 손실은 변수·고도별로 가중한 좌표 오차의 합이며, 지역·변수 간 규모 차이를 보정하는 가중치를 둔다. 핵심 기법은 롤아웃 학습으로, 단일 스텝만 학습하면 자기회귀로 이어 붙일 때 오차가 누적돼 발산하므로, 학습 단계에서부터 여러 스텝을 이어 예측하고 그 누적 손실로 역전파해 장기 롤아웃의 안정성을 확보한다.</p>

<p>이 설계의 강점은 추론 비용이다. 물리 방정식을 잘게 시간 적분하는 대신 학습된 함수를 몇 번 평가하면 되므로, 전통적 수치 예보가 슈퍼컴퓨터로 오래 계산하던 열흘 예보를 훨씬 짧은 시간에 낸다. 다만 모델은 학습에 쓴 재분석 자료의 분포를 따르므로, 관측이 희박한 지역이나 자료에 드문 극단 사례에서는 예측 신뢰가 떨어질 수 있다.</p>`

    impact: `<p>GraphCast는 데이터 기반 신경망 예보가 정확도와 속도 모두에서 전통적 수치 예보와 경쟁할 수 있음을 폭넓은 변수에서 보였다. 이는 기상 예측을 무거운 물리 시뮬레이션에서 학습된 대리 모델로 옮기는 흐름을 가속했고, 태풍 경로 등 특정 현상에서 유용성을 보였다. 이후 여러 신경망 기반 예보 모델 연구가 잇따르며 데이터 기반 예보의 기준점으로 자리 잡았다.</p>`,

<script>
// flowchart.js — 시계열 계보도(SVG) 렌더러. 외부 라이브러리 없음.
// window.AITLChart.render(sectorId) → SVG 마크업 문자열
(function () {
  "use strict";

  const YEAR_MIN = 2012, YEAR_MAX = 2026;
  const YEAR_W = 108;          // 1년의 가로 폭(px)
  const NODE_W = 150, NODE_H = 46;
  const LANE_H = 66;           // 레인 세로 간격
  const PAD_L = 16, PAD_T = 34, PAD_B = 16, GAP = 14;

  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");

  // date("YYYY-MM") → 연 단위 실수 시각. 월이 없으면 연 중간(0.45)에 배치해 눈금과 겹침을 줄인다.
  function timeOf(item) {
    const m = /^(\d{4})-(\d{2})$/.exec(item.date || "");
    if (m) return Number(m[1]) + (Number(m[2]) - 1) / 12;
    return item.year + 0.45;
  }
  const xOf = (t) => PAD_L + (t - YEAR_MIN) * YEAR_W;

  function sectorOf(id) {
    return window.AITL.sectors.find((s) => s.id === id) || { color: "#888", name_ko: id };
  }

  function render(sectorId) {
    const all = window.AITL.items;
    const byId = new Map(all.map((i) => [i.id, i]));
    const own = all.filter((i) => i.sector === sectorId || (i.also_in || []).includes(sectorId));
    const shown = new Map(own.map((i) => [i.id, i]));

    // ghost: 이 섹터 노드가 계승하는 타 섹터 노드 (POLICY §6)
    const ghosts = [];
    for (const it of own) {
      for (const ref of it.evolves_from || []) {
        if (!shown.has(ref) && byId.has(ref)) {
          shown.set(ref, byId.get(ref));
          ghosts.push(ref);
        }
      }
    }
    const nodes = [...shown.values()].sort((a, b) => timeOf(a) - timeOf(b) || a.id.localeCompare(b.id));
    if (!nodes.length) return '<p class="chart-hint">이 섹터에는 아직 노드가 없다.</p>';

    // 동시점 부모-자식은 부모가 먼저 오도록 안정화 (레인 배정이 부모 우선이 되게)
    for (let pass = 0; pass < nodes.length; pass++) {
      let swapped = false;
      for (let i = 0; i < nodes.length - 1; i++) {
        const a = nodes[i], b = nodes[i + 1];
        if (timeOf(a) === timeOf(b) && (a.evolves_from || []).includes(b.id)) {
          nodes[i] = b; nodes[i + 1] = a; swapped = true;
        }
      }
      if (!swapped) break;
    }

    // ---- 레인 배정: 같은 계보는 같은 레인 유지, 분기·충돌 시 새 레인 ----
    const laneEnd = [];               // lane → 마지막 노드의 끝 x
    const pos = new Map();            // id → {x, y, lane}
    const laneOf = new Map();
    for (const it of nodes) {
      const x = xOf(timeOf(it));
      let lane = -1;
      for (const ref of it.evolves_from || []) {
        if (laneOf.has(ref)) {
          const pl = laneOf.get(ref);
          if (laneEnd[pl] + GAP <= x) { lane = pl; break; }   // 부모 레인이 비어 있으면 계승
        }
      }
      if (lane < 0) {
        for (let l = 0; l < laneEnd.length; l++) {
          if (laneEnd[l] + GAP <= x) { lane = l; break; }
        }
      }
      if (lane < 0) { lane = laneEnd.length; laneEnd.push(-Infinity); }
      laneEnd[lane] = x + NODE_W;
      laneOf.set(it.id, lane);
      pos.set(it.id, { x, y: PAD_T + lane * LANE_H, lane });
    }

    const W = xOf(YEAR_MAX + 1) + PAD_L;
    const H = PAD_T + laneEnd.length * LANE_H + PAD_B;
    const out = [];
    out.push(`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(sectorOf(sectorId).name_ko)} 계보도">`);
    out.push('<defs><marker id="fc-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a8b3c2"/></marker></defs>');

    // 연도 축
    out.push('<g class="fc-axis">');
    for (let y = YEAR_MIN; y <= YEAR_MAX; y++) {
      const gx = xOf(y);
      out.push(`<line x1="${gx}" y1="${PAD_T - 8}" x2="${gx}" y2="${H - PAD_B}"/>`);
      out.push(`<text x="${gx + 4}" y="${PAD_T - 14}">${y}</text>`);
    }
    out.push("</g>");

    // 엣지 (노드 아래에 깔리도록 먼저)
    for (const it of nodes) {
      const p = pos.get(it.id);
      for (const ref of it.evolves_from || []) {
        const q = pos.get(ref);
        if (!q) continue;
        const ghost = ghosts.includes(ref) ? " ghost-edge" : "";
        const x1 = q.x + NODE_W, y1 = q.y + NODE_H / 2;
        const x2 = p.x, y2 = p.y + NODE_H / 2;
        if (x2 >= x1 + 4) {
          const mx = (x1 + x2) / 2;
          out.push(`<path class="fc-edge${ghost}" d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}" marker-end="url(#fc-arrow)"/>`);
        } else {
          // 같은 시점(가로 겹침): 부모 아래/위 변에서 자식으로 세로 연결
          const down = p.y > q.y;
          const sx = q.x + NODE_W / 2, sy = down ? q.y + NODE_H : q.y;
          const ex = p.x + NODE_W / 2, ey = down ? p.y : p.y + NODE_H;
          const my = (sy + ey) / 2;
          out.push(`<path class="fc-edge${ghost}" d="M${sx},${sy} C${sx},${my} ${ex},${my} ${ex},${ey}" marker-end="url(#fc-arrow)"/>`);
        }
      }
    }

    // 노드
    for (const it of nodes) {
      const p = pos.get(it.id);
      const isGhost = ghosts.includes(it.id);
      const shared = !isGhost && it.sector !== sectorId;      // also_in으로 공동 노출된 노드
      const color = sectorOf(it.sector).color;
      const name = it.name_ko.length > 14 ? it.name_ko.slice(0, 13) + "…" : it.name_ko;
      const cls = `fc-node tier-${it.tier}${isGhost ? " ghost" : ""}`;
      out.push(`<g class="${cls}" data-item="${esc(it.id)}" tabindex="0" role="link" aria-label="${esc(it.name_ko)} 상세 보기">`);
      out.push(`<title>${esc(it.name_ko)} (${it.year}) — ${esc(it.oneliner)}</title>`);
      out.push(`<rect x="${p.x}" y="${p.y}" width="${NODE_W}" height="${NODE_H}" rx="8" stroke="${color}"/>`);
      out.push(`<text class="fc-name" x="${p.x + 10}" y="${p.y + 19}">${esc(name)}</text>`);
      const sub = isGhost ? `${it.year} · ${esc(sectorOf(it.sector).name_ko)}` : String(it.year);
      out.push(`<text class="fc-year" x="${p.x + 10}" y="${p.y + 36}">${sub}</text>`);
      if (shared) {
        out.push(`<rect x="${p.x + NODE_W - 40}" y="${p.y - 8}" width="36" height="16" rx="8" fill="#1f6b45"/>`);
        out.push(`<text class="fc-badge" x="${p.x + NODE_W - 33}" y="${p.y + 4}">공동</text>`);
      }
      out.push("</g>");
    }
    out.push("</svg>");
    return out.join("");
  }

  // 상세 페이지용 미니 계보도: 직전 계보 → 현재 → 다음 계보를 가로로
  function miniLineage(itemId) {
    const all = window.AITL.items;
    const byId = new Map(all.map((i) => [i.id, i]));
    const cur = byId.get(itemId);
    if (!cur) return "";
    const parents = (cur.evolves_from || []).map((p) => byId.get(p)).filter(Boolean);
    const children = all.filter((c) => (c.evolves_from || []).includes(itemId));
    if (!parents.length && !children.length) return "";

    const NW = 132, NH = 40, GAPX = 44, GAPY = 10;
    const cols = [parents, [cur], children];
    const maxRows = Math.max(1, ...cols.map((c) => c.length));
    const W = cols.length * NW + (cols.length - 1) * GAPX + 4;
    const H = maxRows * (NH + GAPY) + 6;
    const colX = (ci) => 2 + ci * (NW + GAPX);
    const rowY = (n, ci) => {
      const arr = cols[ci];
      const total = arr.length * NH + (arr.length - 1) * GAPY;
      const top = (H - total) / 2;
      return top + n * (NH + GAPY);
    };

    const out = [`<div class="mini-lineage"><div class="ml-label">계보 흐름 — 이 모델의 앞뒤</div>`];
    out.push(`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`);
    // 엣지: parents → cur, cur → children
    const curX = colX(1), curY = rowY(0, 1);
    parents.forEach((p, i) => {
      const x1 = colX(0) + NW, y1 = rowY(i, 0) + NH / 2;
      const x2 = curX, y2 = curY + NH / 2, mx = (x1 + x2) / 2;
      out.push(`<path class="ml-edge" d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}"/>`);
    });
    children.forEach((c, i) => {
      const x1 = curX + NW, y1 = curY + NH / 2;
      const x2 = colX(2), y2 = rowY(i, 2) + NH / 2, mx = (x1 + x2) / 2;
      out.push(`<path class="ml-edge" d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}"/>`);
    });
    // 노드
    const drawNode = (it, ci, ri, isCur) => {
      const x = colX(ci), y = rowY(ri, ci);
      const nm = it.name_ko.length > 12 ? it.name_ko.slice(0, 11) + "…" : it.name_ko;
      const g = isCur
        ? `<g class="ml-node cur">`
        : `<g class="ml-node" data-item="${esc(it.id)}" tabindex="0" role="link" aria-label="${esc(it.name_ko)} 상세">`;
      out.push(g);
      out.push(`<title>${esc(it.name_ko)} (${it.year})</title>`);
      out.push(`<rect class="ml-box" x="${x}" y="${y}" width="${NW}" height="${NH}" rx="9"/>`);
      out.push(`<text x="${x + NW / 2}" y="${y + 17}" text-anchor="middle">${esc(nm)}</text>`);
      out.push(`<text x="${x + NW / 2}" y="${y + 31}" text-anchor="middle" fill="#8a94a3" font-size="10">${it.year}</text>`);
      out.push(`</g>`);
    };
    parents.forEach((p, i) => drawNode(p, 0, i, false));
    drawNode(cur, 1, 0, true);
    children.forEach((c, i) => drawNode(c, 2, i, false));
    out.push("</svg></div>");
    return out.join("");
  }

  window.AITLChart = { render, miniLineage };
})();

</script>
<script>
// app.js — 해시 라우터 + 뷰 렌더링 (홈 / 섹터 flow chart / 상세 / 404)
(function () {
  "use strict";

  const AITL = window.AITL;
  const $main = document.getElementById("main");
  const $nav = document.getElementById("sector-nav");
  const $sidebar = document.getElementById("sidebar");
  const $dim = document.getElementById("drawer-dim");
  const $menuBtn = document.getElementById("menu-btn");

  const LEVELS = [
    { key: "intro", label: "입문" },
    { key: "mid", label: "중급" },
    { key: "deep", label: "심화" },
  ];
  const LEVEL_KEY = "aitl_level";

  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");

  const byId = () => new Map(AITL.items.map((i) => [i.id, i]));
  const sectorOf = (id) => AITL.sectors.find((s) => s.id === id);
  const countOf = (sid) =>
    AITL.items.filter((i) => i.sector === sid || (i.also_in || []).includes(sid)).length;

  // 2012 이전 필수 배경 — 정적 프리퀄 블록 (POLICY §12, 상세 페이지 없음)
  const PREQUELS = [
    { name: "퍼셉트론(Perceptron)", year: "1958", desc: "가중치 합으로 이진 분류를 학습하는 최초의 인공 뉴런 모델이다." },
    { name: "역전파(Backpropagation)", year: "1986", desc: "오차를 출력에서 입력 방향으로 전파해 다층 신경망을 학습시키는 알고리즘이다." },
    { name: "LSTM", year: "1997", desc: "게이트로 정보 흐름을 제어해 긴 시퀀스의 기억을 유지하는 순환 신경망 구조다." },
    { name: "ImageNet 데이터셋", year: "2009", desc: "1,400만 장 규모의 이미지 분류 데이터셋으로, 딥러닝 부흥의 무대가 됐다." },
    { name: "GPU 범용 연산", year: "2000년대 후반", desc: "그래픽 프로세서의 병렬 연산을 신경망 학습에 활용하는 기반이 마련됐다." },
  ];

  // ---- 사이드바 ----
  function renderNav(activeSector) {
    $nav.innerHTML = AITL.sectors
      .slice().sort((a, b) => a.order - b.order)
      .map((s) => `<li><a href="#/sector/${s.id}" class="${s.id === activeSector ? "active" : ""}">
        <span class="nav-dot" style="background:${s.color}"></span>${esc(s.name_ko)}
        <span class="nav-count">${countOf(s.id)}</span></a></li>`)
      .join("");
  }

  function closeDrawer() { $sidebar.classList.remove("open"); $dim.hidden = true; }
  $menuBtn.addEventListener("click", () => {
    const open = $sidebar.classList.toggle("open");
    $dim.hidden = !open;
  });
  $dim.addEventListener("click", closeDrawer);
  $nav.addEventListener("click", (e) => { if (e.target.closest("a")) closeDrawer(); });

  // ---- 뷰: 홈 ----
  function viewHome() {
    document.title = "AI 발전 흐름 by Sector";
    const sectors = AITL.sectors.slice().sort((a, b) => a.order - b.order)
      .map((s) => `<a class="card sector-card" href="#/sector/${s.id}" style="border-top-color:${s.color}">
        <span class="cnt">${countOf(s.id)}개</span><b>${esc(s.name_ko)}</b>
        <span class="en">${esc(s.name_en)}</span></a>`)
      .join("");
    const prequels = PREQUELS.map((p) => `<div class="card prequel-card">
      <b>${esc(p.name)} <span style="font-weight:400;color:var(--muted)">· ${esc(p.year)}</span></b>
      <span>${esc(p.desc)}</span></div>`).join("");
    $main.innerHTML = `
      <h1 class="home-title">AI 발전 흐름 by Sector</h1>
      <p class="home-desc">2012년 AlexNet부터 2026년까지, AI의 발전사를 9개 기술 섹터의
      시계열 계보도(flow chart)로 정리했다. 섹터를 고르면 모델·논문의 병렬/직렬 발전 과정이 보이고,
      노드를 누르면 입문·중급·심화 3단계 수준별 해설로 들어간다.</p>
      <div class="section-label">2012 이전 — 배경</div>
      <div class="prequel-grid">${prequels}</div>
      <div class="section-label">섹터</div>
      <div class="sector-grid">${sectors}</div>`;
  }

  // ---- 뷰: 섹터 flow chart ----
  function viewSector(sid) {
    const s = sectorOf(sid);
    if (!s) return view404();
    document.title = `${s.name_ko} — AI 발전 흐름`;
    $main.innerHTML = `
      <div class="sector-head"><h1>${esc(s.name_ko)}</h1><span class="en">${esc(s.name_en)}</span></div>
      <p class="chart-hint">노드를 클릭하면 상세 해설로 이동한다. 차트는 좌우로 스크롤할 수 있다.</p>
      <div class="chart-scroll">${window.AITLChart.render(sid)}</div>
      <div class="fc-legend">
        <span><span class="sw major" style="border-color:${s.color}"></span>주요(major) 노드</span>
        <span><span class="sw" style="border-color:${s.color}"></span>후속(minor) 노드</span>
        <span><span class="sw ghost"></span>타 섹터에서 계승 (점선)</span>
      </div>`;
    $main.querySelectorAll(".fc-node").forEach((g) => {
      const go = () => { location.hash = "#/item/" + g.dataset.item; };
      g.addEventListener("click", go);
      g.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
    });
  }

  // ---- 뷰: 상세 ----
  function currentLevel(qsLevel) {
    if (qsLevel && LEVELS.some((l) => l.key === qsLevel)) return qsLevel;
    const saved = localStorage.getItem(LEVEL_KEY);
    return LEVELS.some((l) => l.key === saved) ? saved : "mid";
  }

  function viewItem(id, qsLevel) {
    const map = byId();
    const it = map.get(id);
    if (!it) return view404();
    const s = sectorOf(it.sector);
    document.title = `${it.name_ko} — AI 발전 흐름`;
    const level = currentLevel(qsLevel);
    const children = AITL.items.filter((c) => (c.evolves_from || []).includes(id));
    const parents = (it.evolves_from || []).map((p) => map.get(p)).filter(Boolean);

    const linkBtn = it.link
      ? `<a class="link-btn" href="${esc(it.link.url)}" target="_blank" rel="noopener">${esc(it.link.label)} ↗</a>` : "";
    const badges = `
      <span class="badge sector-badge" style="background:${s.color}">${esc(s.name_ko)}</span>
      ${(it.also_in || []).map((a) => `<span class="badge shared">공동: ${esc(sectorOf(a).name_ko)}</span>`).join("")}
      <span class="badge tier-${it.tier}">${it.tier === "major" ? "주요" : "후속"}</span>
      <span class="badge">${{ paper: "논문", model: "모델", product: "제품" }[it.type] || it.type}</span>
      <span class="badge">${esc(it.date)}</span>
      ${linkBtn}`;

    let body;
    if (!it.detail) {
      body = `<div class="card" style="margin-top:20px">이 노드의 상세 해설은 아직 준비 중이다.
        <br><span style="color:var(--muted);font-size:13px">${esc(it.oneliner)}</span></div>`;
    } else {
      const d = it.detail;
      const tabs = LEVELS.map((l) =>
        `<button data-level="${l.key}" class="${l.key === level ? "active" : ""}">${l.label}</button>`).join("");
      const unc = d.uncertainty && d.uncertainty.length
        ? `<div class="uncertainty-box">${d.uncertainty.map((u) => `<p>${esc(u)}</p>`).join("")}</div>` : "";
      body = `
        <div class="tldr">${esc(d.tldr)}</div>
        <div class="level-tabs" role="tablist">${tabs}</div>
        <div class="level-body" id="level-body">${d.levels[level]}</div>
        <div class="impact-title">영향과 의의</div>
        <div class="impact-body">${d.impact}</div>
        ${unc}`;
    }

    const nav = `
      <div class="lineage-nav">
        ${parents.map((p) => `<a href="#/item/${p.id}">← ${esc(p.name_ko)} (${p.year})</a>`).join("")}
        <span class="spacer"></span>
        ${children.map((c) => `<a href="#/item/${c.id}">${esc(c.name_ko)} (${c.year}) →</a>`).join("")}
      </div>`;

    const mini = window.AITLChart.miniLineage(id);
    $main.innerHTML = `
      <div class="detail-wrap" style="--sec:${s.color}">
        <a class="back-btn" href="#/sector/${it.sector}">← ${esc(s.name_ko)} flow chart로</a>
        <div class="detail-card">
          <div class="detail-head">
            <div class="detail-kicker">${esc(s.name_ko)} · ${esc(it.date)}</div>
            <h1>${esc(it.name_ko)}</h1>
            <div class="title-en">${esc(it.title_en)}</div>
            <div class="badge-row">${badges}</div>
          </div>
          ${mini}
          ${body}
          ${nav}
        </div>
      </div>`;

    $main.querySelectorAll(".level-tabs button").forEach((b) => {
      b.addEventListener("click", () => {
        const lv = b.dataset.level;
        localStorage.setItem(LEVEL_KEY, lv);
        $main.querySelectorAll(".level-tabs button").forEach((x) => x.classList.toggle("active", x === b));
        document.getElementById("level-body").innerHTML = it.detail.levels[lv];
      });
    });
    $main.querySelectorAll(".ml-node[data-item]").forEach((g) => {
      const go = () => { location.hash = "#/item/" + g.dataset.item; };
      g.addEventListener("click", go);
      g.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
    });
    $main.focus({ preventScroll: true });
    window.scrollTo(0, 0);
  }

  // ---- 뷰: 404 ----
  function view404() {
    document.title = "페이지 없음 — AI 발전 흐름";
    $main.innerHTML = `<div class="notfound"><h1>404</h1>
      <p>존재하지 않는 페이지다.</p><p><a href="#/">홈으로 돌아가기</a></p></div>`;
  }

  // ---- 라우터 ----
  function route() {
    const raw = location.hash || "#/";
    const [pathPart, qs] = raw.slice(1).split("?");
    const seg = pathPart.split("/").filter(Boolean);
    const qsLevel = qs ? new URLSearchParams(qs).get("level") : null;
    let active = null;
    if (seg.length === 0) viewHome();
    else if (seg[0] === "sector" && seg.length === 2) { active = seg[1]; viewSector(seg[1]); }
    else if (seg[0] === "item" && seg.length === 2) {
      const it = byId().get(seg[1]);
      active = it ? it.sector : null;
      viewItem(seg[1], qsLevel);
    } else view404();
    renderNav(active);
  }

  window.addEventListener("hashchange", route);
  route();
})();

</script>
</body>
