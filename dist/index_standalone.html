<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 발전 흐름 by Sector</title>
<style>
/* AI 발전 흐름 by Sector — 전체 스타일 (외부 리소스 0, 시스템 폰트 스택) */
:root {
  --bg: #f7f8fa;
  --panel: #ffffff;
  --text: #1c2330;
  --muted: #66707f;
  --line: #dde2ea;
  --accent: #3b6fd4;
  --sidebar-w: 240px;
  --radius: 10px;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic",
    "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.65;
  overflow-x: hidden; /* 페이지 전체 수평 스크롤 금지 (POLICY §24) */
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

/* ---- 레이아웃 ---- */
#layout { min-height: 100vh; }
#topbar { display: none; }
#sidebar {
  position: fixed; top: 0; left: 0; bottom: 0;
  width: var(--sidebar-w);
  background: var(--panel);
  border-right: 1px solid var(--line);
  padding: 20px 14px;
  overflow-y: auto;
  z-index: 30;
}
#sidebar .brand {
  display: block; font-size: 18px; font-weight: 700; color: var(--text);
  margin-bottom: 18px; line-height: 1.3;
}
#sidebar .brand:hover { text-decoration: none; color: var(--accent); }
.brand-sub { display: block; font-size: 12px; font-weight: 400; color: var(--muted); }
#sector-nav { list-style: none; margin: 0; padding: 0; }
#sector-nav li { margin: 2px 0; }
#sector-nav a {
  display: flex; align-items: center; gap: 8px;
  padding: 9px 10px; border-radius: 8px;
  color: var(--text); font-size: 14px; min-height: 44px;
}
#sector-nav a:hover { background: #eef1f6; text-decoration: none; }
#sector-nav a.active { background: #e8eefb; font-weight: 600; }
.nav-dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.nav-count {
  margin-left: auto; font-size: 11px; color: var(--muted);
  background: #eef1f6; border-radius: 10px; padding: 1px 7px;
}
#main { margin-left: var(--sidebar-w); padding: 28px 32px 60px; min-height: 100vh; }

/* ---- 홈 ---- */
.home-title { font-size: 26px; font-weight: 800; margin: 4px 0 6px; }
.home-desc { color: var(--muted); max-width: 640px; margin: 0 0 26px; }
.section-label {
  font-size: 13px; font-weight: 700; color: var(--muted);
  text-transform: uppercase; letter-spacing: .06em; margin: 26px 0 10px;
}
.prequel-grid, .sector-grid { display: grid; gap: 12px; }
.prequel-grid { grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); }
.sector-grid { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
.card {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 14px 16px;
}
.prequel-card b { display: block; font-size: 14px; margin-bottom: 3px; }
.prequel-card span { font-size: 13px; color: var(--muted); }
.sector-card { display: block; color: var(--text); border-top: 3px solid var(--accent); min-height: 44px; }
.sector-card:hover { text-decoration: none; box-shadow: 0 2px 10px rgba(20,30,50,.08); }
.sector-card b { font-size: 15px; }
.sector-card .en { display: block; font-size: 12px; color: var(--muted); }
.sector-card .cnt { float: right; font-size: 12px; color: var(--muted); }

/* ---- 섹터(flow chart) 뷰 ---- */
.sector-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
.sector-head h1 { font-size: 22px; margin: 0; }
.sector-head .en { color: var(--muted); font-size: 14px; }
.chart-hint { font-size: 13px; color: var(--muted); margin: 0 0 14px; }
.chart-scroll {
  overflow-x: auto; /* 수평 스크롤은 차트 컨테이너 내부에서만 허용 (POLICY §24) */
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 10px;
}
.chart-scroll svg { display: block; }
.fc-node { cursor: pointer; }
.fc-node rect {
  fill: #fff; stroke-width: 1.5; rx: 8;
  filter: drop-shadow(0 1px 2px rgba(20,30,50,.10));
}
.fc-node.tier-major rect { stroke-width: 2.5; }
.fc-node.ghost rect { stroke-dasharray: 5 4; fill: #fafbfc; }
.fc-node:hover rect { filter: drop-shadow(0 2px 6px rgba(20,30,50,.22)); }
.fc-name { font-size: 12.5px; font-weight: 600; fill: var(--text); }
.fc-year { font-size: 10.5px; fill: var(--muted); }
.fc-badge { font-size: 9.5px; fill: #fff; font-weight: 700; }
.fc-edge { fill: none; stroke: #a8b3c2; stroke-width: 1.4; }
.fc-edge.ghost-edge { stroke-dasharray: 4 4; }
.fc-axis line { stroke: #edf0f4; }
.fc-axis text { font-size: 11px; fill: #9aa4b2; }
.fc-legend { font-size: 12px; color: var(--muted); margin-top: 10px; display: flex; gap: 18px; flex-wrap: wrap; }
.fc-legend .sw { display: inline-block; width: 22px; height: 12px; border: 1.5px solid #888; border-radius: 4px; vertical-align: -1px; margin-right: 5px; }
.fc-legend .sw.major { border-width: 2.5px; }
.fc-legend .sw.ghost { border-style: dashed; }

/* ---- 상세 뷰 : 하나의 연속된 article 카드 ---- */
.detail-wrap {
  --sec: var(--accent);
  max-width: 820px; margin: 0 auto;
}
.back-btn {
  display: inline-flex; align-items: center; min-height: 36px; padding: 0 10px 0 4px;
  color: var(--muted); font-size: 13.5px; border-radius: 8px; margin-bottom: 6px;
}
.back-btn:hover { background: #eef1f6; text-decoration: none; color: var(--sec); }

.detail-card {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: 16px; overflow: hidden;
  box-shadow: 0 1px 3px rgba(20,30,50,.05), 0 8px 30px rgba(20,30,50,.05);
}
.detail-head {
  padding: 22px 30px 18px; border-top: 4px solid var(--sec);
  background: linear-gradient(180deg, color-mix(in srgb, var(--sec) 6%, #fff), var(--panel));
}
.detail-kicker {
  font-size: 12px; font-weight: 700; letter-spacing: .04em;
  color: var(--sec); text-transform: uppercase; margin-bottom: 6px;
}
.detail-head h1 { font-size: 27px; line-height: 1.25; margin: 0 0 3px; letter-spacing: -.01em; }
.detail-head .title-en { color: var(--muted); font-size: 14.5px; font-style: italic; }
.badge-row { display: flex; gap: 6px; flex-wrap: wrap; margin: 13px 0 0; align-items: center; }
.badge {
  font-size: 11.5px; padding: 3px 10px; border-radius: 20px; line-height: 1.5;
  background: #eef1f6; color: var(--muted);
}
.badge.tier-major { background: #fdf0dd; color: #8a5a12; font-weight: 600; }
.badge.tier-minor { background: #edf0f4; color: var(--muted); }
.badge.sector-badge { color: #fff; font-weight: 600; }
.badge.shared { background: #e8f4ee; color: #1f6b45; }
.link-btn {
  font-size: 11.5px; padding: 3px 11px; border-radius: 20px;
  border: 1px solid var(--sec); color: var(--sec); background: #fff;
}
.link-btn:hover { background: var(--sec); color: #fff; text-decoration: none; }

/* 계보 미니맵 */
.mini-lineage { padding: 14px 30px; border-bottom: 1px solid var(--line); overflow-x: auto; background: #fbfcfd; }
.mini-lineage .ml-label { font-size: 11px; color: var(--muted); margin-bottom: 8px; font-weight: 600; }
.ml-node { cursor: pointer; }
.ml-node text { font-size: 12px; }
.ml-node .ml-box { fill: #fff; stroke: var(--line); stroke-width: 1.5; }
.ml-node.cur .ml-box { fill: color-mix(in srgb, var(--sec) 12%, #fff); stroke: var(--sec); stroke-width: 2; }
.ml-node.cur text { font-weight: 700; }
.ml-edge { stroke: #b9c2cf; stroke-width: 1.5; fill: none; }

.tldr {
  padding: 18px 30px; font-size: 16px; line-height: 1.6; font-weight: 500;
  color: var(--text); border-bottom: 1px solid var(--line);
  background: color-mix(in srgb, var(--sec) 4%, #fff);
}

/* 레벨 토글 — 세그먼트 컨트롤 */
.level-tabs {
  display: flex; gap: 4px; margin: 0; padding: 14px 30px 0;
  position: sticky; top: 0; background: var(--panel); z-index: 5;
}
.level-tabs button {
  flex: none; min-height: 40px; min-width: 84px; padding: 0 20px;
  font-size: 14px; font-family: inherit; font-weight: 500; cursor: pointer;
  border: 1.5px solid var(--line); background: var(--panel); color: var(--muted);
  border-radius: 10px; transition: all .12s ease;
}
.level-tabs button:hover { border-color: var(--sec); color: var(--sec); }
.level-tabs button.active { background: var(--sec); border-color: var(--sec); color: #fff; font-weight: 600; }

.level-body { padding: 4px 30px 8px; }
.impact-body { padding: 0 30px; }
.detail-card p { margin: 0 0 15px; line-height: 1.85; }
.level-body code, .impact-body code {
  background: #f1f3f7; border-radius: 4px; padding: 1px 5px; font-size: .9em;
  overflow-wrap: anywhere; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
}
.level-body p, .impact-body p { overflow-x: auto; } /* 긴 수식 가로 스크롤 (PRD §8) */

/* step 리스트 — 번호 배지 */
.level-body ol { list-style: none; counter-reset: step; margin: 4px 0 16px; padding: 0; }
.level-body ol > li {
  counter-increment: step; position: relative; padding: 2px 0 2px 40px;
  margin-bottom: 12px; line-height: 1.8;
}
.level-body ol > li::before {
  content: counter(step); position: absolute; left: 0; top: 1px;
  width: 26px; height: 26px; border-radius: 50%;
  background: color-mix(in srgb, var(--sec) 14%, #fff); color: var(--sec);
  font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center;
}
.level-body ul { margin: 4px 0 16px; padding-left: 20px; }
.level-body ul li { margin-bottom: 8px; line-height: 1.8; }

.impact-title {
  font-size: 14px; font-weight: 700; color: var(--sec); letter-spacing: .02em;
  margin: 8px 30px 10px; padding-top: 18px; border-top: 1px solid var(--line);
  display: flex; align-items: center; gap: 7px;
}
.impact-title::before { content: "→"; font-weight: 700; }
.uncertainty-box {
  background: #fdf6e3; border: 1px solid #ecd9a0; border-radius: 10px;
  padding: 12px 16px; margin: 16px 30px 6px; font-size: 13px; color: #6b5a1e;
}
.uncertainty-box p { margin: 4px 0; line-height: 1.7; }

.lineage-nav { display: flex; justify-content: space-between; gap: 10px; padding: 16px 30px 26px; flex-wrap: wrap; }
.lineage-nav a {
  display: inline-flex; align-items: center; min-height: 44px;
  background: #fbfcfd; border: 1px solid var(--line); border-radius: 10px;
  padding: 6px 14px; font-size: 13px; color: var(--text); max-width: 48%;
}
.lineage-nav a:hover { text-decoration: none; border-color: var(--sec); color: var(--sec); background: #fff; }
.lineage-nav .spacer { flex: 1; }

/* ---- 404 ---- */
.notfound { text-align: center; padding: 80px 20px; }
.notfound h1 { font-size: 40px; margin: 0 0 8px; }

/* ---- 모바일 (<720px) : 사이드바 → 드로어 ---- */
@media (max-width: 719px) {
  #topbar {
    display: flex; align-items: center; gap: 6px;
    position: sticky; top: 0; z-index: 20;
    background: var(--panel); border-bottom: 1px solid var(--line);
    padding: 6px 10px;
  }
  #topbar .brand { font-size: 16px; font-weight: 700; color: var(--text); }
  #menu-btn {
    width: 44px; height: 44px; font-size: 20px; border: none; background: none;
    cursor: pointer; color: var(--text); border-radius: 8px;
  }
  #menu-btn:active { background: #eef1f6; }
  #sidebar { transform: translateX(-100%); transition: transform .2s ease; width: 260px; }
  #sidebar.open { transform: translateX(0); box-shadow: 4px 0 24px rgba(0,0,0,.18); }
  #drawer-dim {
    position: fixed; inset: 0; background: rgba(10,15,25,.4); z-index: 25;
  }
  #main { margin-left: 0; padding: 16px 14px 48px; }
  .detail-head h1 { font-size: 22px; }
  .level-tabs { position: sticky; top: 57px; background: var(--bg); padding: 6px 0; z-index: 5; }
  .level-tabs button { min-width: 0; flex: 1; }
  .lineage-nav a { max-width: 100%; }
}
/* 태블릿(720~1023px): 사이드바 유지하되 좁게 */
@media (min-width: 720px) and (max-width: 1023px) {
  :root { --sidebar-w: 200px; }
  #main { padding: 22px 20px 48px; }
}

</style>
</head>
<body>
<div id="layout">
  <header id="topbar">
    <button id="menu-btn" aria-label="메뉴 열기">☰</button>
    <a href="#/" class="brand">AI 발전 흐름</a>
  </header>
  <div id="drawer-dim" hidden></div>
  <nav id="sidebar" aria-label="섹터 목록">
    <a href="#/" class="brand">AI 발전 흐름<span class="brand-sub">by Sector · 2012→2026</span></a>
    <ul id="sector-nav"></ul>
  </nav>
  <main id="main" tabindex="-1"></main>
</div>
<script>
// 섹터 레지스트리 + 노드 등록 부트스트랩 (PRD §2)
window.AITL = {
  sectors: [
    { id: "nlp_llm",      name_ko: "자연어 처리·LLM",    name_en: "NLP & LLMs",        color: "#3b6fd4", order: 1 },
    { id: "vision",       name_ko: "컴퓨터 비전",        name_en: "Computer Vision",   color: "#2a9d8f", order: 2 },
    { id: "generative",   name_ko: "생성 모델",          name_en: "Generative Models", color: "#c2559a", order: 3 },
    { id: "rl_games",     name_ko: "강화학습·게임 AI",   name_en: "RL & Game AI",      color: "#d97b29", order: 4 },
    { id: "multimodal",   name_ko: "멀티모달",           name_en: "Multimodal",        color: "#7b52c9", order: 5 },
    { id: "speech_audio", name_ko: "음성·오디오",        name_en: "Speech & Audio",    color: "#c9445a", order: 6 },
    { id: "robotics",     name_ko: "로보틱스",           name_en: "Robotics",          color: "#5a7d2a", order: 7 },
    { id: "code_agents",  name_ko: "코드 생성·에이전트", name_en: "Code & Agents",     color: "#2278a8", order: 8 },
    { id: "ai4science",   name_ko: "AI for Science",     name_en: "AI for Science",    color: "#8a6d3b", order: 9 }
  ],
  items: [],
  register(item) { this.items.push(item); }
};

</script>
<script>
// nlp_llm — 자연어 처리·LLM 섹터 데이터
// Phase 1: 골드 스탠다드 2건(transformer-2017, gpt2-2019) + 참조 무결성을 위한 골격 2건
// (attention-2014, gpt1-2018). 나머지는 Phase 2에서 골격, Phase 3에서 상세를 채운다.

window.AITL.register({
  id: "attention-2014", sector: "nlp_llm", also_in: [],
  type: "paper", tier: "major", year: 2014, date: "2014-09",
  evolves_from: ["seq2seq-2014"],
  title_en: "Neural Machine Translation by Jointly Learning to Align and Translate",
  name_ko: "어텐션(Bahdanau Attention)",
  oneliner: "번역 시 소스 문장에서 필요한 부분을 골라 보는 정렬 메커니즘",
  link: { kind: "arxiv", label: "arXiv:1409.0473", url: "https://arxiv.org/abs/1409.0473" },
  detail: {
    tldr: "출력 단어를 만들 때마다 소스 문장 전체에서 관련 부분을 골라 참조하는 정렬 메커니즘으로, 고정 벡터 병목을 없앴다.",
    levels: {
      intro: `<p><a href="#/item/seq2seq-2014">Seq2Seq</a>의 통역사는 문장을 끝까지 듣고 머릿속 요약만으로 통역해야 했다. 문장이 길어지면 요약에서 빠지는 내용이 생긴다. 어텐션(attention)의 아이디어는 간단하다. <b>원문을 책상 위에 펼쳐두고, 번역문을 한 단어 쓸 때마다 원문에서 지금 필요한 부분을 손가락으로 짚어가며 보는 것</b>이다. 주어를 쓸 때는 원문의 주어 근처를, 동사를 쓸 때는 원문의 동사 근처를 짚는 식이다.</p>
<p>비유를 실제와 대응시키면 이렇다. "책상 위에 펼쳐둔 원문"은 인코더가 만든 소스 문장의 단어별 표현을 전부 보관해 두는 것에 해당한다. 이전에는 마지막 요약 하나만 넘겼다면, 이제는 단어 수만큼의 표현을 통째로 넘긴다. "손가락으로 짚기"는 출력 단어를 만들 때마다 소스 단어 각각에 매기는 중요도 점수(어텐션 가중치)이고, 짚은 부분을 중심으로 내용을 종합하는 것이 가중 평균에 해당한다.</p>
<p>중요한 것은 어디를 짚을지 사람이 정해주지 않는다는 점이다. 번역을 잘하도록 학습하는 과정에서 "이 출력 단어에는 소스의 저 단어가 필요하다"는 대응 관계(정렬)가 저절로 학습된다. 학습이 끝난 모델의 중요도 점수를 시각화하면 실제로 단어 대 단어 대응표에 가까운 그림이 나오는데, 신경망 내부가 무엇을 하는지 이렇게 직관적으로 보인 것도 이 연구의 매력이었다. 이 "필요한 곳을 골라 본다"는 원리는 이후 트랜스포머에서 아키텍처 전체의 기본 연산이 된다.</p>`,
      mid: `<p>기존 Seq2Seq의 병목은 소스 문장 전체를 고정 길이 벡터 하나로 압축하는 데 있었다. 이 논문(Bahdanau, Cho, Bengio)의 해법은 두 가지 변경이다. 첫째, 인코더를 양방향 RNN(bidirectional RNN)으로 바꿔 각 소스 위치마다 "그 단어를 중심으로 앞뒤 문맥을 담은" 주석 벡터(annotation)를 만든다. 둘째, 디코더가 출력 단어를 하나 만들 때마다 모든 주석 벡터에 점수를 매기고, 소프트맥스로 정규화한 가중치로 가중 평균한 컨텍스트 벡터(context vector)를 그 시점 전용으로 만들어 쓴다.</p>
<p>점수는 "디코더의 현재 상태"와 "각 소스 위치의 주석"을 작은 신경망에 넣어 계산한다. 즉 정렬(alignment)을 별도 모듈로 두는 대신, 번역 모델 안에서 미분 가능한 형태로 함께 학습한다(soft alignment). 모든 소스 단어를 확률적으로 조금씩 참조하므로 딱딱한 일대일 대응보다 유연하고, 전체가 미분 가능해 역전파로 끝까지 학습된다.</p>

      deep: `<p>디코더가 i번째 출력 단어를 생성하는 과정을 따라가면 다음과 같다. 인코더는 양방향 RNN으로 소스 문장을 읽어, 위치 j마다 순방향·역방향 은닉 상태를 이어 붙인 주석 벡터 h<sub>j</sub>를 만든다.</p>

<li><b>정렬 점수:</b> 직전 디코더 상태 s<sub>i-1</sub>과 각 주석 h<sub>j</sub>에 대해 e<sub>ij</sub> = a(s<sub>i-1</sub>, h<sub>j</sub>)를 계산한다. a는 작은 피드포워드 네트워크로, v<sup>T</sup> tanh(W s<sub>i-1</sub> + U h<sub>j</sub>) 형태다(v, W, U는 학습 파라미터). 덧셈 기반이라 가산 어텐션(additive attention)이라 불린다.</li>

<li><b>컨텍스트 벡터:</b> c<sub>i</sub> = ∑<sub>j</sub> α<sub>ij</sub> h<sub>j</sub>. 출력 시점마다 다시 계산된다는 것이 핵심으로, 문장 전체를 벡터 하나에 담는 고정 병목이 사라진다.</li>

<p>설계의 함의를 짚으면 이렇다. (1) 어느 소스 위치를 볼지의 이산적 선택을 명시적으로 추론하는 대신, 그 분포에 대한 주석의 기대값을 쓰는 연속 완화(soft relaxation)여서 end-to-end 학습이 성립한다. (2) 인코더를 양방향으로 둔 이유는, 주석 h<sub>j</sub>가 j번째 단어 앞뒤의 문맥을 모두 담아야 "그 단어에 대한 요약"으로 기능하기 때문이다. (3) 계산 비용은 소스 길이와 타깃 길이의 곱에 비례하지만, 당시 문장 길이 규모에서는 문제가 되지 않았다.</p>
<p>실험에서는 긴 문장 구간에서 고정 벡터 기반 인코더-디코더 대비 큰 폭의 품질 향상을 보였고, 학습된 α 행렬의 시각화가 언어학적으로 그럴듯한 단어 정렬(어순이 다른 언어 쌍에서의 교차 정렬 포함)을 보여줬다. 이후 Luong 등의 내적 기반 어텐션 등 변형이 이어졌고, "쿼리-키 유사도로 가중치를 만들고 밸류를 가중 평균한다"는 일반형으로 정리되면서 트랜스포머의 스케일드 닷프로덕트 어텐션으로 수렴했다.</p>`

    impact: `<p>어텐션은 기계번역의 한 가지 개선책으로 출발했지만, "필요한 정보를 내용 기반으로 동적으로 선택한다"는 원리는 신경망 설계의 보편 연산이 됐다. 트랜스포머는 이 연산만으로 아키텍처 전체를 구성했고, 이미지 캡셔닝·음성 인식·그래프 학습까지 같은 원리가 이식됐다. 어텐션 가중치 시각화는 신경망 해석 연구의 표준 도구가 됐으며, 정렬을 별도 모듈이 아니라 미분 가능한 형태로 모델 안에 녹이는 접근은 end-to-end 학습 시대의 설계 감각을 상징한다.</p>`,

      mid: `<p>모델은 트랜스포머 디코더 블록을 쌓은 단방향(왼쪽에서 오른쪽) 언어 모델이다. 1단계 사전학습에서는 장편 위주 도서 말뭉치(BooksCorpus)로 표준 언어 모델링 목표 — 앞 문맥이 주어졌을 때 다음 토큰의 로그 확률 최대화 — 를 학습한다. 책 데이터를 고른 이유는 문서가 길어 장거리 의존성을 배울 수 있기 때문이다.</p>

      mid: `<p>Word2Vec은 단어 임베딩(word embedding) — 각 단어를 수백 차원의 실수 벡터로 표현하는 것 — 을 대규모로 빠르게 학습하는 두 가지 모델을 제안했다. CBOW(continuous bag-of-words)는 주변 단어들로 가운데 단어를 예측하고, Skip-gram은 반대로 가운데 단어로 주변 단어들을 예측한다. 두 경우 모두 예측을 잘하도록 벡터를 조정하다 보면, 비슷한 문맥에서 쓰이는 단어들의 벡터가 서로 가까워진다. 이는 분포 가설(distributional hypothesis) — 단어의 의미는 함께 나타나는 단어들의 분포로 드러난다 — 의 신경망 구현이다.</p>

      deep: `<p>Skip-gram을 기준으로 학습 과정을 따라가면 다음과 같다. 어휘 V의 각 단어 w는 두 개의 벡터를 갖는다. 중심 단어일 때 쓰는 입력 벡터 v<sub>w</sub>와, 문맥 단어일 때 쓰는 출력 벡터 u<sub>w</sub>다(각각 입력 행렬과 출력 행렬의 행에 해당한다).</p>

<li><b>소프트맥스와 병목:</b> p(o|c) = exp(u<sub>o</sub>·v<sub>c</sub>) / ∑<sub>w</sub> exp(u<sub>w</sub>·v<sub>c</sub>)로 정의되는데, 분모가 어휘 전체(수십만~수백만 단어)에 대한 합이라 매 갱신마다 계산하기엔 너무 비싸다.</li>
<li><b>네거티브 샘플링:</b> 소프트맥스를 이진 분류 여러 개로 근사한다. 실제 문맥 쌍 (c,o)는 참으로, 잡음 분포 P<sub>n</sub>에서 뽑은 k개의 무작위 단어 u<sub>i</sub>는 거짓으로 구분하도록 log σ(u<sub>o</sub>·v<sub>c</sub>) + ∑<sub>i</sub> log σ(-u<sub>i</sub>·v<sub>c</sub>)를 최대화한다(σ는 시그모이드 함수). 잡음 분포로는 단어 빈도의 3/4승에 비례하는 분포가 경험적으로 가장 좋았다.</li>

<p>CBOW는 방향만 반대로, 문맥 단어 벡터들의 평균으로 중심 단어를 예측한다. Skip-gram은 희귀 단어 표현에, CBOW는 학습 속도에 유리한 것으로 보고됐다. 후속 논문에서는 자주 붙어 다니는 구(phrase)를 하나의 토큰으로 묶는 전처리와 네거티브 샘플링의 정식화가 추가됐다.</p>

<p>이렇게 사전학습한 모델은 일종의 만능 밑바탕이 된다. 감정 분석, 질의응답, 문장 관계 판단 등 어떤 과제든 작은 출력 장치 하나만 얹어 잠깐 다듬으면 됐고, 공개 직후 11개 벤치마크의 기록을 한꺼번에 갈아치웠다. 이후 수년간 "NLP 과제를 푼다"는 말은 사실상 "BERT를 미세조정한다"는 말과 같았다.</p>`,
      mid: `<p>BERT는 트랜스포머 인코더만 쌓은 모델이다. 인코더의 셀프 어텐션은 방향 제약이 없어 각 토큰이 문장 전체(왼쪽과 오른쪽 모두)를 참조한다. 문제는 이런 양방향 모델로는 "다음 단어 예측"을 학습할 수 없다는 것이다 — 예측 대상이 입력에 그대로 보이기 때문이다. 해법이 마스크 언어 모델(MLM)이다. 입력 토큰의 일부(약 15%)를 가리고, 가려진 자리의 원래 토큰을 최상층 표현으로부터 맞히게 한다. 예측 대상이 입력에서 지워져 있으므로 양방향 문맥을 마음껏 쓸 수 있다.</p>
<p>보조 과제로 다음 문장 예측(next sentence prediction, NSP)을 함께 학습했다. 문장 A 뒤에 실제로 이어지는 문장 B를 붙인 쌍과 무작위 문장을 붙인 쌍을 절반씩 만들어 이어짐 여부를 분류하게 함으로써, 질의응답·함의 판단에 필요한 문장 간 관계를 표현에 주입하려는 설계다. 입력은 WordPiece 서브워드로 토큰화되고, 문두의 [CLS] 토큰 표현은 시퀀스 전체의 요약으로, [SEP] 토큰은 문장 경계로 쓰인다.</p>
<p>전이는 미세조정 방식이다. 과제별로 얇은 출력 층(분류 헤드, 스팬의 시작/끝 예측기 등)만 추가하고 전체 파라미터를 소량의 라벨 데이터로 짧게 재학습한다. 같은 사전학습 모델 하나가 GLUE의 문장 분류들, SQuAD 질의응답, 개체명 인식까지 최고 성능을 냈다는 것이 논문의 실증적 핵심이며, "단방향 생성 모델(GPT 계열)과 양방향 이해 모델(BERT 계열)"이라는 당시의 양대 노선을 만들었다.</p>`,
      deep: `<p>사전학습을 단계별로 보면 다음과 같다. 입력 표현은 토큰 임베딩 + 세그먼트(문장 A/B 구분) 임베딩 + 위치 임베딩의 합이다.</p>
<ol>
<li><b>마스킹 전략:</b> 각 시퀀스에서 토큰의 15%를 예측 대상으로 뽑되, 그중 80%는 [MASK] 토큰으로 바꾸고 10%는 무작위 토큰으로, 10%는 원래 토큰 그대로 둔다. [MASK]는 미세조정 단계의 실제 입력에는 없는 인공 토큰이므로, 일부를 바꾸지 않거나 무작위로 바꿔 사전학습-미세조정 간 분포 불일치를 줄이고, 모델이 모든 위치의 표현을 성실히 유지하도록 만든다.</li>
<li><b>MLM 손실:</b> 마스킹된 위치 m에 대해서만, 최상층 표현에 어휘 크기의 소프트맥스를 얹어 원래 토큰의 교차 엔트로피 L<sub>MLM</sub> = -∑<sub>m</sub> log P(x<sub>m</sub>|x̃)를 계산한다(x̃는 마스킹된 입력 시퀀스). 전체 위치가 아니라 15%에서만 학습 신호가 나오므로 좌우 단방향 LM보다 수렴이 느리지만, 그 대가로 양방향 표현을 얻는다.</li>
<li><b>NSP 손실:</b> [CLS] 표현에 이진 분류기를 얹어 문장 쌍의 이어짐 여부를 맞힌다. 최종 목적 함수는 L<sub>MLM</sub> + L<sub>NSP</sub>다. 후속 연구 RoBERTa는 NSP를 제거해도 성능이 유지되거나 오히려 좋아짐을 보고했고, 마스킹을 매번 다시 뽑는 동적 마스킹 등으로 레시피를 다듬었다.</li>
<li><b>모델 규모:</b> BERT-base는 12층·은닉 768·헤드 12(약 1.1억 파라미터), BERT-large는 24층·은닉 1024·헤드 16(약 3.4억 파라미터)이며, BooksCorpus와 영어 위키백과로 사전학습했다.</li>
<li><b>미세조정 인터페이스:</b> 문장(쌍) 분류는 [CLS] 표현에 선형 층을, 스팬 추출(SQuAD)은 각 토큰 표현과 시작/끝 벡터의 내적으로 시작·끝 위치 분포를 계산하는 식으로 과제 구조를 얇은 헤드로 흡수한다. 전체 파라미터를 몇 에폭만 재학습해도 충분했다.</li>
</ol>
<p>절제 실험은 양방향성 자체가 핵심임을 보인다. 같은 데이터로 학습한 좌우 단방향 모델은 특히 스팬 추출 과제에서 크게 뒤졌고, 모델을 키울수록 소규모 데이터셋에서도 이득이 이어졌다. "이해 과제는 양방향 인코더, 생성 과제는 단방향 디코더"라는 분업 구도가 이 논문으로 굳어졌으며, 이 구도는 GPT-3 이후 생성 모델이 이해 과제까지 흡수하면서 다시 흔들리게 된다.</p>`
    },
    impact: `<p>BERT는 공개와 동시에 GLUE, SQuAD 등 11개 벤치마크 기록을 갈아치웠고, 이후 수년간 NLP 실무의 기본값이 됐다. RoBERTa, ALBERT, ELECTRA, DistilBERT 등 방대한 후속 계보를 낳았고, 검색 엔진의 질의 이해 같은 대규모 실서비스에도 투입된 것으로 알려져 있다. 방법론적으로는 "공개된 사전학습 모델을 받아 미세조정한다"는 오늘날의 표준 워크플로를 대중화했으며, 마스킹 기반 사전학습은 이미지(MAE)와 단백질 서열(ESM)까지 수출됐다.</p>`,

      mid: `<p>아키텍처는 GPT-2와 같은 계열의 디코더 전용 트랜스포머로, 밀집 어텐션과 국소 희소 어텐션 층을 교대로 쌓은 변형을 썼다. 본질적 변화는 규모다. 파라미터 1,750억 개, 컨텍스트 2,048 토큰, 품질 필터링한 Common Crawl에 WebText 확장판·도서·위키백과를 섞은 수천억 토큰 규모의 데이터로 학습했다. 1.25억부터 1,750억까지 8개 크기의 모델을 같은 조건으로 학습해, 규모에 따른 성능 곡선 자체를 실험 대상으로 삼았다.</p>

      intro: `<p>GPT-3는 아는 것이 많지만 시키는 대로 하지는 않았다. "프랑스어로 번역해 줘"라고 하면 번역 대신 비슷한 요청문을 계속 지어내기도 했다. 다음 단어 예측만 배웠으니 "사용자를 돕는 것"이 목표였던 적이 없기 때문이다. InstructGPT는 이를 <b>신입 작가 교육</b>에 비유할 수 있는 3단계로 고쳤다. 먼저 선배가 쓴 모범 답안을 따라 쓰게 하고, 다음으로 여러 초고 중 어느 것이 나은지 고르는 편집장의 기준을 별도의 채점기로 만들고, 마지막으로 그 채점기에서 높은 점수를 받도록 반복 연습을 시킨다.</p>

<p>결과는 상징적이다. 이렇게 훈련한 13억 파라미터 모델의 답변을 사람들은 100배 큰 1,750억 GPT-3의 답변보다 선호했다. 능력을 키우는 것과 그 능력을 사람이 원하는 방향으로 꺼내 쓰는 것은 다른 문제이며, 후자는 규모가 아니라 정렬(alignment) 기법의 문제라는 것을 보인 셈이다. 이 레시피가 몇 달 뒤 ChatGPT의 뼈대가 된다.</p>`,
      mid: `<p>RLHF(reinforcement learning from human feedback) 파이프라인은 3단계다. 1단계 SFT: 라벨러가 실제 API 프롬프트 유형에 대해 바람직한 답변을 직접 작성하고, GPT-3를 이 시연 데이터로 미세조정한다. 2단계 보상 모델(RM) 학습: 한 프롬프트에 대한 여러 모델 출력을 라벨러가 좋은 순서로 순위 매기면, 그 순위를 재현하도록 "프롬프트와 답변을 넣으면 점수를 내는" 모델을 학습한다. 절대 점수 대신 순위(비교) 데이터를 쓰는 이유는 라벨러 사이의 일관성이 비교 쪽이 높기 때문이다. 3단계 강화학습: SFT 모델을 초기 정책으로 두고, 답변을 생성하면 RM이 점수를 주는 환경에서 PPO(proximal policy optimization)로 정책을 갱신한다.</p>
<p>이때 두 가지 안전장치가 붙는다. 첫째, 정책이 원래 SFT 모델에서 너무 멀어지지 않도록 KL 페널티를 건다. RM은 사람 선호의 근사일 뿐이므로, 제약 없이 점수만 쫓으면 RM의 허점을 파고드는 이상한 출력(보상 해킹)이 나온다. 둘째, 사전학습 데이터의 언어 모델링 손실을 함께 섞어(PPO-ptx), 정렬 과정에서 일반 능력 벤치마크가 나빠지는 "정렬 세금(alignment tax)"을 줄인다.</p>
<p>평가에서 InstructGPT는 지시 이행, 사실성, 유해 출력 감소에서 GPT-3보다 일관되게 선호됐고, 특히 1.3B InstructGPT가 175B GPT-3보다 선호된다는 결과가 정렬 학습의 효율을 상징했다. 남는 문제로는 라벨러 집단의 선호가 누구의 가치를 대표하는가, 여전한 사실 날조, 지나치게 조심스러운 답변 경향 등이 논문에 정리돼 있다.</p>`,
      deep: `<p>각 단계의 학습 목표를 수식 수준에서 따라가면 다음과 같다.</p>
<ol>
<li><b>SFT:</b> 시연 데이터 (프롬프트 x, 답변 y)에 대한 표준 교차 엔트로피로 미세조정한다. 이렇게 얻은 모델 π<sup>SFT</sup>가 이후 단계의 기준점이 된다.</li>
<li><b>보상 모델:</b> SFT 모델에서 최종 언임베딩 층을 떼고 스칼라 출력 헤드를 얹어 r<sub>θ</sub>(x,y)를 만든다(θ는 RM 파라미터). 한 프롬프트당 K개의 답변을 순위 매긴 데이터에서 모든 쌍을 뽑아, 선호 답변 y<sub>w</sub>와 비선호 답변 y<sub>l</sub>에 대해 loss = -E[log σ(r<sub>θ</sub>(x,y<sub>w</sub>) - r<sub>θ</sub>(x,y<sub>l</sub>))]를 최소화한다(σ는 시그모이드). 즉 RM은 절대 점수가 아니라 선호 확률의 로짓 차이를 학습하며, 같은 프롬프트에서 나온 비교들을 한 배치로 묶어 과적합을 줄였다.</li>
<li><b>PPO 단계:</b> 정책 π<sub>φ</sub>가 프롬프트 분포에서 답변을 생성하면, 보상을 R(x,y) = r<sub>θ</sub>(x,y) - β·log[π<sub>φ</sub>(y|x)/π<sup>SFT</sup>(y|x)]로 정의한다. 두 번째 항이 토큰 수준 KL 페널티로, RM에 대한 과최적화(보상 해킹)와 분포 이탈을 억제한다(β는 페널티 계수). 이 보상으로 PPO를 수행하되, 사전학습 분포의 로그 우도 기울기를 계수 γ로 섞는 PPO-ptx 목적을 써서 공개 NLP 벤치마크 성능의 퇴행을 완화했다.</li>
<li><b>평가 설계:</b> 학습 데이터를 만들지 않은 별도 라벨러가 실제 API 프롬프트 분포에서 모델들의 답변을 블라인드 비교했고, TruthfulQA(사실성), RealToxicityPrompts(유해성) 등 공개 벤치마크도 병행 측정했다. 지시 이행·사실성·유해성 전반에서 개선이 확인됐지만, 편향 감소는 뚜렷하지 않았다고 보고했다.</li>
</ol>
<p>개념적으로 중요한 것은 RM이 사람 선호의 근사 모델일 뿐이라는 점이다. 정책을 RM에 대해 강하게 최적화할수록 진짜 선호와의 괴리가 커지는 과최적화 현상이 관찰되며, KL 제약과 조기 종료가 실무적 대응이다. 이 구조(선호 데이터 → 명시적 RM → 제약된 RL)는 이후 RM 없이 선호 데이터로 정책을 직접 최적화하는 DPO(direct preference optimization) 등 변형 연구의 출발점이 됐다.</p>`
    },
    impact: `<p>InstructGPT의 3단계 레시피는 그대로 <a href="#/item/chatgpt-2022">ChatGPT</a>의 기반이 됐고, RLHF는 이후 거의 모든 상용 LLM의 표준 후처리 공정이 됐다. "정렬이 곧 제품 품질"이라는 인식을 만들어 정렬 연구를 산업의 중심 문제로 끌어올렸으며, 보상 모델·선호 데이터·보상 해킹 같은 개념어를 LLM 개발의 일상 어휘로 만들었다. 명시적 보상 모델을 생략하는 DPO 등 후속 정렬 기법들도 이 논문이 정의한 문제 틀 위에서 전개됐다.</p>`,

    levels: {

      mid: `<p>내부 구조와 학습 세부는 비공개이며, 이하는 OpenAI의 공개 발표와 기술 계보에 근거한 설명이다. 공개된 설명에 따르면 ChatGPT는 GPT-3.5 계열 모델을 출발점으로, InstructGPT와 같은 RLHF 방법을 대화 설정에 맞춰 적용해 학습됐다. 지도 미세조정 단계에서는 사람 트레이너가 사용자 역할과 AI 역할을 모두 연기한 대화 데이터를 작성했고(모델이 만든 초안을 참고할 수 있게 했다), 보상 모델 단계에서는 모델이 낸 여러 답변을 트레이너가 순위 매긴 비교 데이터를 썼으며, 이를 바탕으로 PPO 계열의 강화학습을 수행한 것으로 알려져 있다.</p>
<p>제품 관점의 변화가 본질적이다. (1) 대화 이력이 자동으로 다음 입력의 문맥이 되므로, 사용자는 프롬프트 설계 없이 자연스러운 재질문과 수정 요청으로 출력을 다듬을 수 있다. (2) 부적절한 요청의 거절, 모르는 것에 대한 한계 인정 같은 안전 행동이 훈련 목표에 포함됐다. (3) 무료 웹 인터페이스로 배포되어 사용자 피드백이 대규모로 수집되고, 이것이 다시 모델 개선의 재료가 되는 반복 배포(iterative deployment) 구조가 만들어졌다.</p>
<p>한계도 공개 문서에 명시됐다. 그럴듯하지만 틀린 답변(환각), 질문 표현에 따라 달라지는 민감성, 장황한 답변 경향, 안전 장치의 우회 가능성 등이며, 이는 이후 버전들의 개선 목표가 됐다.</p>`,
      deep: `<p>세부 아키텍처·데이터·하이퍼파라미터는 비공개이므로, 이하는 공개 발표와 InstructGPT 논문으로부터 재구성한, 공개 정보 기준의 기술적 설명이다.</p>
<ol>

<li><b>RM과 강화학습:</b> InstructGPT와 동일한 구조 — 답변 순위 비교로 보상 모델 r(x,y)를 학습하고, 보상에서 기준 정책과의 괴리에 대한 페널티를 뺀 목적, 즉 r(x,y) - β·KL(π‖π<sub>ref</sub>) 형태(β는 계수, π는 학습 중인 정책, π<sub>ref</sub>는 기준 모델, KL은 두 분포의 괴리)를 PPO로 최적화 — 를 대화 데이터에 적용했다고 발표됐다.</li>

    levels: {
      intro: `<p>2012년 이전의 이미지 인식은 사람이 만든 규칙에 크게 의존했다. 연구자가 "모서리, 색 분포, 질감 같은 특징을 이렇게 뽑아라"라고 손으로 설계한 뒤, 그 특징을 분류기에 넣는 방식이었다. 마치 요리사가 재료 손질법을 일일이 레시피로 적어주는 것과 같다. 비유에서 손질 레시피는 실제로 사람이 설계한 특징 추출기(hand-crafted feature)에 해당한다.</p>
<p>AlexNet의 접근은 달랐다. 특징을 뽑는 법 자체를 기계가 데이터에서 스스로 배우게 했다. 수백만 장의 사진과 정답 라벨을 주고, 여러 층으로 쌓인 인공 신경망이 "고양이를 알아보려면 어떤 무늬와 모양에 주목해야 하는가"를 시행착오로 익히게 한 것이다. 비유하자면 레시피를 주는 대신 수많은 완성 요리와 재료를 보여주고 손질법을 스스로 터득하게 한 셈인데, 비유에서 완성 요리와 재료는 실제로 라벨이 달린 대규모 이미지 데이터(ImageNet)에, 스스로 터득하는 과정은 실제로 오차를 줄이는 방향으로 신경망 가중치를 조정하는 학습(역전파)에 해당한다.</p>
<p>이런 아이디어 자체는 오래전부터 있었지만, 그동안은 계산량과 데이터가 부족해 깊은 신경망을 제대로 학습시킬 수 없었다. AlexNet은 게임용 그래픽 카드(GPU) 두 장으로 병렬 계산을 돌리고, 대규모 데이터셋 ImageNet을 활용해 이 벽을 넘었다. 그 결과 2012년 이미지 인식 대회(ILSVRC)에서 2위와 큰 격차로 우승했고, 컴퓨터 비전 연구 전체가 딥러닝으로 방향을 트는 결정적 계기가 됐다.</p>`,
      mid: `<p>AlexNet은 합성곱 신경망(CNN, convolutional neural network)이다. 합성곱 층은 작은 필터(filter)를 이미지 전체에 밀며 적용해, 위치에 상관없이 같은 패턴(모서리, 질감 등)을 감지한다. 층을 쌓을수록 앞 층의 단순 패턴이 조합되어 눈·바퀴·얼굴 같은 복잡한 개념으로 추상화된다. 이 구조는 1990년대 LeNet에서 이미 제안됐지만, AlexNet은 이를 당시 기준 매우 큰 규모(합성곱 5층 + 완전연결 3층, 약 6천만 파라미터)로 키워 대규모 데이터에 적용했다는 점이 다르다.</p>
<p>규모를 키우면 두 가지 문제가 생긴다. 첫째는 계산량이다. AlexNet은 GPU 2장에 모델을 나눠 싣고 병렬로 학습해 이를 해결했다. 둘째는 과적합(overfitting) — 훈련 데이터만 외우고 새 데이터에 약해지는 현상 — 이다. 이를 막기 위해 이미지를 자르고 뒤집어 데이터를 부풀리는 데이터 증강(data augmentation), 그리고 학습 중 뉴런 일부를 무작위로 꺼서 특정 뉴런에 의존하지 못하게 하는 드롭아웃(dropout)을 사용했다.</p>
<p>활성 함수로는 당시 표준이던 시그모이드(sigmoid)나 tanh 대신 ReLU(rectified linear unit)를 썼다. ReLU는 입력이 양수면 그대로, 음수면 0을 내보내는 단순한 함수인데, 깊은 층에서도 기울기가 잘 살아 있어 학습이 몇 배 빨라진다. 이 조합 — 큰 CNN + GPU + 대규모 데이터 + ReLU + 드롭아웃 — 으로 ImageNet 분류 오류율을 기존 대비 크게 낮추며, "데이터와 계산을 늘리면 학습된 특징이 사람이 설계한 특징을 이긴다"는 것을 처음으로 대규모로 입증했다.</p>`,
      deep: `<p>구조를 순서대로 따라가면 다음과 같다. 입력은 224×224 크기의 RGB 이미지다.</p>
<ol>
<li><b>합성곱 1층:</b> 11×11 크기의 큰 필터를 보폭(stride) 4로 적용해 해상도를 빠르게 줄이면서 저수준 패턴(방향성 모서리, 색 대비)을 추출한다. 각 합성곱 출력에는 ReLU를 적용한다. ReLU는 f(x)=max(0,x)로, x는 뉴런의 입력 합이다. 포화 구간이 없어 기울기 소실이 완화되고, 논문은 tanh 대비 학습 수렴이 수 배 빨랐다고 보고한다.</li>
<li><b>합성곱 2~5층:</b> 5×5, 3×3 필터로 점차 추상적인 특징을 쌓는다. 중간에 최대 풀링(max pooling)으로 공간 크기를 줄이는데, 풀링 창을 보폭보다 크게 잡는 중첩 풀링(overlapping pooling)을 써 과적합을 소폭 줄였다. 1·2층 뒤에는 국소 응답 정규화(local response normalization)를 두어 이웃 채널 간 활성 경쟁을 유도했다(이 기법은 이후 배치 정규화 등장으로 사실상 폐기된다).</li>
<li><b>완전연결 3층:</b> 특징 맵을 펼쳐 4096차원 완전연결 층 두 개를 거친 뒤, 1000개 클래스에 대한 softmax로 확률을 출력한다. 파라미터 대부분이 이 완전연결 층에 몰려 있어 과적합 위험이 가장 크므로, 여기에 드롭아웃을 확률 0.5로 적용했다. 드롭아웃은 학습 시 각 뉴런 출력을 확률 p로 0으로 만드는 것으로, 뉴런 간 공적응(co-adaptation)을 깨는 일종의 암묵적 앙상블로 해석된다.</li>
<li><b>2-GPU 분산:</b> 당시 GPU 메모리(3GB)에 모델이 다 들어가지 않아, 채널을 반씩 나눠 GPU 두 장에 올리고 특정 층에서만 GPU 간 통신을 허용하는 모델 병렬화를 썼다. 이는 메모리 제약이 낳은 공학적 타협이지만, 대규모 학습에서 하드웨어 제약과 아키텍처 설계가 얽힌다는 이후 반복될 패턴의 초기 사례다.</li>
<li><b>학습:</b> 모멘텀 SGD(stochastic gradient descent)로 학습하되, 검증 오류가 정체될 때 학습률을 10분의 1로 낮추는 스케줄을 썼다. 데이터 증강으로는 256×256 이미지에서 224×224 무작위 크롭과 좌우 반전, 그리고 RGB 채널의 주성분 방향으로 색을 흔드는 PCA 색 증강을 사용했다. 테스트 시에는 여러 크롭의 예측을 평균했다.</li>
</ol>
<p>결과적으로 ILSVRC-2012에서 top-5 오류율을 2위(전통적 특징 기반 방법)보다 약 10%p 낮은 수준으로 끌어내렸다. 개별 요소(CNN, ReLU, GPU 학습, 드롭아웃)는 모두 선행 연구가 있었으나, 이들을 대규모 데이터 위에서 결합해 압도적 격차를 실증한 것이 이 논문의 기여다. 학습된 1층 필터가 가보(Gabor) 유사 모서리 검출기와 색 블롭으로 수렴한다는 시각화는, 손으로 설계하던 특징이 데이터로부터 재발견될 수 있음을 보여준 상징적 결과였다.</p>`
    },
    impact: `<p>AlexNet은 컴퓨터 비전을 넘어 AI 전체의 분수령이다. 이후 수년간 비전 연구는 사실상 "더 깊고 더 나은 CNN 만들기"로 재편됐고, <a href="#/item/vgg-2014">VGG</a>, <a href="#/item/googlenet-2014">GoogLeNet</a>, <a href="#/item/resnet-2015">ResNet</a>이 그 직계 후손이다. 학습된 특징을 다른 과제에 이식하는 전이 학습(transfer learning)이 표준이 되어 <a href="#/item/rcnn-2013">R-CNN</a> 같은 검출 연구의 토대가 됐다. 산업적으로는 GPU가 AI 인프라의 중심이 되는 흐름의 출발점이었고, "데이터 × 계산 × 신경망 규모"라는 조합의 힘을 입증해 이후 대규모 사전학습 시대의 원형이 됐다.</p>`,

window.AITL.register({
  id: "rcnn-2013", sector: "vision", also_in: [], type: "paper", tier: "major",
  year: 2013, date: "2013-11", evolves_from: ["alexnet-2012"],
  title_en: "Rich feature hierarchies for accurate object detection and semantic segmentation",
  name_ko: "R-CNN",
  oneliner: "CNN 특징을 객체 검출에 도입해 검출 성능을 도약",
  link: { kind: "arxiv", label: "arXiv:1311.2524", url: "https://arxiv.org/abs/1311.2524" },
  detail: {
    tldr: "이미지에서 후보 영역을 뽑아 각 영역을 CNN으로 분류하는 2단계 설계로, 객체 검출 성능을 단숨에 끌어올렸다.",
    levels: {
      intro: `<p>이미지 분류는 "이 사진이 무엇인가"에 답하지만, 객체 검출(object detection)은 "무엇이 어디에 있는가"까지 답해야 한다. 사진 한 장에 개, 자전거, 사람이 함께 있으면 각각의 위치를 상자로 표시하고 이름을 붙여야 하는 것이다. 2012년 AlexNet이 분류에서 큰 성공을 거두자, 자연스러운 질문이 나왔다. 그 강력한 인식 능력을 검출에도 쓸 수 없을까?</p>
<p>R-CNN의 답은 두 단계 전략이다. 먼저 "여기 뭔가 있을 것 같다" 싶은 후보 영역을 이미지에서 2천 개쯤 뽑는다. 그다음 각 후보 영역을 잘라내 CNN에 넣고 "이건 개다 / 이건 배경이다"를 판별한다. 보물찾기에 비유하면, 넓은 운동장을 무작정 파는 대신 금속 탐지기가 반응한 지점들만 골라 그 자리를 정밀하게 파보는 것이다. 비유에서 금속 탐지기가 반응한 지점은 실제로 색·질감의 연속성으로 뽑은 후보 영역(region proposal)에 해당하고, 정밀하게 파보는 일은 실제로 각 영역을 CNN으로 분류하는 과정에 해당한다.</p>
<p>또 하나 중요한 기여는 전이 학습이다. 검출용 라벨 데이터는 분류용보다 훨씬 적었는데, R-CNN은 ImageNet 분류로 미리 학습해 둔 CNN을 가져와 검출 데이터로 조금만 더 다듬는(fine-tuning) 방식으로 데이터 부족을 넘었다. 이 방법으로 당시 검출 벤치마크 성능을 큰 폭으로 끌어올렸고, "큰 데이터로 사전학습 후 작은 데이터로 미세조정"이라는 오늘날 표준 패턴의 초기 성공 사례가 됐다.</p>`,
      mid: `<p>R-CNN 파이프라인은 세 부분으로 이루어진다. (1) 영역 제안: 선택적 탐색(selective search)이라는 비학습 알고리즘으로, 색·질감이 비슷한 픽셀 덩어리를 병합해 가며 객체가 있을 법한 후보 상자를 이미지당 약 2천 개 생성한다. (2) 특징 추출: 각 후보 상자를 잘라 고정 크기(227×227)로 변형한 뒤 CNN(AlexNet 구조)에 통과시켜 특징 벡터를 얻는다. (3) 분류·보정: 클래스별 SVM(support vector machine)이 특징 벡터를 보고 객체 여부를 판정하고, 별도의 회귀 모델이 상자 좌표를 정밀하게 보정(bounding box regression)한다.</p>
<p>핵심 통찰은 검출 문제를 "영역 단위 분류 문제"로 환원한 것이다. 위치 추정이라는 어려운 문제를 후보 생성기에 맡기고, CNN은 잘하는 일(분류)만 하게 했다. 여기에 ImageNet 사전학습 → 검출 데이터 미세조정이라는 전이 학습을 결합해, 라벨이 부족한 과제에서도 CNN 특징의 위력을 끌어냈다. PASCAL VOC 벤치마크에서 기존 최고 방식 대비 평균 정밀도(mAP)를 큰 폭으로 개선했다.</p>
<p>한계도 명확했다. 후보 2천 개를 각각 CNN에 통과시키므로 이미지 한 장 처리에 수십 초가 걸렸고, 학습도 CNN·SVM·상자 회귀를 따로따로 훈련하는 다단계 절차였다. 이 비효율을 없애는 것이 이후 Fast R-CNN과 <a href="#/item/faster-rcnn-2015">Faster R-CNN</a>의 과제가 된다.</p>`,
      deep: `<p>파이프라인을 단계별로 짚으면 다음과 같다.</p>
<ol>
<li><b>영역 제안:</b> 선택적 탐색은 그래프 기반 초기 분할로 작은 조각들을 만든 뒤, 색 히스토그램·질감·크기 유사도로 인접 조각을 계층적으로 병합하며 각 병합 단계의 외접 상자를 후보로 수집한다. 학습이 필요 없고 재현율(recall)이 높은 대신, 후보의 정밀도는 낮아 대부분이 배경이다.</li>
<li><b>워핑과 특징 추출:</b> 각 후보를 주변 여백 약간과 함께 227×227로 비등방 워핑(warping)해 CNN에 넣는다. CNN은 ImageNet 1000-클래스 분류로 사전학습한 뒤, 검출 클래스(N개)+배경의 (N+1)-way softmax로 교체해 미세조정한다. 미세조정 시 정답 상자와의 IoU(intersection over union, 두 상자의 교집합 넓이를 합집합 넓이로 나눈 값) ≥ 0.5인 후보를 양성으로 삼는다.</li>
<li><b>SVM 분류:</b> 미세조정된 CNN의 특징(fc7 벡터)으로 클래스별 이진 SVM을 학습한다. 이때는 정답 상자만 양성, IoU &lt; 0.3인 후보를 음성으로 하는 더 엄격한 기준을 쓰고, 배경 후보가 압도적으로 많으므로 어려운 음성 예제를 골라 재학습하는 hard negative mining을 적용한다. softmax 대신 SVM을 쓴 것은 당시 실험적으로 성능이 더 좋았기 때문이다.</li>
<li><b>상자 회귀:</b> 후보 상자 P에서 정답 상자 G로 가는 변환(중심 이동 dx, dy와 폭·높이의 로그 스케일 변화 dw, dh)을 CNN 특징의 선형 회귀로 예측해 위치를 보정한다. 이 파라미터화는 이후 검출기들이 그대로 물려받는다.</li>
<li><b>후처리:</b> 클래스별로 비최대 억제(NMS, non-maximum suppression)를 적용해, 점수가 높은 상자와 많이 겹치는(IoU가 임계값 이상) 중복 상자를 제거한다.</li>
</ol>
<p>결과는 PASCAL VOC 2010 기준 mAP 53.7%로, DPM 등 기존 최고 방식(약 33~40% 수준)을 크게 앞섰다. 분석 실험도 영향력이 컸다. 미세조정 없이 사전학습 특징만 써도 기존 방식을 이긴다는 것, 미세조정이 특히 검출 특화 표현을 만들어 준다는 것을 절제 실험(ablation)으로 보였고, 이는 전이 학습의 유효성에 대한 초기의 체계적 증거가 됐다. 반면 후보마다 CNN 순전파를 반복하는 구조적 중복, 3단계 분리 학습, 특징 디스크 캐싱 등 공학적 부담이 커서, 공유 특징 맵 위에서 영역별 풀링을 하는 SPPnet·Fast R-CNN 계열 개선을 곧바로 촉발했다.</p>`

    levels: {
      intro: `<p>2015년 무렵 연구자들은 이상한 벽에 부딪혔다. 신경망을 더 깊게 쌓으면 성능이 좋아져야 할 것 같은데, 20층을 넘겨 무작정 쌓으면 오히려 훈련 자체가 잘 안 되고 성능이 떨어졌다. 과적합이 아니라 훈련 오류부터 나빠지는, "깊을수록 배우기 어려워지는" 열화 문제였다.</p>
<p>ResNet의 해법은 지름길이다. 각 층 묶음에 입력을 그대로 출력 쪽으로 건너뛰어 더해주는 연결(skip connection)을 놓았다. 이렇게 하면 층은 "정답 전체"를 새로 만드는 대신 "입력에서 무엇을 고칠지"라는 차이만 배우면 된다. 문서 작업에 비유하면, 매번 보고서를 백지에서 다시 쓰는 대신 이전 판을 그대로 두고 수정 사항만 빨간 펜으로 덧붙이는 것이다. 비유에서 이전 판 보고서는 실제로 지름길로 전달되는 입력에, 빨간 펜 수정 사항은 실제로 층이 학습하는 잔차(residual)에 해당한다. 고칠 것이 없으면 아무것도 안 쓰면 되듯, 층도 "수정 없음"을 아주 쉽게 표현할 수 있어 깊게 쌓아도 손해가 나지 않는다.</p>
<p>이 단순한 장치로 152층 신경망이 안정적으로 학습됐고, ResNet은 2015년 ImageNet 대회 분류·검출 등 여러 부문을 석권했다. 이미지 인식 오류율은 사람 수준으로 거론되던 선을 넘어섰다. 잔차 연결은 이후 비전을 넘어 트랜스포머를 포함한 거의 모든 현대 신경망의 기본 부품이 됐다.</p>`,
      mid: `<p>먼저 문제를 정확히 하자. 깊은 일반(plain) 네트워크의 열화(degradation)는 과적합이 아니다. 56층 망이 20층 망보다 훈련 오류조차 높았다. 이론상 깊은 망은 얕은 망에 항등 사상(identity mapping) 층을 얹은 해를 표현할 수 있으므로 최소한 같은 성능이 가능해야 하는데, 실제 최적화가 그 해를 찾지 못한다는 뜻이다. 즉 이것은 표현력의 문제가 아니라 최적화의 문제다.</p>
<p>잔차 학습(residual learning)은 학습 목표를 재정의한다. 층 묶음이 원하는 변환 H(x)를 통째로 근사하는 대신, 잔차 F(x) = H(x) − x를 근사하게 하고 출력은 F(x) + x로 만든다. 구현은 간단하다. 두세 개의 합성곱 층을 지나는 경로에, 입력 x를 그대로 더해주는 지름길(shortcut)을 병렬로 놓으면 된다. 지름길은 파라미터가 없어 계산·파라미터 비용이 거의 들지 않는다.</p>
<p>왜 이게 배우기 쉬운가. 최적 변환이 항등에 가깝다면(깊은 망의 상위 층에서 흔한 상황), 일반 층은 여러 비선형 층으로 항등 함수를 흉내 내야 하지만 잔차 블록은 F(x)를 0에 가깝게, 즉 가중치를 0 근처로 밀기만 하면 된다. 또 지름길 덕분에 출력에서 입력까지 기울기가 곧장 흐르는 경로가 생겨, 깊이가 늘어도 학습 신호가 아래층까지 잘 전달된다. 배치 정규화(batch normalization)와 결합해, 18·34·50·101·152층의 ResNet 계열이 깊이에 비례해 성능이 좋아지는 것을 보였고, 50층 이상에서는 1×1로 채널을 줄였다 늘리는 병목(bottleneck) 블록으로 계산량을 관리했다.</p>`,
      deep: `<p>잔차 블록의 메커니즘을 단계별로 보면 다음과 같다.</p>
<ol>
<li><b>블록 정의:</b> 블록 입력을 x, 학습할 잔차 함수를 F(x, W) (W는 블록 내 합성곱 가중치)라 하면 블록 출력은 y = F(x, W) + x다. 기본 블록은 3×3 합성곱 두 개(각각 배치 정규화와 ReLU 동반)로 F를 구성하고, 덧셈 후에 마지막 ReLU를 적용한다. 입력·출력의 채널이나 해상도가 다르면 지름길에 1×1 합성곱을 두어 차원을 맞춘다.</li>
<li><b>기울기 흐름:</b> 블록을 L개 쌓으면 x<sub>L</sub> = x<sub>l</sub> + Σ F(x<sub>i</sub>, W<sub>i</sub>) (i = l..L−1) 꼴이 되어, 손실 E의 기울기는 ∂E/∂x<sub>l</sub> = ∂E/∂x<sub>L</sub> · (1 + ∂ΣF/∂x<sub>l</sub>)로 분해된다. 괄호 안의 상수 1이 핵심이다. 어떤 층에서도 기울기가 곱셈 연쇄만으로 소멸하지 않고 덧셈 경로로 직접 전달된다. 일반 망에서는 기울기가 층마다 야코비안의 곱으로만 전파되어 깊이에 따라 지수적으로 소실·폭주하기 쉽다.</li>
<li><b>항등 사상 가설:</b> 열화 문제의 진단은 "여러 비선형 층으로 항등 사상을 근사하는 것이 어렵다"는 것이다. 잔차 파라미터화에서는 항등이 F=0이라는 자명한 해가 되므로, 최적 해가 항등 근처에 있을 때 최적화가 훨씬 쉬워진다. 실제로 학습된 잔차의 응답 크기가 일반 망의 층 응답보다 작다는 분석을 논문이 제시하며, 층들이 "작은 섭동"을 배우고 있음을 시사했다.</li>
<li><b>병목 블록:</b> 깊은 버전(50/101/152층)은 1×1(채널 축소) → 3×3 → 1×1(채널 복원)의 3층 병목 구조를 써서, 깊이를 늘리면서도 계산량을 <a href="#/item/vgg-2014">VGG</a>보다 낮게 유지했다. 152층 ResNet의 연산량이 VGG-19보다 적다.</li>
<li><b>결과와 후속:</b> ImageNet에서 앙상블 기준 top-5 오류율 3.57%로 2015년 대회 분류 부문에서 우승했고, 같은 표현을 백본으로 쓴 검출·분할에서도 큰 폭의 개선을 보였다. 후속 연구(pre-activation ResNet)는 배치 정규화와 ReLU를 합성곱 앞으로 옮겨 지름길을 완전한 항등 경로로 만들면 1000층 이상도 학습됨을 보였다. 잔차 연결을 확률적 깊이·앙상블 관점으로 해석하는 연구들도 뒤따랐다.</li>
</ol>
<p>정리하면 ResNet의 기여는 새로운 표현력의 추가가 아니라, 파라미터화를 바꿔 최적화 지형을 평탄하게 만든 것이다. "출력 = 입력 + 보정"이라는 형식은 이후 트랜스포머의 잔차 연결로 그대로 이어져, 오늘날 수백 층 규모 모델 학습의 전제 조건이 됐다.</p>`
    },
    impact: `<p>ResNet은 "깊이의 한계"를 최적화 문제로 재정의하고 해결해, 이후 모든 초심층 모델의 문법을 만들었다. 비전에서는 검출(<a href="#/item/faster-rcnn-2015">Faster R-CNN</a> 계열의 표준 백본)·분할·비디오 인식의 기본 뼈대가 됐고, 잔차 연결 자체는 트랜스포머 블록에 내장되어 GPT·BERT·<a href="#/item/vit-2020">ViT</a> 등 현대 대규모 모델 전부가 공유하는 부품이 됐다. "지름길을 놓으면 깊게 쌓을 수 있다"는 원리는 아키텍처를 넘어 최적화 지형 연구, 신경망의 앙상블적 해석 등 이론 연구에도 긴 파장을 남겼다.</p>`,
    uncertainty: []
  }
});

    levels: {

      mid: `<p>선행 계보 대비 변경점은 다음과 같다. Fast R-CNN은 이미지 전체를 CNN에 한 번만 통과시켜 특징 맵을 만들고 후보 영역별로 RoI 풀링(region of interest pooling)으로 특징을 잘라 쓰는 방식으로 <a href="#/item/rcnn-2013">R-CNN</a>의 중복 계산을 없앴지만, 후보 자체는 여전히 외부 알고리즘이 이미지당 약 2초에 걸쳐 생성했다. Faster R-CNN의 RPN은 이 특징 맵 위를 작은 합성곱 창이 훑으면서 각 위치마다 "객체가 있는가(objectness) + 상자를 어떻게 그릴까"를 직접 예측한다. 핵심 장치는 앵커(anchor)다. 각 위치에 크기·가로세로비가 다른 기준 상자 여러 개(논문 기준 9개)를 미리 깔아 두고, 예측을 "앵커 대비 보정량"으로 정의해 다양한 크기의 객체를 한 번의 순전파로 다룬다. RPN이 낸 후보를 같은 특징 맵 위의 Fast R-CNN 헤드가 분류·정밀 보정하므로, 제안과 검출이 계산을 공유하는 단일 네트워크가 된다.</p>`,

    levels: {
      intro: `<p>이름부터 선언이다. You Only Look Once — 한 번만 본다. <a href="#/item/rcnn-2013">R-CNN</a> 계열은 "후보 영역을 뽑고, 각 후보를 다시 들여다보는" 2단계 방식이었다. 정확하지만, 같은 이미지를 사실상 수백~수천 번 다시 보는 셈이라 느렸다. YOLO는 이 과정을 통째로 없앴다. 이미지 전체를 신경망에 한 번 통과시키면, 모든 객체의 위치 상자와 종류가 한꺼번에 출력된다.</p>
<p>동네 지도를 만드는 일에 비유할 수 있다. 2단계 방식이 "수상한 곳 목록을 먼저 만들고 한 곳씩 방문 조사"하는 것이라면, YOLO는 숙련된 조사원이 동네를 바둑판처럼 구역으로 나눠 한 번 둘러보며 "이 구역엔 가게, 저 구역엔 학교"라고 동시에 기록하는 것이다. 비유에서 바둑판 구역은 실제로 이미지를 나눈 격자 칸(grid cell)에 해당하고, 각 구역의 동시 기록은 실제로 각 격자 칸이 자기 담당 객체의 상자 좌표와 클래스를 예측하는 것에 해당한다.</p>
<p>이 설계로 YOLO는 초당 수십 프레임, 즉 동영상을 실시간으로 처리하는 속도를 달성했다. 초기 버전은 작은 물체나 겹친 물체에서 2단계 방식보다 정확도가 낮았지만, "빠르고 충분히 정확한" 검출은 자율주행·로봇·CCTV처럼 즉각 반응이 필요한 응용의 문을 열었다. 또 이미지 전체를 한눈에 보므로 배경을 객체로 착각하는 오류가 적다는 장점도 있었다.</p>`,
      mid: `<p>YOLO는 검출을 "제안 후 분류"가 아니라 단일 회귀(regression) 문제로 재정식화한다. 입력 이미지를 S×S 격자(논문 기준 7×7)로 나누고, 객체 중심이 속한 격자 칸이 그 객체를 책임진다. 각 칸은 (1) 경계 상자 B개(각각 중심 좌표, 폭, 높이)와 그 상자에 객체가 있을 신뢰도(confidence), (2) 클래스 확률 분포를 예측한다. 즉 네트워크의 출력은 S×S×(B×5+클래스 수) 크기의 텐서 하나이고, 검출은 이 텐서를 한 번의 순전파로 채우는 일이 된다.</p>
<p>학습은 이 출력 전체를 정답과 맞추는 합성 손실 하나로 이루어진다. 상자 좌표 오차, 신뢰도 오차, 클래스 오차를 가중합하되, 대부분의 칸에는 객체가 없으므로 배경 칸의 신뢰도 손실 가중치를 낮춰 학습이 배경에 지배되지 않게 한다. 추론 시에는 신뢰도 낮은 상자를 버리고 겹치는 상자를 비최대 억제(NMS)로 정리한다.</p>
<p>속도의 원천은 구조적 단순함이다. 영역 제안, 영역별 특징 추출, 별도 분류기가 전부 사라지고 CNN 한 번이면 끝난다. 기본 YOLO는 초당 45프레임, 경량판 Fast YOLO는 150프레임 이상을 냈다. 대가는 정밀도다. 칸마다 상자 수가 제한되어 새 떼처럼 작은 객체가 몰려 있으면 놓치고, 거친 격자 탓에 위치 오차가 상대적으로 컸다. 이 트레이드오프는 이후 SSD, RetinaNet, YOLO 후속 버전들이 앵커·멀티스케일 특징 등으로 좁혀 나간다.</p>`,
      deep: `<p>메커니즘을 단계별로 따라가면 다음과 같다.</p>

<li><b>출력 파라미터화:</b> 이미지를 S×S 격자로 나누고, 각 칸이 B개의 상자를 예측한다. 상자마다 (x, y, w, h, c) 5개 값을 내는데, x·y는 담당 칸 기준의 상대 중심 좌표, w·h는 이미지 전체 대비 비율, c는 신뢰도다. 신뢰도의 학습 목표는 Pr(객체)×IOU — 상자에 객체가 있을 확률과 예측 상자·정답 상자의 겹침(IoU)의 곱 — 으로 정의된다. 클래스 확률은 칸 단위로 한 벌만 예측하므로, 한 칸에 두 클래스가 겹치면 표현할 수 없다는 구조적 한계가 있다.</li>
<li><b>네트워크:</b> GoogLeNet에서 영감을 받은 24층 합성곱(인셉션 모듈 대신 1×1 축소 + 3×3 조합) 뒤에 완전연결 2층을 붙여 7×7×30 텐서(PASCAL VOC: B=2, 20클래스)를 출력한다. 분류용으로 ImageNet 사전학습 후 검출용 입력 해상도(448×448)로 미세조정한다.</li>
<li><b>손실 설계:</b> 제곱합 오차를 쓰되 세 가지 보정을 한다. (a) 좌표 손실 가중치 λ<sub>coord</sub>=5로 위치 학습을 강조하고, 객체 없는 칸의 신뢰도 손실은 λ<sub>noobj</sub>=0.5로 낮춰 양성/음성 불균형을 완화한다. (b) 큰 상자와 작은 상자의 오차를 공평하게 다루기 위해 w, h 대신 √w, √h를 회귀한다. (c) 칸의 B개 상자 중 정답과 IoU가 가장 높은 상자 하나만 그 객체의 "책임자"로 지정해 좌표·신뢰도 손실을 받게 함으로써, 상자 예측기들이 크기·비율별로 분업하도록 유도한다.</li>
<li><b>추론:</b> 한 번의 순전파로 98개(7×7×2) 상자를 얻고, 클래스 확률×신뢰도로 클래스별 점수를 만든 뒤 임계값과 NMS로 정리한다. 전체가 단일 네트워크이므로 end-to-end 최적화와 실시간 처리가 동시에 가능하다.</li>
<li><b>성능 특성:</b> PASCAL VOC 기준 mAP는 당시 최고 2단계 검출기(<a href="#/item/faster-rcnn-2015">Faster R-CNN</a>)보다 낮았지만 속도는 몇 배 빨랐고, 위치 오차는 많은 대신 배경 오검출은 Fast R-CNN보다 훨씬 적었다. 이미지 전체 문맥을 보고 예측하기 때문이다. 그림 같은 다른 도메인으로의 일반화도 상대적으로 좋았다.</li>

<p>이후 계보에서 YOLOv2는 앵커 도입과 배치 정규화로, YOLOv3는 멀티스케일 예측으로 약점을 보완했고, 커뮤니티 주도의 v4 이후 버전들이 이어지며 "실시간 검출 = YOLO 계열"이라는 구도가 오래 유지됐다. 검출을 밀집 예측 텐서 하나로 정식화한 관점은 1단계 검출기 전체(SSD, RetinaNet, 앵커 없는 FCOS 등)의 출발점이 됐다.</p>`

    impact: `<p>YOLO는 "정확도의 검출"을 "속도의 검출"로 확장해, 객체 검출을 실험실 밖 실시간 응용(자율주행 인지, 로봇 비전, 영상 감시, 스포츠 분석)으로 끌고 나온 전환점이다. 1단계 검출이라는 문제 정식화는 SSD·RetinaNet 등 후속 연구의 기준 틀이 됐고, 초점 손실(focal loss)·앵커 프리 설계 같은 후속 혁신도 이 틀 위에서 나왔다. YOLO 계열 자체도 오픈소스 생태계에서 버전을 거듭하며 산업 현장에서 가장 널리 배포된 검출기 계보로 자리 잡았다.</p>`,

<p>U-Net의 구조는 이름처럼 U자 모양이다. 앞쪽 절반은 이미지를 점점 줄여 가며 "무엇이 있는지"라는 큰 그림을 파악하고, 뒤쪽 절반은 그 정보를 다시 원래 크기로 키워 가며 "정확히 어디인지"를 픽셀 단위로 복원한다. 문제는 줄이는 과정에서 경계의 세밀한 위치 정보가 사라진다는 것인데, U-Net은 줄이기 전 단계의 선명한 지도를 복원 단계로 직접 건네주는 연결 통로를 U자의 양쪽 사이에 놓아 이를 해결했다. 지도 제작에 비유하면, 위성에서 본 전체 지형 파악과 현장에서 찍은 정밀 사진을 합쳐 최종 지도를 그리는 것이다. 비유에서 위성 전체 지형은 실제로 축소 경로가 뽑은 의미(문맥) 정보에, 현장 정밀 사진은 실제로 스킵 연결(skip connection)로 전달되는 고해상도 특징에 해당한다.</p>

      mid: `<p>U-Net은 완전 합성곱 네트워크(FCN, fully convolutional network) 계열이다. 완전연결 층 없이 합성곱만으로 구성되어 임의 크기 입력을 받아 픽셀별 클래스 지도를 출력한다. 구조는 대칭적인 두 경로다. 수축 경로(contracting path)는 "3×3 합성곱 두 번 + 최대 풀링"을 반복하며 해상도를 절반씩 줄이고 채널을 두 배씩 늘려, 넓은 문맥을 담은 추상적 특징을 만든다. 확장 경로(expanding path)는 업컨볼루션(up-convolution, 학습 가능한 업샘플링)으로 해상도를 다시 두 배씩 키우며 분할 지도를 복원한다.</p>
<p>핵심 설계는 스킵 연결이다. 확장 경로의 각 단계에서, 같은 해상도였던 수축 경로의 특징 맵을 가져와 채널 방향으로 이어붙인 뒤 합성곱을 적용한다. 다운샘플링으로 잃어버린 공간 정밀도를 인코더의 고해상도 특징으로 보충하는 것이다. 이 덕에 "의미는 깊은 층에서, 위치는 얕은 층에서" 가져오는 결합이 가능해진다. 선행 연구인 FCN도 업샘플과 얕은 층 결합을 시도했지만, U-Net은 이를 모든 해상도 단계에서 대칭적으로, 그리고 풍부한 채널(확장 경로에도 많은 채널 유지)로 수행해 정밀도를 끌어올렸다.</p>

    levels: {
      intro: `<p>딥러닝 비전의 성공은 대부분 사람이 단 라벨("이 사진은 고양이") 위에 서 있었다. 그런데 라벨은 비싸고, 세상의 이미지는 대부분 라벨이 없다. DINO가 보여준 것은 라벨 없이도(self-supervised) 뛰어난 시각 표현을 배울 수 있다는 것, 그리고 그렇게 배운 모델 안에 아무도 가르치지 않은 능력이 나타난다는 것이다.</p>
<p>학습 방식은 학생과 교사의 문답에 비유할 수 있다. 같은 사진을 두 벌로 가공해 — 하나는 넓게 본 모습, 하나는 일부만 확대한 모습 — 교사에게는 전체를, 학생에게는 조각을 보여주고, 학생이 교사와 같은 답을 내도록 훈련한다. 특별한 점은 교사가 따로 있지 않다는 것이다. 교사는 학생 자신의 과거 모습들을 천천히 평균 낸 분신이다. 비유에서 학생은 실제로 기울기로 학습되는 신경망(student)에, 교사는 실제로 학생 가중치의 이동 평균으로만 갱신되는 같은 구조의 신경망(teacher)에, 문답의 "같은 답"은 실제로 두 네트워크 출력 분포를 일치시키는 것에 해당한다. 어제의 나(들의 평균)를 스승 삼아 오늘의 내가 배우는 셈이다.</p>
<p>이렇게 학습한 ViT를 들여다보자 놀라운 성질이 드러났다. 모델이 이미지의 어디를 주목하는지 시각화하면, 객체의 윤곽이 배경과 분리되어 선명하게 떠올랐다. 분할(segmentation)을 가르친 적이 없는데 그 능력의 씨앗이 창발한 것이다. 또 학습된 특징은 추가 학습 없이 단순 비교만으로도 이미지 분류·검색에 곧바로 쓸 만했다. "라벨 없는 대규모 학습으로 범용 시각 능력을 얻는다"는 노선의 이정표가 됐다.</p>`,
      mid: `<p>DINO(self-DIstillation with NO labels)는 자기증류(self-distillation) 프레임워크다. 같은 구조의 student와 teacher 네트워크(백본은 <a href="#/item/vit-2020">ViT</a> 또는 ResNet)를 두고, 한 이미지의 서로 다른 증강 뷰를 각각에 입력한다. 두 네트워크는 이미지를 확률 분포 형태의 출력으로 사영하고, student의 분포가 teacher의 분포를 따라가도록 교차 엔트로피를 최소화한다. 라벨은 어디에도 없다. teacher의 출력이 곧 학습 목표다.</p>
<p>teacher는 별도로 학습되지 않는다. student 가중치의 지수 이동 평균(EMA, exponential moving average)으로만 갱신된다. 평균으로 만들어진 teacher는 student보다 안정적이고 살짝 더 좋은 표적을 제공하는 일종의 앙상블 역할을 하며, 이것이 학습을 견인한다. 뷰 구성에는 멀티크롭(multi-crop)을 쓴다. 넓은 영역의 글로벌 뷰 2개와 좁은 로컬 뷰 여러 개를 만들어, 로컬(student) → 글로벌(teacher) 방향의 대응을 강제함으로써 "부분에서 전체를 알아보는" 표현을 유도한다.</p>
<p>이런 자기 참조 구조의 최대 위험은 붕괴(collapse)다. 모든 입력에 같은 출력을 내면 손실이 쉽게 0이 되기 때문이다. 대조 학습(SimCLR 등)은 음성 쌍 비교로, BYOL은 예측기 비대칭으로 이를 막았지만, DINO는 더 단순한 두 장치로 해결했다. teacher 출력에서 배치 평균을 빼는 센터링(centering)은 한 차원으로의 쏠림을 막고, teacher의 softmax 온도를 낮게 잡는 샤프닝(sharpening)은 균등 분포로의 퇴화를 막는다. 두 힘이 반대 방향으로 작용해 균형을 이룬다. 학습 결과, ViT의 어텐션 맵이 객체 경계를 포착하고, 특징 공간에서의 k-최근접 이웃 분류만으로도 높은 ImageNet 정확도를 내는 등, 미세조정 없이 쓸 수 있는 표현의 질이 크게 올랐다.</p>`,
      deep: `<p>학습 루프를 단계별로 쓰면 다음과 같다.</p>
<ol>
<li><b>뷰 생성:</b> 이미지 x에서 증강(크롭, 색 왜곡, 블러 등)으로 글로벌 뷰 2개와 로컬 뷰 여러 개를 만든다. teacher는 글로벌 뷰만, student는 모든 뷰를 받는다. 서로 다른 뷰 조합 (뷰 A → teacher, 뷰 B → student)마다 손실을 계산해 합산한다.</li>
<li><b>출력 분포:</b> 각 네트워크는 백본 특징을 MLP 사영 헤드에 통과시켜 K차원 로짓을 얻고 softmax로 분포를 만든다. student 분포 P<sub>s</sub>(x) = softmax(g<sub>s</sub>(x)/τ<sub>s</sub>), teacher 분포 P<sub>t</sub>(x) = softmax((g<sub>t</sub>(x) − c)/τ<sub>t</sub>). 여기서 g는 네트워크 출력, τ<sub>s</sub>·τ<sub>t</sub>는 온도, c는 센터링 벡터다. 손실은 H(P<sub>t</sub>, P<sub>s</sub>) = −Σ P<sub>t</sub> log P<sub>s</sub>로, teacher 쪽에는 기울기를 흘리지 않는다(stop-gradient).</li>
<li><b>teacher 갱신:</b> 매 스텝 teacher 가중치를 θ<sub>t</sub> ← λθ<sub>t</sub> + (1−λ)θ<sub>s</sub>로 갱신한다(λ는 1에 가까운 모멘텀, 학습 중 점차 1로). 기울기 학습은 student에만 일어나고, teacher는 student의 시간 평균으로서 더 부드러운 표적을 제공한다. 훈련 내내 teacher가 student보다 성능이 앞서는 현상이 관찰되며, 논문은 이를 폴리악(Polyak) 평균식 모델 앙상블 효과로 해석한다.</li>
<li><b>붕괴 방지의 역학:</b> 센터 c는 teacher 출력의 배치 평균으로 EMA 갱신되며, 로짓에서 빼는 것으로 특정 차원이 항상 지배하는 붕괴를 억제한다. 그러나 센터링만 있으면 출력이 균등 분포로 퇴화할 수 있다. 이를 τ<sub>t</sub>를 작게 잡는 샤프닝이 상쇄한다. 절제 실험은 둘 중 하나만 있으면 붕괴함을 보였다. 즉 "균등화 압력(centering) + 첨예화 압력(sharpening)"의 길항이 비자명한 해를 유지시킨다.</li>
<li><b>창발적 성질:</b> 학습된 ViT의 마지막 층에서 CLS 토큰의 어텐션 맵을 헤드별로 시각화하면, 지도 학습 ViT나 CNN에서는 뚜렷하지 않던 객체 마스크 수준의 전경-배경 분리가 나타난다. 또 특징의 선형 평가와 k-NN 평가 모두에서 당시 자기지도 방법 중 최고 수준을 기록했고, 특히 k-NN 성능의 급등은 특징 공간 자체가 의미적으로 잘 조직됐음을 보여줬다.</li>
</ol>
<p>방법론적으로 DINO는 BYOL의 모멘텀 teacher, 증류의 분포 일치, ViT 백본을 하나로 묶고 음성 쌍·예측기 없이 붕괴를 제어했다는 점에서 자기지도 학습 설계 공간을 정리한 논문이다. 이 레시피는 <a href="#/item/dino-v2-2023">DINOv2</a>에서 데이터 큐레이션·규모 확장과 결합되어 범용 시각 백본으로 발전한다.</p>`
    },
    impact: `<p>DINO는 "라벨 없는 학습이 지도 학습과 경쟁한다"는 전환을 비전에서 확정지은 결과 중 하나다. 어텐션에 분할이 창발한다는 관찰은 비지도 객체 발견·분할 연구의 흐름을 만들었고, k-NN으로도 쓸 만한 특징은 이미지 검색·클러스터링 실무에 곧바로 흡수됐다. 후속작 <a href="#/item/dino-v2-2023">DINOv2</a>는 이 레시피를 대규모로 확장해 "비전의 범용 특징 추출기"로 자리 잡았고, 자기증류·EMA teacher 구도는 이후 자기지도 학습 전반의 표준 부품이 됐다.</p>`,
    uncertainty: []
  }
});

<p>사용법은 만능 가위를 든 조수에 비유할 수 있다. 사진 위의 한 점을 손가락으로 짚거나 대략적인 네모를 그려 주면, 조수가 그 지시가 가리키는 물체의 정확한 윤곽을 따라 오려 준다. 비유에서 손가락으로 짚기와 네모 그리기는 실제로 점·상자 프롬프트(prompt) 입력에 해당하고, 윤곽 따라 오리기는 실제로 픽셀 단위 마스크(mask) 출력에 해당한다. "무엇을 원하는지"를 학습이 아니라 입력으로 전달한다는 점에서, 언어 모델에 지시문을 넣는 프롬프트 방식을 분할에 이식한 셈이다.</p>

      mid: `<p>SAM의 설계는 세 부품으로 나뉜다. (1) 이미지 인코더: 무거운 <a href="#/item/vit-2020">ViT</a>(마스크 오토인코더 MAE로 사전학습)가 이미지를 한 번만 처리해 임베딩을 만든다. (2) 프롬프트 인코더: 점·상자·대략적 마스크·텍스트(실험적) 같은 프롬프트를 가벼운 임베딩으로 변환한다. (3) 마스크 디코더: 두 임베딩을 어텐션으로 결합해 마스크를 출력하는 경량 트랜스포머다. 무거운 계산(이미지 인코딩)을 한 번만 하고, 프롬프트마다 디코더만 다시 돌리므로 브라우저에서도 실시간 상호작용이 가능하다.</p>
<p>핵심 개념은 프롬프트 가능한 분할(promptable segmentation)이라는 과제 정의다. "유효한 프롬프트가 주어지면, 모호하더라도 그럴듯한 마스크를 하나 이상 내라"는 것이다. 점 하나는 본질적으로 모호하다 — 셔츠의 점은 셔츠를 뜻할 수도, 사람 전체를 뜻할 수도 있다. SAM은 한 프롬프트에 대해 마스크 3장(부분/전체 같은 위계)을 동시에 내고 각각의 품질 점수를 함께 예측해 모호성을 정면으로 다룬다.</p>

      deep: `<p>구성 요소와 학습을 상세히 보면 다음과 같다.</p>
<ol>
<li><b>이미지 인코더:</b> MAE 사전학습된 ViT-H를 1024×1024 입력에 맞게 조정(윈도우 어텐션 + 소수의 전역 어텐션 블록)해 64×64 크기의 이미지 임베딩을 만든다. 이미지당 한 번, 수백 ms급의 계산이며 결과는 캐시된다.</li>

<li><b>모호성 처리와 손실:</b> 프롬프트 하나당 마스크 3개를 예측하고, 학습 시에는 정답과의 손실이 가장 작은 마스크에만 역전파하는 최소 손실(minimum-loss) 배정을 쓴다. 손실은 focal loss와 dice loss의 결합이고, IoU 토큰은 각 마스크의 실제 IoU를 회귀하도록 별도 학습되어 추론 시 마스크 선택 기준이 된다. 학습은 프롬프트를 점점 추가하며 마스크를 다듬는 대화형 시나리오를 시뮬레이션한다.</li>

<p>평가에서는 단일 점 프롬프트 분할, 엣지 검출, 객체 제안, 인스턴스 분할 등으로의 zero-shot 전이를 시험해, 과제 특화 학습 없이도 경쟁력 있는 성능을 보였다. 설계 전체가 "한 번의 무거운 인코딩 + 가벼운 대화형 디코딩 + 모호성의 명시적 모델링"으로 요약되며, 이는 <a href="#/item/sam2-2024">SAM 2</a>의 비디오 확장에서도 유지되는 골격이다.</p>`

    impact: `<p>SAM은 분할을 파운데이션 모델의 어법 — 사전학습된 범용 모델 + 프롬프트 — 으로 옮긴 전환점이다. 공개 직후부터 의료 영상, 원격 탐사, 로보틱스, 영상 편집에서 "일단 SAM으로 마스크를 딴다"가 관행이 됐고, 추적·인페인팅·3D 등과 결합한 파생 연구가 폭발적으로 나왔다. SA-1B는 분할 데이터의 규모 기준을 새로 세웠고, 데이터 엔진 방식은 대규모 라벨 구축의 참조 모델이 됐다. 라벨링 도구로서 산업 현장의 어노테이션 비용도 실질적으로 낮췄으며, 비디오로 확장한 <a href="#/item/sam2-2024">SAM 2</a>로 계보가 이어진다.</p>`,

  link: { kind: "arxiv", label: "arXiv:1312.6114", url: "https://arxiv.org/abs/1312.6114" },
  detail: {
    tldr: "데이터를 잠재 변수의 확률 분포로 압축해 두고, 그 분포에서 표본을 뽑아 새 데이터를 만들어내는 생성 모델의 틀을 세웠다.",
    levels: {
      intro: `<p>사진을 통째로 외우는 대신, 몽타주 전문가처럼 "둥근 얼굴, 짧은 머리, 안경" 같은 <b>요약 카드</b>로 압축해 두었다가 그 카드만 보고 그림을 다시 그려내는 기계를 상상해 보자. VAE(Variational Autoencoder) 이전에도 이런 압축-복원 기계(오토인코더)는 있었다. 문제는 요약 카드가 기계마다 제멋대로여서, 아무 카드나 새로 써넣으면 복원 결과가 엉망이 된다는 점이었다.</p>
<p>VAE의 아이디어는 요약을 한 점이 아니라 <b>"이 근처 어디쯤"이라는 구름</b>으로 저장하게 하고, 모든 구름이 하나의 큰 지도 위에 빈틈없이 겹치도록 정리를 강제하는 것이다. 그러면 지도의 아무 지점을 찍어도 그럴듯한 그림이 복원된다. 즉 압축 기계가 자연스럽게 <b>생성 기계</b>가 된다.</p>
<p>비유를 실제와 대응시키면 이렇다. 요약 카드는 잠재 변수(latent variable), 카드를 쓰는 사람은 인코더(encoder), 카드를 보고 그림을 복원하는 사람은 디코더(decoder)에 해당한다. "구름으로 저장"은 인코더가 한 값이 아니라 확률 분포를 출력하는 것이고, "지도를 빈틈없이 정리"는 잠재 분포를 미리 정한 표준 분포에 가깝게 묶어두는 규제에 해당한다. 새 데이터를 만들 때는 지도(잠재 공간)에서 무작위로 한 점을 뽑아 디코더에 넣기만 하면 된다. 이 확률적 압축이라는 관점은 이후 생성 모델 전반의 공용 언어가 됐다.</p>`,
      mid: `<p>VAE는 오토인코더(autoencoder)의 구조에 확률 모델의 옷을 입힌 것이다. 보통의 오토인코더는 입력을 저차원 코드로 압축했다가 복원하도록 학습하는데, 코드가 잠재 공간에 불규칙하게 흩어져 있어 임의의 코드에서 샘플을 생성하는 용도로는 쓸 수 없다. VAE는 두 가지를 바꾼다. 첫째, 인코더가 코드 한 점이 아니라 <b>가우시안 분포의 평균과 분산</b>을 출력하고, 학습 때마다 그 분포에서 코드를 뽑아 디코더에 넘긴다. 둘째, 이렇게 만들어지는 코드의 분포가 미리 정한 사전 분포(prior) — 보통 표준 정규분포 — 에서 멀어지지 않도록 벌점을 준다.</p>
<p>따라서 손실 함수는 두 항의 줄다리기다. 하나는 재구성 손실(reconstruction loss)로, 뽑힌 코드에서 원본을 얼마나 잘 복원했는지를 잰다. 다른 하나는 정규화 항으로, 인코더가 만든 분포와 사전 분포 사이의 거리(KL 발산, KL divergence)를 잰다. 재구성 항만 있으면 보통 오토인코더처럼 잠재 공간이 찢어지고, 정규화 항만 있으면 입력을 무시한다. 두 항이 균형을 이루면 잠재 공간이 매끄럽고 촘촘해져, 사전 분포에서 아무 점이나 뽑아도 그럴듯한 샘플이 나오고, 두 점 사이를 보간(interpolation)하면 의미가 연속적으로 변하는 중간 샘플이 나온다.</p>
<p>남는 기술적 문제는 "분포에서 뽑는" 확률적 단계는 미분이 안 되어 역전파가 끊긴다는 점인데, 논문은 무작위성을 외부 표준 노이즈로 분리하고 평균·분산은 결정적 연산으로 두는 재매개변수화 트릭(reparameterization trick)으로 이를 해결했다. 이 트릭 덕분에 전체 모델을 경사하강법으로 통째로 학습할 수 있다. 생성 품질 자체는 흐릿하다는 약점이 있었지만, "생성 = 잠재 분포 학습 + 샘플링"이라는 프레임을 실용적인 학습 알고리즘과 함께 제시한 것이 핵심 기여다.</p>`,
      deep: `<p>목표는 잠재 변수 모델 p<sub>θ</sub>(x) = ∫ p<sub>θ</sub>(x|z)p(z)dz 의 최대우도 학습이다(x=데이터, z=잠재 변수, θ=디코더 파라미터). 이 적분은 일반적으로 계산 불가능하고, 사후 분포 p<sub>θ</sub>(z|x)도 마찬가지다. 논문의 해법을 단계별로 따라가면 다음과 같다.</p>
<ol>
<li><b>변분 근사:</b> 계산 불가능한 사후 분포를 인코더 신경망이 출력하는 근사 분포 q<sub>φ</sub>(z|x)로 대체한다(φ=인코더 파라미터). 보통 q<sub>φ</sub>(z|x) = N(z; μ<sub>φ</sub>(x), diag(σ<sub>φ</sub>²(x)))로 두어, 인코더가 입력별 평균과 분산을 내놓는다.</li>
<li><b>ELBO 분해:</b> 로그우도는 log p<sub>θ</sub>(x) = ELBO + D<sub>KL</sub>(q<sub>φ</sub>(z|x) ‖ p<sub>θ</sub>(z|x)) 로 분해되고, KL 항이 항상 0 이상이므로 ELBO(evidence lower bound)는 로그우도의 하한이다. ELBO = E<sub>q<sub>φ</sub>(z|x)</sub>[log p<sub>θ</sub>(x|z)] − D<sub>KL</sub>(q<sub>φ</sub>(z|x) ‖ p(z)). 첫 항이 재구성 항, 둘째 항이 사전 분포로의 정규화 항이다. 이 하한을 θ와 φ에 대해 동시에 올리는 것이 학습이다.</li>
<li><b>재매개변수화 트릭:</b> 기대값 항을 몬테카를로로 추정하려면 z ~ q<sub>φ</sub>(z|x)를 뽑아야 하는데, 샘플링 노드는 φ로 미분되지 않는다. 그래서 z = μ<sub>φ</sub>(x) + σ<sub>φ</sub>(x) ⊙ ε, ε ~ N(0, I) 로 다시 쓴다(⊙=성분별 곱). 무작위성이 파라미터와 무관한 ε로 분리되므로, 기울기가 μ와 σ를 통해 인코더까지 흐른다. 이것이 점수 함수 추정(REINFORCE)류보다 분산이 훨씬 낮은 저분산 기울기 추정기를 만든다.</li>
<li><b>닫힌 형태 KL:</b> q가 대각 가우시안이고 p(z) = N(0, I)이면 KL 항은 닫힌 형태로 계산된다: D<sub>KL</sub> = ½ Σ<sub>j</sub>(μ<sub>j</sub>² + σ<sub>j</sub>² − log σ<sub>j</sub>² − 1). 따라서 확률적 추정이 필요한 것은 재구성 항뿐이며, 실전에서는 미니배치당 샘플 1개로도 충분히 학습된다.</li>
<li><b>생성:</b> 학습 후에는 인코더를 떼고 z ~ N(0, I)를 뽑아 디코더 p<sub>θ</sub>(x|z)에 통과시키면 새 샘플이 나온다.</li>
</ol>
<p>한계도 명확했다. 재구성 항을 픽셀별 가우시안/베르누이 우도로 두면 디코더가 여러 가능한 출력의 평균을 내는 쪽으로 수렴해 샘플이 흐릿해진다. 또 강한 디코더를 쓰면 KL 항이 0으로 붕괴해 잠재 변수가 무시되는 사후 붕괴(posterior collapse)가 나타난다. 이 약점들이 이후 GAN과의 품질 격차, 그리고 이산 잠재 코드를 쓰는 VQ-VAE 계열의 등장 배경이 된다. 같은 시기 독립적으로 유사한 틀을 제시한 Rezende 등(2014)의 DLGM 연구가 형제 논문으로 언급된다.</p>`
    },
    impact: `<p>VAE는 "생성 모델 = 잠재 공간의 확률 분포 학습"이라는 관점과, 신경망 전체를 경사하강법으로 학습 가능하게 만드는 재매개변수화 트릭을 표준 도구로 남겼다. 재매개변수화는 생성 모델을 넘어 확률적 계층을 포함하는 거의 모든 신경망 학습의 기본기가 됐다. 계보 면에서는 이산 코드 버전인 VQ-VAE를 거쳐 DALL·E의 이미지 토큰화(dVAE)로 이어졌고, Stable Diffusion이 확산 과정을 돌리는 잠재 공간 자체가 VAE 계열 오토인코더로 만들어진다. 확산 모델의 학습 목적식 유도 역시 VAE와 같은 변분 하한(ELBO)의 언어로 쓰인다는 점에서, 이 논문의 수학적 틀은 현재 생성 모델 전반의 기반으로 살아 있다.</p>`,

      intro: `<p>GAN(Generative Adversarial Network)의 아이디어는 <b>위조지폐범과 감별사의 경쟁</b>으로 요약된다. 위조범은 진짜 같은 지폐를 만들려 하고, 감별사는 진짜와 위조를 가려내려 한다. 처음에는 위조가 엉성해 금방 들키지만, 들킨 이유가 위조범에게 피드백으로 돌아가면서 위조 솜씨가 늘고, 감별사도 덩달아 눈이 날카로워진다. 이 군비 경쟁이 계속되면 결국 감별사조차 구분 못 하는 위조가 나온다.</p>
<p>비유를 실제와 대응시키면 이렇다. 위조범은 무작위 신호를 받아 이미지를 만드는 생성자(generator) 신경망, 감별사는 이미지가 진짜 데이터인지 생성물인지 맞히는 판별자(discriminator) 신경망에 해당한다. "들킨 이유가 피드백으로 돌아간다"는 것은 판별자의 판정 결과가 기울기로 생성자에 전달되어 생성자가 갱신되는 것이고, "감별사도 구분 못 하는 상태"는 생성물의 분포가 실제 데이터 분포와 같아진 상태에 해당한다.</p>
<p>이 방식이 획기적이었던 이유는 <b>정답지가 필요 없다</b>는 점이다. "좋은 이미지"를 점수로 정의하기는 매우 어려운데, GAN은 그 기준 자체를 판별자라는 또 다른 신경망이 학습하게 했다. 손으로 채점 기준을 만들지 않고 경쟁 상대를 붙여준 것이다. 이 발상 덕분에 흐릿하지 않은 날카로운 이미지 생성이 처음으로 가능해졌고, 이후 5년 이상 이미지 생성 연구의 중심이 됐다.</p>`,
      mid: `<p>구조는 두 개의 신경망이다. 생성자 G는 표준 분포에서 뽑은 노이즈 벡터 z를 받아 데이터(예: 이미지)를 출력하고, 판별자 D는 입력이 실제 데이터일 확률을 출력하는 이진 분류기다. 학습은 교대로 진행된다. 판별자 차례에는 실제 데이터를 "진짜", 생성물을 "가짜"로 맞히도록 분류 손실을 줄이고, 생성자 차례에는 자기 출력이 판별자를 속이도록 — 즉 판별자가 "진짜"라고 답하게 — 갱신한다. 각자의 손실이 상대의 현재 상태에 의존하므로, 이것은 고정된 목적 함수의 최적화가 아니라 <b>2인 게임</b>이다.</p>
<p>이론적으로는, 판별자가 매 순간 최적이라면 생성자는 결국 생성 분포와 실제 데이터 분포 사이의 통계적 거리를 줄이는 셈이 되고, 균형점에서는 두 분포가 일치해 판별자의 정답률이 동전 던지기 수준이 된다. VAE처럼 픽셀 단위 복원 오차를 쓰지 않기 때문에 "여러 정답의 평균"으로 흐려지는 문제가 없고, 샘플이 날카롭다는 것이 실용적 장점이다.</p>
<p>대가는 학습의 불안정성이다. 두 네트워크의 힘 균형이 깨지면 학습이 발산하거나 멈춘다. 특히 생성자가 판별자를 속이기 쉬운 소수의 패턴만 반복 생성하는 모드 붕괴(mode collapse)가 고질병이다. 또 명시적인 우도(likelihood)를 계산할 수 없어 "얼마나 잘 배웠는지"를 재는 평가 자체가 어렵고, 이 때문에 IS·FID 같은 별도 평가 지표 연구가 뒤따랐다. 초기 GAN은 작은 해상도의 이미지에서만 동작했으며, 안정화 레시피는 이후 DCGAN 등 후속 연구의 몫이 됐다.</p>`,
      deep: `<p>형식화하면 다음의 minimax 게임이다. 데이터 분포를 p<sub>data</sub>, 노이즈 분포를 p<sub>z</sub>, 생성자가 유도하는 분포를 p<sub>g</sub>라 할 때,</p>
<p>min<sub>G</sub> max<sub>D</sub> V(D, G) = E<sub>x~p<sub>data</sub></sub>[log D(x)] + E<sub>z~p<sub>z</sub></sub>[log(1 − D(G(z)))]</p>
<p>여기서 D(x)는 x가 실제 데이터일 확률의 추정치다. 논문의 이론 분석을 단계별로 보면 다음과 같다.</p>
<ol>
<li><b>판별자 최적해:</b> G를 고정하고 V를 D에 대해 최대화하면, 각 점 x에서 최적 판별자는 D*(x) = p<sub>data</sub>(x) / (p<sub>data</sub>(x) + p<sub>g</sub>(x)) 이다. 즉 이상적 판별자는 두 분포의 밀도 비를 재는 장치다.</li>
<li><b>생성자 목적의 정체:</b> D = D*를 대입하면 생성자가 최소화하는 양은 C(G) = −log 4 + 2·JSD(p<sub>data</sub> ‖ p<sub>g</sub>) 가 된다(JSD = 옌센-섀넌 발산, Jensen–Shannon divergence). 따라서 이상적 조건에서 GAN 학습은 JSD 최소화이고, 전역 최적은 p<sub>g</sub> = p<sub>data</sub>, 그때 D*(x) = ½ 이다.</li>
<li><b>실전 목적식(non-saturating loss):</b> 학습 초기에는 생성물이 조악해 D(G(z)) ≒ 0 이고, 이때 log(1 − D(G(z)))의 기울기가 소실된다. 그래서 논문은 생성자를 log(1 − D(G(z))) 최소화 대신 log D(G(z)) 최대화로 학습하는 대안을 제안한다. 균형점은 같지만 초기 기울기가 살아 있다.</li>
<li><b>교대 학습 알고리즘:</b> 미니배치마다 (a) D를 k스텝 경사상승으로 갱신하고 (b) G를 1스텝 갱신한다. D를 완전히 최적화한 뒤 G를 갱신하는 것이 이론에 부합하지만 계산상 불가능하므로, 교대 갱신이 근사로 쓰인다. 이 근사가 이론과 실제의 간극을 만든다.</li>
<li><b>실패 양상:</b> 두 분포의 지지집합(support)이 거의 겹치지 않으면 JSD가 상수에 가까워져 기울기가 사라지고, 게임 동역학은 수렴 대신 진동할 수 있다. 생성자가 p<sub>data</sub>의 일부 모드만 덮는 모드 붕괴(mode collapse)도 균형 밖 동역학의 산물이다. 이 문제들은 이후 WGAN(Wasserstein 거리로 교체), 스펙트럴 정규화, 기울기 벌점 등 안정화 연구의 출발점이 됐다.</li>
</ol>
<p>한편 GAN은 명시적 밀도 p<sub>g</sub>(x)를 정의하지 않는 암시적 생성 모델(implicit generative model)이므로 우도 기반 평가가 불가능하며, 논문 시점에는 시각적 품질 평가에 의존했다. 이 공백이 이후 Inception Score와 FID 같은 표본 기반 지표를 낳았다.</p>`
    },
    impact: `<p>GAN은 발표 이후 약 5년간 이미지 생성 연구를 사실상 지배했다. DCGAN이 안정 학습 레시피를, Pix2Pix·CycleGAN이 이미지 변환 응용을, StyleGAN이 사진급 얼굴 생성을 차례로 열었고, 초해상도(super-resolution)·도메인 적응·데이터 증강 등 "판별자를 손실 함수로 쓰는" 발상이 분야 전반으로 퍼졌다. 딥페이크(deepfake)로 대표되는 합성 미디어의 사회적 논쟁도 GAN 계보에서 시작됐다. 2020년대 들어 학습이 안정적인 확산 모델에 주류 자리를 내주었지만, "학습된 신경망을 다른 신경망의 학습 신호로 쓴다"는 적대적 학습의 아이디어는 지금도 곳곳에 남아 있다.</p>`,
    uncertainty: []
  }
});

      mid: `<p>변경점은 구조 지침의 집합이다. (1) 풀링(pooling) 층을 없애고, 판별자는 보폭 있는 합성곱(strided convolution), 생성자는 전치 합성곱(transposed convolution)으로 크기 축소·확대 자체를 학습하게 했다. (2) 완전연결(fully-connected) 은닉층을 제거해 전 구간을 합성곱으로 구성했다. (3) 배치 정규화(batch normalization)를 생성자와 판별자 대부분의 층에 넣어 기울기 흐름을 안정화하되, 생성자 출력층과 판별자 입력층에는 빼는 예외를 뒀다. (4) 활성 함수는 생성자에 ReLU(출력은 tanh), 판별자에 LeakyReLU를 썼다. 이 조합이 <a href="#/item/gan-2014">원래 GAN</a>의 고질적 학습 붕괴를 크게 줄였고, 판별자의 중간 특징이 분류에 쓸 만한 표현이라는 것도 보여 "비지도 표현 학습기로서의 GAN"이라는 제목의 주장을 뒷받침했다.</p>`,

      intro: `<p><a href="#/item/gan-2014">GAN</a>에서 달라진 점은 무작위로 그리던 화가에게 <b>밑그림을 쥐여준 것</b>이다. 원래 GAN의 생성자는 백지에서 아무 그림이나 만들었지만, Pix2Pix의 생성자는 스케치·흑백 사진·지도 같은 입력을 받아 그것을 사진·컬러 사진·항공사진으로 옮겨 그린다. 감별사도 결과만 보지 않고 밑그림과 결과를 나란히 놓고 "이 밑그림에 어울리는 진짜 그림인가"를 판정한다. 비유에서 밑그림은 실제로 조건 입력 이미지, 옮겨 그리기는 픽셀 대응이 있는 이미지 변환(image-to-image translation), 나란히 놓고 판정하기는 조건부 판별자에 해당한다. 과제마다 따로 설계하던 변환 문제들을 하나의 공통 틀로 묶은 것이 핵심 기여이며, 공개 데모가 크게 유행하며 GAN 응용의 대중화를 이끌었다.</p>`,
      mid: `<p>변경점은 세 가지다. (1) <b>조건부 GAN(conditional GAN) 구조:</b> 생성자와 판별자 모두 입력 이미지 x를 조건으로 받는다. 판별자는 (입력, 출력) 쌍을 보고 진위를 판정하므로, 생성자는 그럴듯할 뿐 아니라 입력과 정합적인 출력을 내야 한다. (2) <b>손실 결합:</b> 적대적 손실만 쓰면 입력과의 대응이 흐트러지고, 픽셀 거리(L1)만 쓰면 결과가 흐려진다. 둘을 더해 "큰 구조는 L1이 잡고 질감의 사실감은 판별자가 잡는" 분업을 만들었다. (3) <b>구조 선택:</b> 생성자는 인코더-디코더에 스킵 연결을 더한 U-Net형 구조로 입력의 저수준 정보(윤곽 등)를 출력까지 직결시키고, 판별자는 이미지 전체가 아니라 국소 패치 단위로 진위를 판정하는 PatchGAN을 써서 고주파 질감에 집중시켰다. 짝지어진 학습 데이터(같은 장면의 입력·정답 쌍)가 필요하다는 것이 전제 조건이다.</p>`,
      deep: `<p>목적식은 G* = arg min<sub>G</sub> max<sub>D</sub> L<sub>cGAN</sub>(G, D) + λ·L<sub>L1</sub>(G) 이다. 여기서 L<sub>cGAN</sub> = E<sub>x,y</sub>[log D(x, y)] + E<sub>x</sub>[log(1 − D(x, G(x)))] 는 조건부 적대 손실(x=입력, y=정답 출력), L<sub>L1</sub> = E<sub>x,y</sub>[‖y − G(x)‖<sub>1</sub>] 는 재구성 항이며, 논문은 λ=100을 사용했다. L2가 아닌 L1을 쓴 것은 흐림(blurring)이 덜하기 때문이다. 기술 상세로는 (1) 생성자의 U-Net 스킵 연결이 인코더 i층과 디코더의 대응 층을 이어 병목에서 소실되는 공간 정보를 보존하고, (2) 판별자는 70×70 수용 영역의 PatchGAN으로, 출력 맵의 각 원소가 해당 패치의 진위를 판정한 뒤 평균한다 — 이는 질감·스타일 같은 고주파 성분만 적대 손실로 다루고 저주파 구조는 L1에 맡기는 역할 분담이자, 임의 크기 이미지에 적용 가능한 완전 합성곱 설계다. (3) 노이즈 z는 사실상 무시되는 경향이 있어 드롭아웃으로만 확률성을 남겼는데, 이는 출력 다양성의 한계로 지적됐다. 짝 데이터가 없는 경우로의 확장은 이듬해 CycleGAN이 순환 일관성 손실로 해결한다.</p>`

      intro: `<p>DDPM(Denoising Diffusion Probabilistic Model)의 발상은 <b>안개 걷기</b>다. 선명한 사진에 옅은 안개를 한 겹 덧입히고, 또 한 겹, 또 한 겹 — 수백 번 반복하면 사진은 완전한 잿빛 노이즈가 된다. 이 "망가뜨리는 방향"은 규칙이 정해져 있어 아주 쉽다. 어려운 것은 반대 방향이다. DDPM은 신경망에게 "안개 한 겹만 걷어내는 법"을 가르친다. 완전한 노이즈에서 출발해 이 걷어내기를 수백 번 반복하면, 안개 속에서 형체가 서서히 떠오르듯 새로운 사진이 나타난다.</p>
<p>비유를 실제와 대응시키면 이렇다. 안개 덧입히기는 데이터에 가우시안 노이즈를 단계적으로 섞는 정방향 확산 과정(forward process), 안개 한 겹 걷어내기는 신경망이 학습하는 역방향 과정(reverse process)의 한 단계, 완전한 잿빛 노이즈는 아무 정보 없는 무작위 신호에 해당한다. "형체가 서서히 떠오른다"는 것은 큰 윤곽부터 미세한 질감까지 단계적으로 결정되는 생성 과정에 해당한다.</p>
<p>왜 이 우회가 강력한가. 한 번에 백지에서 걸작을 그리는 일(기존 GAN 방식)은 배우기 어렵고 실패하기 쉽지만, "아주 조금 덜 흐린 그림 만들기"라는 작은 과제는 배우기 쉽고 채점도 명확하다. 어려운 문제를 쉬운 문제 수백 개로 쪼갠 것이다. 그 대가로 생성이 느리지만(수백 번 반복), 학습이 안정적이고 결과물의 다양성과 품질이 뛰어나, 이 논문 이후 이미지 생성의 주류가 GAN에서 확산 모델로 넘어가는 전환점이 됐다.</p>`,
      mid: `<p>모델은 두 방향의 과정으로 정의된다. <b>정방향 과정</b>은 학습이 필요 없는 고정된 절차로, 데이터에 매 단계 소량의 가우시안 노이즈를 섞는 마르코프 연쇄(Markov chain)다. 단계 수는 수백~수천이며, 노이즈 비율 스케줄이 미리 정해져 있다. 중요한 성질은 임의의 중간 단계 결과를 한 번의 계산으로 바로 뽑을 수 있다는 것이다. 원본과 표준 노이즈를 정해진 비율로 섞으면 그 단계의 "적당히 망가진" 데이터가 된다.</p>
<p><b>역방향 과정</b>이 학습 대상이다. 신경망은 노이즈 낀 데이터와 단계 번호를 입력받아 한 단계 덜 노이즈 낀 상태의 분포를 예측한다. DDPM의 실용적 핵심은 이 문제를 "지금 섞여 있는 노이즈 자체를 알아맞혀라"라는 <b>노이즈 예측 회귀</b>로 바꾼 것이다. 학습 루프는 놀랍도록 단순하다. 데이터 하나, 무작위 단계 하나, 무작위 노이즈 하나를 뽑아 섞은 뒤, 신경망이 예측한 노이즈와 실제 섞은 노이즈의 차이(제곱 오차)를 줄인다. GAN처럼 두 네트워크의 균형을 맞출 필요가 없어 학습이 안정적이고, 데이터 분포의 여러 모드를 고르게 덮는다.</p>
<p>생성은 순수 노이즈에서 시작해 신경망으로 노이즈를 추정·제거하는 단계를 끝까지 반복하는 것이다. 신경망 구조로는 이미지 분할에서 온 U-Net을 쓰고, 단계 번호는 임베딩으로 주입한다. 약점은 속도다. 한 장을 만드는 데 신경망을 수백~수천 번 통과해야 해서 GAN보다 수백 배 느리며, 이 병목이 이후 샘플링 가속(DDIM 등)과 잠재 공간 확산(Stable Diffusion) 연구를 낳는다. 같은 시기의 점수 기반 생성 모델(score-based model, Song & Ermon) 연구와 수학적으로 동전의 양면이라는 점도 곧 밝혀졌다.</p>`,
      deep: `<p>표기: x<sub>0</sub> ~ q(x<sub>0</sub>)는 데이터, t = 1…T는 확산 단계, β<sub>t</sub>는 단계별 노이즈 분산 스케줄, α<sub>t</sub> = 1 − β<sub>t</sub>, ᾱ<sub>t</sub> = ∏<sub>s≤t</sub> α<sub>s</sub> 이다.</p>
<ol>
<li><b>정방향 과정:</b> q(x<sub>t</sub> | x<sub>t−1</sub>) = N(x<sub>t</sub>; √(1−β<sub>t</sub>)·x<sub>t−1</sub>, β<sub>t</sub>I) 로 정의되는 고정 마르코프 연쇄다. 가우시안의 합성 성질로 임의 단계로의 점프가 닫힌 형태로 나온다: x<sub>t</sub> = √ᾱ<sub>t</sub>·x<sub>0</sub> + √(1−ᾱ<sub>t</sub>)·ε, ε ~ N(0, I). T가 충분히 크면 x<sub>T</sub>는 표준 가우시안에 수렴한다. 논문은 T=1000, β<sub>t</sub>를 선형 증가 스케줄로 뒀다.</li>
<li><b>역방향 과정:</b> p<sub>θ</sub>(x<sub>t−1</sub> | x<sub>t</sub>) = N(x<sub>t−1</sub>; μ<sub>θ</sub>(x<sub>t</sub>, t), σ<sub>t</sub>²I) 를 신경망으로 근사한다. β<sub>t</sub>가 작으면 실제 역방향 조건부도 가우시안에 가깝다는 것이 이 근사의 근거다. 학습은 VAE와 같은 변분 하한(ELBO)의 최대화로 유도되며, 하한은 단계별 KL 항들의 합으로 분해된다. 각 KL 항은 x<sub>0</sub>로 조건화한 실제 사후 분포 q(x<sub>t−1</sub> | x<sub>t</sub>, x<sub>0</sub>) — 이것도 닫힌 형태의 가우시안 — 과 p<sub>θ</sub> 사이에서 계산된다.</li>
<li><b>ε-매개변수화:</b> 핵심 기여는 μ<sub>θ</sub>를 직접 예측하는 대신, x<sub>t</sub>에 섞인 노이즈 ε를 예측하는 네트워크 ε<sub>θ</sub>(x<sub>t</sub>, t)로 재매개변수화한 것이다. 위 점프 식을 뒤집으면 μ<sub>θ</sub>(x<sub>t</sub>, t) = (1/√α<sub>t</sub>)·(x<sub>t</sub> − (β<sub>t</sub>/√(1−ᾱ<sub>t</sub>))·ε<sub>θ</sub>(x<sub>t</sub>, t)) 로 평균이 복원된다. 이때 ELBO의 KL 항들은 노이즈 예측 오차의 가중 합이 된다.</li>
<li><b>단순화 목적식:</b> 논문은 가중치를 버린 L<sub>simple</sub> = E<sub>t, x<sub>0</sub>, ε</sub>[ ‖ε − ε<sub>θ</sub>(√ᾱ<sub>t</sub>·x<sub>0</sub> + √(1−ᾱ<sub>t</sub>)·ε, t)‖² ] 가 오히려 샘플 품질을 높인다는 것을 실험으로 보였다. 이 가중치 제거는 노이즈가 많은 단계(어려운 복원)의 비중을 키우는 효과가 있으며, 잡음 제거 점수 매칭(denoising score matching)과의 등가성 — ε<sub>θ</sub>가 사실상 점수 함수 ∇<sub>x</sub> log q(x<sub>t</sub>)의 스케일된 추정치라는 것 — 을 드러낸다.</li>
<li><b>샘플링:</b> x<sub>T</sub> ~ N(0, I)에서 시작해 t = T…1 동안 x<sub>t−1</sub> = μ<sub>θ</sub>(x<sub>t</sub>, t) + σ<sub>t</sub>z (z ~ N(0, I), 마지막 단계는 노이즈 없이)를 반복한다. 구조적으로는 랑주뱅 동역학(Langevin dynamics)과 닮은 반복 정제다. 네트워크는 시간 임베딩과 셀프 어텐션을 넣은 U-Net을 썼다.</li>
</ol>
<p>결과적으로 DDPM은 우도 기반 모델의 안정성과 GAN급 샘플 품질을 처음으로 겸비했고, CIFAR-10 무조건부 생성에서 당시 최고 수준의 FID를 보고했다. 남은 비용은 T회의 순차 신경망 평가라는 샘플링 속도이며, 이는 DDIM의 비마르코프 가속, 증류, 그리고 잠재 공간 확산으로 이어지는 후속 연구의 출발점이 된다.</p>`
    },
    impact: `<p>DDPM은 생성 모델의 주류를 GAN에서 확산 모델로 교체한 전환점이다. "노이즈 예측이라는 단순한 회귀 + 반복 정제"라는 레시피는 학습 안정성과 스케일링 친화성 덕분에 대규모화에 유리했고, 2년 안에 GLIDE·DALL·E 2·Imagen·Stable Diffusion 등 텍스트-이미지 생성의 폭발로 이어졌다. 점수 기반 모델과의 통합(SDE 관점), DDIM류 샘플링 가속, 분류기 없는 유도(classifier-free guidance) 등 후속 이론이 이 틀 위에 쌓였다. 영향은 이미지를 넘어 오디오 합성, 비디오 생성, 분자·단백질 설계, 로보틱스의 행동 생성(Diffusion Policy)까지 확장되어, 2020년대 생성 AI의 공용 엔진이 됐다.</p>`,

    levels: {
      intro: `<p>어떤 장소를 3D로 기억하는 두 가지 방식을 비교해 보자. 하나는 미니어처 모형을 만드는 것이고(폴리곤·점군 같은 명시적 3D 데이터), 다른 하나는 그 장소를 완벽히 아는 <b>안내원</b>을 두는 것이다. 안내원에게 "이 지점, 이 방향에서 보면 뭐가 보여?"라고 물으면 "반투명한 붉은 유리가 있어" 하고 답해준다. NeRF(Neural Radiance Field)는 후자다. 장면을 데이터 덩어리가 아니라, 질문에 답하는 <b>함수</b>로 저장한다.</p>
<p>비유를 실제와 대응시키면 이렇다. 안내원은 작은 신경망이고, 질문(위치와 바라보는 방향)은 신경망의 입력 좌표, 대답(무엇이 얼마나 불투명하게 보이는가)은 신경망이 출력하는 색과 밀도에 해당한다. 새로운 시점의 사진을 만들려면, 카메라에서 각 픽셀 방향으로 시선을 쏘고 그 선을 따라가며 안내원에게 여러 번 물은 뒤 대답들을 누적해 픽셀 색을 정한다. 이 "시선을 따라 답을 쌓는 것"이 볼륨 렌더링(volume rendering)에 해당한다.</p>
<p>안내원은 어떻게 훈련되는가. 같은 장면을 여러 각도에서 찍은 사진 수십 장을 놓고, "이 카메라 위치에서 렌더링한 결과가 실제 사진과 같아지도록" 신경망을 조금씩 고친다. 훈련이 끝나면 사진을 찍은 적 없는 새로운 각도에서도 놀랍도록 사실적인 장면 — 유리의 반사나 얇은 구조물까지 — 을 만들어낸다. "3D 장면을 신경망 하나에 압축한다"는 이 발상은 그래픽스와 AI를 잇는 새 분야(뉴럴 필드)를 열었다.</p>`,
      mid: `<p>NeRF의 표현은 좌표 기반 신경망(coordinate-based MLP) 하나다. 입력은 공간 위치 3차원과 시선 방향 2차원, 출력은 그 지점의 밀도(density)와 방향 의존적인 색이다. 밀도는 "그 지점에 빛을 막는 물질이 얼마나 있는가"를, 방향 의존 색은 반사·광택처럼 보는 각도에 따라 달라지는 외관을 담당한다. 장면 하나가 신경망 가중치 하나에 통째로 인코딩되며, 해상도 격자가 없어 메모리가 장면 복잡도와 함께 늘지 않는다.</p>
<p>이미지 합성은 고전 그래픽스의 볼륨 렌더링을 그대로 쓴다. 픽셀마다 카메라에서 광선(ray)을 쏘고, 광선 위의 여러 지점을 샘플링해 신경망에 묻고, 얻은 색을 "앞쪽 물질에 얼마나 가려졌는가"를 반영한 가중치로 누적한다. 이 누적 연산 전체가 미분 가능하므로, 렌더링된 픽셀과 실제 사진 픽셀의 오차를 신경망까지 역전파할 수 있다. 즉 학습 신호는 3D 정답이 아니라 <b>2D 사진</b>뿐이고, 3D 구조는 여러 시점의 일관성에서 간접적으로 유도된다.</p>
<p>이를 실제로 작동시키는 두 가지 장치가 논문의 기술적 핵심이다. 첫째, 신경망은 저주파 함수를 선호하는 편향이 있어 좌표를 그대로 넣으면 디테일이 뭉개진다. 좌표를 여러 주파수의 사인·코사인 값으로 펼쳐 넣는 위치 인코딩(positional encoding)이 고주파 디테일 학습을 가능하게 한다. 둘째, 광선 위 대부분의 공간은 비어 있으므로, 거친 네트워크로 물질이 있는 구간을 먼저 찾고 그 근처에 샘플을 집중시키는 계층적 샘플링(hierarchical sampling)으로 계산을 아낀다. 한계는 속도와 범용성이다. 장면 하나마다 별도 학습이 필요하고 렌더링도 느려, 이후 가속 연구와 3D Gaussian Splatting의 등장 배경이 된다.</p>`,
      deep: `<p>장면은 함수 F<sub>Θ</sub>: (x, d) → (c, σ) 로 표현된다(x = 3D 위치, d = 시선 방향 단위 벡터, c = RGB 색, σ = 부피 밀도, Θ = MLP 가중치). 파이프라인을 단계별로 따라가면 다음과 같다.</p>
<ol>

      intro: `<p>NeRF는 장면을 "물으면 답해주는 안내원"(신경망 함수)으로 기억했다. 정확하지만, 픽셀 하나를 칠할 때마다 안내원에게 수십 번씩 물어야 해서 느렸다. 3D Gaussian Splatting(3DGS)은 반대 전략을 쓴다. 장면을 <b>공중에 떠 있는 수백만 개의 반투명 물감 방울</b>로 직접 만들어 두는 것이다. 방울 하나하나는 위치·크기·기울기·색·투명도를 가진 말랑한 타원형이고, 새로운 시점의 그림이 필요하면 그 시점에서 보이는 방울들을 화면에 도장 찍듯 투영해 겹쳐 그리면 끝이다. 물어볼 안내원이 없으니 그리기가 압도적으로 빠르다.</p>
<p>비유를 실제와 대응시키면 이렇다. 물감 방울은 3D 가우시안(gaussian) — 중심 위치와 퍼짐 정도로 정의되는 부드러운 타원체 — 이고, "도장 찍듯 투영"은 스플래팅(splatting)이라 불리는 래스터화 방식, "겹쳐 그리기"는 앞의 방울이 뒤의 방울을 가리는 정도를 계산해 색을 쌓는 알파 합성에 해당한다.</p>
<p>방울들은 어떻게 만들어지는가. 여러 각도에서 찍은 사진들을 놓고, "이 방울 배치로 그린 그림이 실제 사진과 같아질 때까지" 방울들의 위치·모양·색을 조금씩 고치고, 부족한 곳에는 방울을 늘리고 쓸모없는 방울은 지운다. 훈련을 마치면 NeRF급 화질의 장면을 게임처럼 실시간으로 돌려볼 수 있다. "신경망 함수 대신 최적화된 입자들"이라는 이 회귀가 3D 캡처를 시연용 기술에서 쓸 수 있는 기술로 바꿨다.</p>`,
      mid: `<p>3DGS의 표현은 명시적(explicit)이다. 장면은 수십만~수백만 개의 3D 가우시안 집합이고, 각 가우시안은 (1) 중심 위치, (2) 3차원 크기와 회전으로 정의되는 이방성(anisotropic) 공분산 — 방향마다 다르게 늘어난 타원체를 허용해 얇은 구조를 적은 개수로 덮는다 —, (3) 불투명도, (4) 보는 방향에 따라 달라지는 색(구면 조화 함수 계수로 표현)을 파라미터로 가진다. NeRF의 MLP처럼 좌표를 신경망에 넣는 단계가 아예 없다.</p>
<p>렌더링은 광선 행진(ray marching)이 아니라 <b>래스터화</b>다. 각 가우시안을 카메라 시점으로 투영하면 화면 위의 2D 가우시안(타원)이 되고, 화면을 타일로 나눠 타일별로 가우시안들을 깊이 순 정렬한 뒤, 픽셀마다 앞에서 뒤로 알파 합성한다. 이 전 과정이 GPU 병렬화에 최적화된 미분 가능 래스터라이저로 구현되어, 고해상도에서 실시간 프레임률로 렌더링하면서도 기울기를 역전파할 수 있다.</p>
<p>학습은 NeRF와 같은 문제 설정 — 자세를 아는 다시점 사진과의 재구성 오차 최소화 — 이지만, 최적화 대상이 신경망 가중치가 아니라 가우시안 파라미터들이다. SfM(structure-from-motion)이 만들어 준 희소 점군에서 가우시안들을 초기화하고, 경사하강으로 파라미터를 다듬으며, 재구성 오차 기울기가 큰 영역의 가우시안은 복제·분할하고 투명해진 것은 제거하는 적응적 밀도 제어(adaptive density control)로 표현 용량을 장면에 맞춘다. 그 결과 품질은 당시 최고 NeRF 계열과 대등하면서 학습은 수십 분, 렌더링은 실시간이라는 조합을 처음 달성했다. 대가는 메모리다. 수백만 가우시안의 명시적 저장은 MLP 하나보다 수십 배 무겁다.</p>`,
      deep: `<p>각 가우시안은 중심 μ ∈ R³와 공분산 Σ로 정의되는 밀도 G(x) = exp(−½·(x−μ)<sup>T</sup>Σ<sup>−1</sup>(x−μ)) 에 불투명도 o와 구면 조화(SH) 색 계수를 더한 것이다. 파이프라인을 단계별로 보면 다음과 같다.</p>
<ol>
<li><b>공분산 매개변수화:</b> Σ를 직접 최적화하면 양의 정부호(positive semi-definite) 제약이 깨진다. 그래서 Σ = R·S·S<sup>T</sup>·R<sup>T</sup> 로 분해해(S = 축별 스케일 대각 행렬, R = 쿼터니언으로 표현한 회전) 스케일과 회전을 최적화 변수로 둔다. 어떤 값에서도 Σ가 유효한 공분산이 되는 매개변수화다.</li>
<li><b>화면 투영:</b> 시점 변환 W와 투영의 야코비안 근사 J에 대해 화면 공간 공분산은 Σ' = J·W·Σ·W<sup>T</sup>·J<sup>T</sup> 로 계산된다(EWA 스플래팅 이론). 3D 타원체가 2D 타원으로 떨어지는 이 닫힌 형태 투영이 광선 샘플링을 대체한다.</li>
<li><b>타일 기반 래스터화:</b> 화면을 16×16 픽셀 타일로 나누고, 각 가우시안을 겹치는 타일들에 배정한 뒤 (타일, 깊이) 키로 GPU 기수 정렬한다. 픽셀 색은 깊이 순으로 C = Σ<sub>i</sub> c<sub>i</sub>·α<sub>i</sub>·∏<sub>j&lt;i</sub>(1 − α<sub>j</sub>) 로 누적한다(c<sub>i</sub> = SH에서 평가한 방향 의존 색, α<sub>i</sub> = o<sub>i</sub>에 2D 가우시안 값을 곱한 유효 불투명도). 이 식은 NeRF의 볼륨 렌더링 구적식과 같은 알파 합성 구조로, 표현만 연속 필드에서 입자로 바뀐 것이다. 누적 투과율이 임계 이하로 떨어지면 조기 종료한다.</li>
<li><b>미분 가능성:</b> 정렬은 이산 연산이지만 고정된 순서 아래에서 색·불투명도·위치·공분산에 대한 기울기가 닫힌 형태로 계산되며, 저자들은 블렌딩 기울기를 뒤에서 앞으로 재계산하는 커스텀 CUDA 커널로 임의 개수 가우시안의 역전파를 구현했다.</li>
<li><b>적응적 밀도 제어:</b> 3천~수만 회 반복 동안 주기적으로, 위치 기울기의 크기가 큰 가우시안 중 작은 것은 복제(clone)해 미달 재구성 영역을 채우고, 큰 것은 분할(split)해 과대 재구성을 세분화한다. 불투명도가 임계 이하인 가우시안은 제거하고, 주기적으로 전체 불투명도를 리셋해 카메라 근처에 눌어붙는 플로터(floater)를 걸러낸다.</li>
<li><b>손실:</b> 렌더링 이미지와 실측 사진 간 L1 + D-SSIM 조합을 쓴다. 초기화는 SfM 희소 점군이며, 무작위 초기화도 가능하나 품질이 떨어진다고 보고됐다.</li>
</ol>
<p>논문은 Mip-NeRF 360급 품질을 유지하면서 1080p 실시간 렌더링과 수십 분 수준의 학습을 보고했다. 한계로는 명시적 표현의 큰 메모리 사용량, 관측이 부족한 영역의 아티팩트, 정렬 근사에서 오는 시점 급변 시의 팝핑(popping) 등이 지적되어, 압축·정규화·동적 장면 확장이 곧바로 후속 연구 주제가 됐다.</p>`
    },
    impact: `<p>3DGS는 radiance field를 "느리지만 신기한 것"에서 실시간 그래픽스 파이프라인의 구성 요소로 바꿨다. 발표 직후 NeRF 후속 연구의 상당수가 가우시안 기반으로 재편됐고, 동적 장면(4D), 인체 아바타, SLAM·로보틱스 매핑, 자율주행 시뮬레이션, VR 캡처 등으로 응용이 빠르게 번졌다. 명시적 입자 + 미분 가능 래스터화라는 조합은 편집·합성·물리 시뮬레이션과의 결합이 쉬워 제작 도구 생태계와도 맞물렸다. "신경망 함수가 항상 답은 아니며, 잘 설계된 명시적 표현 + GPU 친화적 미분 가능 렌더러가 이길 수 있다"는 교훈을 남긴 사례로, 학습 기반 3D 표현의 두 노선(암시적/명시적) 경쟁을 다시 열었다.</p>`,

      mid: `<p>Sora의 내부 구조는 비공개이며, 이하는 OpenAI가 공개한 기술 리포트("Video generation models as world simulators") 기준의 설명이다. 리포트가 밝힌 구성은 세 요소다. (1) <b>비디오 압축:</b> 비디오를 픽셀 그대로 다루지 않고, 압축 네트워크로 시간·공간이 모두 줄어든 잠재 표현으로 변환한다 — <a href="#/item/stable-diffusion-2022">Stable Diffusion</a>이 이미지에서 쓴 잠재 공간 전략의 비디오 확장이다. (2) <b>시공간 패치화:</b> 잠재 표현을 시공간 패치들의 시퀀스로 자른다. 패치는 언어 모델의 토큰에 해당하는 통일 단위로, 길이·해상도·화면비가 제각각인 비디오와 이미지를 하나의 형식으로 학습하게 해준다. (3) <b>확산 트랜스포머(diffusion transformer):</b> 노이즈 낀 패치들을 받아 원래 패치를 복원하도록 학습되는 트랜스포머다. 확산 모델의 U-Net을 트랜스포머로 교체한 DiT 계열 연구의 연장선으로, 리포트는 계산량을 늘릴수록 샘플 품질이 뚜렷이 오르는 스케일링 결과를 강조했다.</p>

      deep: `<p>Sora의 내부 구조는 비공개다. 이하는 공개 기술 리포트와, 리포트가 인용하는 공개 연구 계보로부터의 설명이며 세부 구현은 다를 수 있다.</p>

<p>DQN 이전의 강화학습은 사람이 게임마다 "지금 공이 어디 있고 막대가 어디 있다" 같은 특징을 손으로 정리해 입력해 줘야 했다. DQN(Deep Q-Network)의 돌파구는 그 정리 작업을 딥러닝에 맡긴 것이다. 화면 픽셀을 그대로 입력받는 합성곱 신경망(CNN)이 "지금 이 화면에서 각 버튼을 누르면 앞으로 점수를 얼마나 벌 수 있을까"를 추정하고, 추정치가 가장 높은 버튼을 고른다. 이 추정치가 Q값(Q-value)이라 불리는 양이다.</p>

      mid: `<p>배경이 되는 Q학습(Q-learning)은 "상태 s에서 행동 a를 했을 때 앞으로 받을 보상의 총합"인 행동가치 Q(s,a)를 표 형태로 학습하는 고전 알고리즘이다. 그러나 화면 픽셀처럼 상태 공간이 천문학적으로 크면 표를 만들 수 없으므로, DQN은 Q함수를 합성곱 신경망(CNN)으로 근사한다. 입력은 최근 4프레임을 쌓은 저해상도 화면이고, 출력은 각 행동의 Q값이다. 행동 선택은 대부분 Q값이 최대인 행동을 고르되 일정 확률로 무작위 탐험을 섞는 엡실론-그리디(epsilon-greedy) 방식이다.</p>

      deep: `<p>DQN의 학습은 벨만 최적 방정식(Bellman optimality equation)을 회귀 문제로 바꾼 것이다. 기호를 정의하면 s는 상태, a는 행동, r은 보상, s'는 다음 상태, γ(감마)는 미래 보상의 할인율, θ(세타)는 온라인 네트워크의 파라미터, θ⁻는 타깃 네트워크의 파라미터다.</p>

</ol>
<p>한계도 명확했다. max 연산이 만드는 Q값 과대추정 편향은 이후 Double DQN이, 버퍼 균일 샘플링의 비효율은 우선순위 경험 재현(prioritized experience replay)이, 상태가치와 행동 이득의 분리는 Dueling DQN이 각각 개선했고, 이런 개선을 묶은 Rainbow로 이어졌다. 또한 DQN은 이산 행동 공간에만 적용되어 연속 제어에는 쓸 수 없으며, 이 영역은 정책 경사 계열 알고리즘이 맡게 된다.</p>`

      deep: `<p>기호 정의: π<sub>θ</sub>는 파라미터 θ의 정책, π<sub>θold</sub>는 표본을 모은 시점의 옛 정책, Â<sub>t</sub>는 시점 t의 이득 추정치, ε(엡실론)은 클리핑 폭으로 논문 기본값은 0.2다.</p>
<ol>
<li><b>중요도 비율:</b> r<sub>t</sub>(θ) = π<sub>θ</sub>(a<sub>t</sub>|s<sub>t</sub>) / π<sub>θold</sub>(a<sub>t</sub>|s<sub>t</sub>). 옛 정책으로 모은 표본으로 새 정책의 성능 변화를 추정하기 위한 중요도 샘플링 보정항이다. 갱신 직후에는 1에서 출발한다.</li>
<li><b>클리핑된 대리 목적식:</b> L<sup>CLIP</sup>(θ) = Ê<sub>t</sub>[ min( r<sub>t</sub>(θ)·Â<sub>t</sub>, clip(r<sub>t</sub>(θ), 1−ε, 1+ε)·Â<sub>t</sub> ) ]. min이 핵심이다. Â<sub>t</sub>가 양수면 r<sub>t</sub>가 1+ε을 넘는 순간 목적식이 평평해져 확률을 더 키울 유인이 사라지고, Â<sub>t</sub>가 음수면 r<sub>t</sub>가 1−ε 아래로 내려가는 방향이 같은 방식으로 막힌다. 클리핑 전 값과의 min을 취하므로 항상 비관적(하한) 추정이 되어, 개선을 과대평가하는 방향의 갱신이 차단된다.</li>
<li><b>이득 추정:</b> Â<sub>t</sub>는 GAE로 계산한다. TD 오차 δ<sub>t</sub> = r<sub>t</sub> + γV(s<sub>t+1</sub>) − V(s<sub>t</sub>)를 지수 가중 합산한 Â<sub>t</sub> = Σ<sub>l</sub> (γλ)<sup>l</sup>·δ<sub>t+l</sub>이다. 여기서 γ는 할인율, λ는 편향-분산 절충 계수, V는 크리틱의 상태가치다.</li>
<li><b>전체 손실:</b> 실제로는 L<sup>CLIP</sup>에서 가치 손실 c<sub>1</sub>·(V<sub>θ</sub>(s<sub>t</sub>) − V<sub>t</sub><sup>target</sup>)²을 빼고 엔트로피 보너스 c<sub>2</sub>·H(π<sub>θ</sub>(·|s<sub>t</sub>))를 더한 단일 목적식을 최적화한다(c<sub>1</sub>, c<sub>2</sub>는 가중 계수, H는 엔트로피).</li>
<li><b>학습 루프:</b> 병렬 액터들이 T스텝씩 궤적을 모으고, 그 배치에 대해 여러 에폭의 미니배치 SGD를 돌린 뒤 π<sub>θold</sub>를 현재 정책으로 교체한다. 논문은 클리핑 대신 KL 발산 페널티 계수를 적응적으로 조절하는 변형도 제시했지만, 클리핑 버전이 더 단순하면서 성능도 좋았다.</li>

<p>주의할 점으로, 클리핑은 신뢰 영역(trust region)의 근사일 뿐 정책 간 KL 발산 자체를 수학적으로 제한하지는 않는다. 실제 성능이 이득 정규화, 가치 함수 클리핑, 학습률 스케줄 같은 구현 세부에 크게 좌우된다는 후속 재현 연구가 많으며, 이는 "PPO의 성능은 목적식만큼이나 코드 레벨 최적화의 산물"이라는 논쟁으로 이어졌다.</p>`

window.AITL.register({

  link: { kind: "arxiv", label: "arXiv:1911.08265", url: "https://arxiv.org/abs/1911.08265" },
  detail: {
    tldr: "환경 규칙을 모른 채 보상·가치·정책만 맞히는 내부 모델을 학습하고, 그 상상 공간 안에서 트리 탐색으로 계획하는 알고리즘이다.",
    levels: {
      intro: `<p><a href="#/item/alphazero-2017">AlphaZero</a>까지의 탐색은 게임 규칙 시뮬레이터가 있어야 가능했다. "이 수를 두면 판이 이렇게 바뀐다"를 알려주는 규칙이 있어야 머릿속으로 수를 굴려볼 수 있기 때문이다. 그러나 현실의 문제 대부분에는 그런 규칙서가 없다. MuZero의 답은 규칙서를 스스로 쓰는 것이다.</p>
<p>낯선 보드게임을 규칙 설명 없이 구경만으로 익히는 사람을 떠올리면 된다. 그는 판의 모양을 전부 외우는 대신 승부에 중요한 것만 담은 자기만의 요약 노트를 만들고, "여기서 이 수를 두면 노트가 이렇게 바뀌고 점수를 이만큼 얻겠지"라며 머릿속으로 몇 수 앞을 굴려본다. 비유에서 요약 노트는 실제로 잠재 상태(latent state), 노트가 바뀌는 규칙은 학습된 역학 모델(dynamics model), 머릿속으로 굴려보기는 잠재 공간에서의 트리 탐색에 해당한다.</p>
<p>중요한 점은 이 내부 모델이 실제 화면을 복원할 필요가 전혀 없다는 것이다. 앞으로 받을 점수, 이길 가능성, 유망한 수만 정확히 맞히면 된다. 계획에 필요한 것만 배우는 이 절약 덕분에, MuZero는 규칙을 아는 AlphaZero와 대등한 바둑·체스·쇼기 실력을 내면서, 규칙을 넣어주기 어려웠던 아타리 게임들에서도 당시 최고 성능을 기록했다. 보드게임 AI와 비디오게임 AI로 갈라져 있던 두 계보가 하나의 알고리즘으로 합쳐진 지점이다.</p>`,
      mid: `<p>MuZero는 세 개의 신경망 함수를 학습한다. (1) 표현(representation) 함수: 지금까지의 관측을 받아 첫 잠재 상태를 만든다. (2) 역학(dynamics) 함수: 잠재 상태와 행동을 받아 다음 잠재 상태와 즉시 보상 예측을 내놓는다. (3) 예측(prediction) 함수: 잠재 상태에서 정책(유망한 행동 분포)과 가치(앞으로의 기대 성과)를 출력한다. 실제 환경 시뮬레이터 대신 역학 함수를 시뮬레이터 삼아, <a href="#/item/alphazero-2017">AlphaZero</a>식 몬테카를로 트리 탐색을 잠재 공간 안에서 수행하는 것이 핵심이다.</p>
<p>학습 신호가 독특하다. 잠재 상태가 실제 판과 닮았는지는 전혀 감독하지 않고, 실제 궤적을 따라 모델을 몇 스텝 펼쳤을 때 보상 예측이 실제 보상과, 가치 예측이 실제 리턴과, 정책 예측이 탐색이 만든 행동 분포와 맞도록만 end-to-end로 학습한다. 이런 모델을 가치 동등 모델(value-equivalent model)이라 부른다. 관측 복원에 모델 용량을 쓰지 않으므로, 배경 픽셀처럼 의사결정과 무관한 정보는 자연스럽게 버려진다.</p>
<p>결과적으로 MuZero는 "학습된 모델은 오차가 쌓여 모델 프리(model-free) 방법보다 못하다"던 모델 기반 강화학습의 오랜 통념을 뒤집고, 규칙이 주어진 영역과 아닌 영역 모두에서 당시 최고 수준을 달성했다.</p>`,
      deep: `<ol>
<li><b>세 함수:</b> 표현 함수 h<sub>θ</sub>: 관측 이력 o<sub>1..t</sub> → 초기 잠재 상태 s<sup>0</sup>. 역학 함수 g<sub>θ</sub>: (s<sup>k−1</sup>, a<sup>k</sup>) → (r<sup>k</sup>, s<sup>k</sup>)로 보상 예측과 다음 잠재 상태를 출력. 예측 함수 f<sub>θ</sub>: s<sup>k</sup> → (p<sup>k</sup>, v<sup>k</sup>)로 정책과 가치를 출력한다. 위첨자 k는 상상 롤아웃의 스텝 번호, θ는 전체 파라미터다.</li>
<li><b>잠재 공간 MCTS:</b> 트리의 노드는 실제 국면이 아니라 잠재 상태다. 선택은 AlphaZero와 같은 PUCT 규칙(방문 횟수 N, 평균 가치 Q, 사전확률 p 사용)을 따르고, 엣지를 새로 펼칠 때 g<sub>θ</sub>를 한 번 호출해 자식 잠재 상태와 보상을 만들고 f<sub>θ</sub>로 평가한다. 탐색 중 실제 시뮬레이터 호출은 전혀 없다. 보상 스케일이 게임마다 다른 아타리를 위해 트리 내 Q값을 최소-최대 정규화한다.</li>
<li><b>학습 목표:</b> 리플레이 버퍼의 실제 궤적에서 시점 t를 뽑아 모델을 K스텝(논문은 5) 펼치고, 각 k마다 세 손실을 더한다. 보상 손실(r<sup>k</sup>와 실제 보상), 가치 손실(v<sup>k</sup>와 n-스텝 부트스트랩 리턴 z), 정책 손실(p<sup>k</sup>와 그 시점 MCTS 방문 분포 π의 교차 엔트로피). 기울기가 역학 함수를 관통해 흐르므로, 잠재 표현은 오직 "계획에 유용한 방향"으로만 형성된다.</li>

<p>학습은 이미지-캡션 쌍 데이터셋에서 정답 문장의 로그 확률을 최대화하는 최대우도(maximum likelihood) 방식이고, 추론 시에는 빔 서치(beam search)로 확률 높은 문장을 탐색한다. 사전학습된 시각 표현을 언어 생성에 그대로 이식할 수 있다는 것, 즉 "이미지 캡셔닝은 이미지를 조건으로 한 언어 모델링"이라는 정식화가 이 논문이 선행 대비 새로 세운 관점이다.</p>`,
      deep: `<p>모델은 이미지 I가 주어졌을 때 단어열 S = (S<sub>1</sub>, …, S<sub>N</sub>)의 확률을 직접 최대화한다. 목적함수는 log p(S|I) = Σ<sub>t</sub> log p(S<sub>t</sub> | I, S<sub>1</sub>, …, S<sub>t−1</sub>)이고(Σ<sub>t</sub>는 시점 t에 대한 합), 각 시점의 조건부 확률을 LSTM이 계산한다. <a href="#/item/seq2seq-2014">Seq2Seq</a>와의 차이는 조건이 원문 문장이 아니라 이미지라는 점뿐이다.</p>
<p>기술적 변경 상세는 다음과 같다. (1) 당시 ImageNet 최고 수준이던 GoogLeNet 계열 CNN의 최종 특징을 선형 사영해 단어 임베딩과 같은 차원으로 맞춘 뒤, 첫 시점 직전에 LSTM에 한 번만 주입한다. 매 시점 반복 주입은 오히려 성능을 떨어뜨렸다고 보고된다. (2) 이후 시점에는 직전 단어의 임베딩이 입력되고, softmax로 어휘 분포를 출력한다. (3) 과적합을 피하려고 CNN은 대체로 동결한 채 LSTM과 임베딩 위주로 학습했다. 곧이어 어텐션을 도입해 이미지의 부분 영역을 시점마다 골라 보는 Show, Attend and Tell(Xu et al., 2015)이 나오면서, "이미지 전체를 고정 벡터 하나로 요약하는 병목"이라는 이 설계의 한계가 개선 대상이 된다.</p>`
    },
    impact: `<p>이미지와 텍스트를 하나의 인코더-디코더로 잇는 정식화는 이후 멀티모달 연구의 기본 틀이 됐다. 어텐션 기반 캡셔닝과 시각 질의응답(VQA)으로 이어지는 "시각 인코더 + 언어 디코더" 계보의 출발점이며, 약 10년 뒤의 LLaVA류 시각 언어 모델도 크게 보면 같은 골격 위에 서 있다.</p>`,

    levels: {
      intro: `<p>기존 이미지 분류기는 정해진 보기 안에서만 답할 수 있는 객관식 시험만 준비한 학생과 같았다. 1000개 클래스로 학습했다면 그 1000개만 알고, 새 보기가 나오면 처음부터 다시 가르쳐야 했다. CLIP은 공부 방식 자체를 바꿨다. 수억 장의 사진과 각 사진에 딸린 웹 설명문을 놓고, "이 사진의 짝인 설명문을 찾아라"라는 카드 짝 맞추기 게임을 시킨 것이다.</p>
<p>이 게임을 잘하려면 사진의 내용과 문장의 의미를 같은 기준으로 이해해야 한다. 그렇게 훈련된 모델은 처음 보는 분류 문제도 풀 수 있다. 개와 고양이를 구분하고 싶으면 "개 사진", "고양이 사진"이라는 두 문장을 만들어 놓고, 주어진 사진과 더 잘 어울리는 문장을 고르게 하면 된다. 어떤 재학습도 필요 없고, 보기 문장만 바꾸면 과제가 바뀐다.</p>

      mid: `<p>CLIP(Contrastive Language-Image Pre-training)은 두 개의 인코더로 이뤄진다. 이미지 인코더(ResNet 또는 ViT)와 텍스트 인코더(트랜스포머)가 각각 이미지와 문장을 같은 차원의 벡터로 만들고, 두 벡터의 코사인 유사도(cosine similarity)가 "이 이미지와 이 문장이 얼마나 어울리는가"의 점수가 된다.</p>
<p>학습은 배치 단위의 짝 맞추기다. 한 배치에 이미지-텍스트 쌍이 N개 있으면 가능한 조합은 N×N개인데, 이 중 대각선 위치의 N개만 진짜 쌍이다. 모델은 진짜 쌍의 유사도는 높이고 나머지 조합의 유사도는 낮추도록 학습된다. 같은 배치의 다른 샘플들이 자동으로 오답(negative) 역할을 하므로 오답을 따로 수집할 필요가 없고, 배치가 클수록 더 어려운 구분 문제가 되어 표현이 좋아진다.</p>

<p>학습이 끝나면 분류는 검색 문제로 바뀐다. 클래스 이름들을 "a photo of a {클래스}" 같은 프롬프트(prompt) 문장으로 바꿔 텍스트 인코더에 통과시켜 두고, 입력 이미지의 벡터와 유사도가 가장 높은 문장을 고르면 그것이 예측이다. 이렇게 한 zero-shot 분류가 ImageNet에서 지도학습된 ResNet-50과 맞먹는 정확도를 냈고, 스케치나 왜곡 이미지 같은 분포 변화에는 지도학습 모델보다 훨씬 강건했다.</p>`,
      deep: `<p>학습 목적함수는 대칭 InfoNCE다. 배치의 i번째 이미지 임베딩을 v<sub>i</sub>, j번째 텍스트 임베딩을 t<sub>j</sub>라 하면(둘 다 L2 정규화), 유사도는 내적 s<sub>ij</sub> = v<sub>i</sub>·t<sub>j</sub>이고, 이미지→텍스트 방향 손실은 다음과 같다. τ는 분포의 날카로움을 조절하는 온도(temperature)다.</p>
<p>L<sub>img→txt</sub> = −(1/N) Σ<sub>i</sub> log [ exp(s<sub>ii</sub>/τ) / Σ<sub>j</sub> exp(s<sub>ij</sub>/τ) ]</p>
<p>텍스트→이미지 방향으로도 같은 손실을 계산해 둘을 평균한다. 각 이미지에게는 "배치의 N개 문장 중 네 짝을 골라라", 각 문장에게는 "N개 이미지 중 네 짝을 골라라"라는 N-way 분류를 동시에 시키는 셈이다. 구현 세부는 다음이 중요하다.</p>

<li><b>온도의 학습:</b> τ는 하이퍼파라미터로 고정하지 않고 로그 스케일 파라미터로 두어 학습하며, 발산을 막기 위해 상한을 둔다.</li>

<li><b>인코더 선택:</b> ResNet 계열과 ViT 계열을 모두 실험했고, 최종적으로 ViT-L/14(고해상도 336px 미세조정판)가 최고 성능이었다. 텍스트 인코더는 GPT류 트랜스포머로, 문장 끝 토큰의 표현을 문장 임베딩으로 쓴다.</li>

<li><b>강건성:</b> ImageNet-R, ImageNet-Sketch 등 분포 이동 벤치마크에서 같은 ImageNet 정확도의 지도학습 모델보다 성능 하락 폭이 크게 작았다. 반면 세밀한 구분(꽃 품종 등)이나 개수 세기 같은 조합적 과제에는 약한 한계도 함께 보고됐다.</li>

    levels: {
      intro: `<p>이미 문장을 훌륭하게 쓰는 소설가가 있다고 하자. 그에게 그림까지 다루게 하려고 처음부터 재교육하는 것은 낭비다. Flamingo의 접근은 소설가는 그대로 두고, 그림을 보는 눈 역할의 조수와, 조수가 본 것을 소설가가 알아듣는 짧은 메모로 요약해 집필 중간중간 건네주는 비서만 새로 고용하는 것이다. 소설가와 조수는 전혀 다시 가르치지 않고, 비서만 훈련한다.</p>
<p>비유를 실제와 대응시키면, 소설가는 사전학습을 마치고 동결(frozen)된 대형 언어 모델, 조수는 역시 동결된 시각 인코더에 해당한다. 비서는 새로 학습되는 연결 모듈로, 시각 정보를 일정한 개수의 요약 조각으로 압축하는 부분(Perceiver Resampler)과 그 요약을 언어 모델의 층 사이사이에 끼워 전달하는 부분(게이트 교차 어텐션 층)으로 이뤄진다. "짧은 메모"가 압축된 시각 요약에, "집필 중간중간 건네주기"가 층 사이 삽입에 해당한다.</p>
<p>이렇게 만든 모델의 강점은 few-shot 학습이다. 문제집의 예제 두세 개를 훑어보고 바로 비슷한 문제를 푸는 학생처럼, 이미지와 답이 몇 쌍 나열된 프롬프트만 보여주면 캡션 생성, 시각 질문 답변 같은 새 과제를 별도 학습 없이 수행한다. 비유에서 "예제 훑어보기"는 실제로 프롬프트 안의 예시를 문맥으로 활용하는 in-context learning에 해당한다.</p>`,
      mid: `<p>Flamingo는 세 부품으로 구성된다. (1) 대조 학습으로 사전학습한 뒤 동결한 시각 인코더(NFNet 계열), (2) 사전학습 후 동결한 대형 언어 모델(Chinchilla 계열, 최대 70B), (3) 둘 사이를 잇는 새로 학습되는 연결 모듈이다. 학습 비용이 큰 두 기둥은 건드리지 않고 연결부만 학습한다는 것이 설계의 요점이다.</p>
<p>연결 모듈은 두 가지다. 첫째, Perceiver Resampler는 이미지·비디오에서 나오는 가변 개수의 시각 특징을 학습된 잠재(latent) 벡터들이 교차 어텐션으로 읽어 들여, 항상 고정 개수(64개)의 시각 토큰으로 압축한다. 입력이 몇 장이든 프레임이 몇 개든 언어 모델이 받는 시각 정보의 양이 일정해진다. 둘째, 동결된 언어 모델의 층 사이에 게이트 교차 어텐션(gated cross-attention) 층을 새로 삽입해, 텍스트 표현이 시각 토큰을 참조하게 한다. 게이트는 tanh 함수로 조절되는 스칼라이며 0으로 초기화되어, 학습 시작 시점의 모델은 원래 언어 모델과 완전히 같게 동작하고 학습이 진행되며 시각 정보가 점진적으로 흘러들어온다. 언어 능력을 파괴하지 않기 위한 장치다.</p>

      deep: `<p>단계별 메커니즘은 다음과 같다.</p>

<li><b>시각 특징 추출:</b> 동결된 NFNet 계열 인코더가 이미지(또는 비디오 프레임 시퀀스)를 공간 특징 격자로 변환한다. 이 인코더는 CLIP과 같은 방식의 이미지-텍스트 대조 학습으로 미리 학습해 둔 것이다.</li>
<li><b>Perceiver Resampler:</b> 학습되는 잠재 쿼리 벡터 64개가 시각 특징 전체를 키/밸류로 삼아 교차 어텐션을 반복한다. z ← z + Attention(Q=z, K/V=[x, z]) 꼴로, z는 잠재 쿼리, x는 시각 특징이다. 출력은 항상 64개의 시각 토큰이므로 이후 연산량이 입력 크기와 무관하게 고정된다.</li>
<li><b>게이트 교차 어텐션 층(gated xattn-dense):</b> 동결된 LM 블록들 사이에 새 층을 끼운다. 텍스트 표현 y가 시각 토큰 v를 참조하는 연산은 y ← y + tanh(α<sub>attn</sub>)·XAttn(y, v), 이어지는 피드포워드는 y ← y + tanh(α<sub>ff</sub>)·FFW(y)다. α<sub>attn</sub>, α<sub>ff</sub>는 층마다 학습되는 스칼라 게이트로 0에서 시작하므로 tanh(0)=0, 즉 초기에는 새 층이 항등 통과가 되어 원래 LM 출력이 보존된다.</li>

<li><b>평가:</b> 최대 모델 Flamingo-80B는 16개 시각 언어 벤치마크의 few-shot 설정에서 당시 최고 성능을 기록했고, 32개 예시 수준의 프롬프트만으로 일부 과제에서 미세조정 기반 최고 모델을 능가했다고 보고된다.</li>
</ol>
<p>정리하면 학습 파라미터는 전체의 일부인 연결부에 국한되지만, 시각 정보가 동결된 LM의 모든 깊이에 주입되므로 표현력 손실이 작다. "비싼 기둥은 재사용하고 접점만 학습한다"는 이 절충이 이후 시각 언어 모델 설계의 기본 문법이 됐다.</p>`

    impact: `<p>"동결된 LLM + 동결된 시각 인코더 + 얇은 학습 연결부"라는 공식은 이후 시각 언어 모델의 지배적 패러다임이 됐다. BLIP-2의 Q-Former, LLaVA의 선형 사영 등 후속 연결 설계가 모두 이 틀 안의 변주이고, GPT-4V류 상용 멀티모달 챗봇이 보여준 사용 경험의 학술적 원형이기도 하다. 모델 자체는 비공개였지만 OpenFlamingo, IDEFICS 같은 공개 재현이 이어지며 커뮤니티 표준 참조점이 됐다.</p>`,

      deep: `<p>단계별로 보면 다음과 같다.</p>

<li><b>1단계 — 특징 정렬 사전학습:</b> CC3M에서 명사구 빈도 균형을 고려해 필터링한 595K 이미지-텍스트 쌍으로, 캡션을 정답으로 하는 단순 생성 과제를 학습한다. 갱신되는 것은 W뿐이며, 시각 특징을 LLM이 소비 가능한 형태로 맞추는 단계다.</li>

      deep: `<p>내부 구조는 비공개이며, 이하는 공개된 정보 기준의 설명이다. 공개된 사실과 그 기술적 함의를 정리하면 다음과 같다.</p>

    levels: {

      mid: `<p>Deep Speech의 파이프라인은 단순하다. 입력은 음성 파형에서 계산한 스펙트로그램(spectrogram) — 시간에 따른 주파수별 에너지 분포 — 이고, 출력은 문자(알파벳) 확률의 시퀀스다. 네트워크는 몇 개의 완전연결 층과 하나의 양방향 순환층(bidirectional RNN)으로 구성되어, 각 시간 구간마다 "지금 어떤 글자가 발음되고 있는가"의 확률 분포를 내놓는다.</p>
<p>문제는 음성 프레임 수와 문장의 글자 수가 서로 다르다는 것이다. 같은 글자가 여러 프레임에 걸쳐 발음되고, 어디서 글자가 갈리는지 정답 라벨에는 표시가 없다. 이를 해결하는 것이 CTC(Connectionist Temporal Classification) 손실이다. CTC는 빈칸(blank) 기호를 도입해 "프레임별 출력을 어떻게 뭉쳐도 정답 문장이 되는 모든 정렬 경로"의 확률을 한꺼번에 더해 학습한다. 덕분에 프레임 단위 정렬 라벨 없이 문장 라벨만으로 학습할 수 있다.</p>

      deep: `<p>모델 구조와 학습을 단계별로 보면 다음과 같다. 입력은 파형을 짧은 창으로 잘라 얻은 스펙트로그램 프레임 시퀀스 x이고, 각 프레임에는 앞뒤 C개의 문맥 프레임을 이어 붙인다.</p>
<ol>

<li><b>양방향 순환층:</b> 4번째 층은 시간 순방향과 역방향으로 각각 상태를 전파해 합치는 양방향 RNN이다. LSTM이 아닌 단순 RNN을 택했는데, GPU 연산 효율을 우선하고 부족한 표현력은 데이터 규모로 메우겠다는 선택이다.</li>
<li><b>출력층:</b> 마지막 층은 각 프레임 t에서 문자 집합(알파벳, 공백, 아포스트로피, blank)에 대한 softmax 확률을 출력한다.</li>
<li><b>CTC 손실:</b> 정답 문장 ℓ에 대해, blank 삽입과 반복 축약으로 ℓ이 되는 모든 프레임별 문자 경로 π의 확률 합 P(ℓ|x) = Σ<sub>π∈B⁻¹(ℓ)</sub> Π<sub>t</sub> P(π<sub>t</sub>|x)를 동적 계획법으로 계산하고(B는 경로를 문장으로 축약하는 함수), −log P(ℓ|x)를 최소화한다.</li>

    impact: `<p>Deep Speech는 음성 인식을 "전문 부품의 조립"에서 "데이터와 계산의 스케일 문제"로 재정의했다. 후속작 Deep Speech 2는 같은 철학을 영어와 중국어에 확장해 end-to-end 접근의 범용성을 입증했고, 이후 CTC 계열, 어텐션 기반 seq2seq, RNN-T로 이어지는 end-to-end 음성 인식 연구 흐름의 출발점이 됐다. 오늘날의 음성 비서와 <a href="#/item/whisper-2022">Whisper</a>류 대규모 모델까지, "원신호에 가까운 입력에서 텍스트까지 단일 신경망"이라는 설계는 이 계보의 연장선에 있다.</p>`,
